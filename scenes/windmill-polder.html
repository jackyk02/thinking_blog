<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinderdijk Poldermolens — Wind, Sails &amp; Tulips</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0e1418;height:100%;
    font-family:Georgia,'Times New Roman',serif;}
  #app{position:fixed;inset:0;}
  canvas.webgl{display:block;}
  /* ---------- HUD ---------- */
  #hud{position:fixed;top:18px;left:18px;z-index:10;pointer-events:none;user-select:none;}
  .panel{
    pointer-events:auto;
    background:linear-gradient(160deg,rgba(16,24,30,.82),rgba(12,18,24,.78));
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    padding:14px 18px 12px;
    max-width:320px;
    box-shadow:0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:#f3ead8;
  }
  .panel h1{margin:0;font-size:21px;letter-spacing:.5px;font-weight:600;color:#f6efdd;}
  .panel h1 em{font-style:normal;color:#f2a541;}
  .panel .sub{margin:2px 0 10px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#9fb4bd;}
  #recBtn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:inherit;font-size:13px;letter-spacing:.4px;color:#1a1206;
    background:linear-gradient(180deg,#ffc86e,#e89a3c);
    border:1px solid #a86a1e;border-bottom-width:3px;border-radius:9px;
    padding:8px 14px;cursor:pointer;transition:transform .12s, box-shadow .12s;
    box-shadow:0 4px 14px rgba(232,154,60,.35);
  }
  #recBtn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(232,154,60,.45);}
  #recBtn:active{transform:translateY(1px);border-bottom-width:1px;}
  #recBtn.recording{background:linear-gradient(180deg,#ff7a5c,#d43a2a);color:#fff4ea;border-color:#7e1d12;}
  .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .keys span{font-size:10.5px;color:#cdd6cc;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.09);border-radius:6px;padding:4px 7px;letter-spacing:.3px;}
  .keys b{color:#ffd98a;font-family:'Courier New',monospace;}
  /* ---------- Wind rose ---------- */
  #roseWrap{position:fixed;top:18px;right:18px;z-index:10;text-align:center;user-select:none;
    background:linear-gradient(160deg,rgba(16,24,30,.8),rgba(12,18,24,.75));
    border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px 8px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  #roseWrap .roseTitle{font-size:10px;letter-spacing:2.5px;color:#9fb4bd;margin-bottom:4px;text-transform:uppercase;}
  #rose{display:block;}
  #roseLabel{font-size:12px;color:#ffd98a;margin-top:2px;letter-spacing:.5px;min-height:16px;}
  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(16px);
    z-index:10;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    background:rgba(14,20,26,.85);border:1px solid rgba(255,217,138,.35);color:#ffe6ae;
    font-size:13.5px;letter-spacing:.4px;border-radius:10px;padding:10px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ---------- Vignette / art direction ---------- */
  #vignette{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(10,14,18,.28) 100%);}
  #title-credit{position:fixed;bottom:12px;right:16px;z-index:10;color:rgba(255,255,255,.55);
    font-size:10px;letter-spacing:2px;text-transform:uppercase;pointer-events:none;user-select:none;}
  /* ---------- teaser embed: the scene only, fixed camera (see TEASER in the script) ---------- */
  #hud,#roseWrap,#toast,#title-credit,#vignette{display:none!important}
  html,body{background:#dfe8e6}
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="panel">
    <h1>Kinderdijk <em>Poldermolens</em></h1>
    <p class="sub">Five molens · the Vliet canal · spring</p>
    <button id="recBtn">
      <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="#1a1206" opacity=".9"/><circle cx="7" cy="7" r="2.6" fill="#e89a3c"/></svg>
      <span id="recLabel">Record video (.webm)</span>
    </button>
    <div class="keys">
      <span><b>W</b> wind strength</span>
      <span><b>C</b> reef / spread canvas</span>
      <span><b>Click mill</b> brake · release</span>
      <span><b>Drag</b> orbit · <b>Scroll</b> zoom</span>
    </div>
  </div>
</div>

<div id="roseWrap">
  <div class="roseTitle">Wind Rose</div>
  <canvas id="rose" width="150" height="150"></canvas>
  <div id="roseLabel">— m/s</div>
</div>

<div id="toast"></div>
<div id="title-credit">Procedural · Three.js</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* =====================================================================
   KINDERDIJK POLDERMOLENS — a row of Dutch windmills on a polder canal
   All geometry + textures generated procedurally. No downloads.
   ===================================================================== */

// ---------- renderer / scene / camera / controls (top-level) ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.domElement.classList.add('webgl');
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8e6, 240, 760);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(36, 13, 47);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-8, 8, -14);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 230;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

// ---------- teaser embed: one fixed view, no interaction ----------
const TEASER = { cam:[33, 11.5, 43], tgt:[6, 7.6, 2.3], fov:37.5, wind:3 };   // from just south of De Hoop, looking west-north-west along the row
{ const q = new URLSearchParams(location.search), v = k => q.get(k).split(',').map(Number);   // ?cam=x,y,z&tgt=x,y,z&fov=..&wind=0-3 for tuning
  if(q.get('cam')) TEASER.cam = v('cam'); if(q.get('tgt')) TEASER.tgt = v('tgt'); if(q.get('fov')) TEASER.fov = +q.get('fov'); if(q.get('wind')) TEASER.wind = +q.get('wind'); }
camera.fov = TEASER.fov; camera.updateProjectionMatrix();
camera.position.set(...TEASER.cam); controls.target.set(...TEASER.tgt);
// teaser: drag to orbit (mouse only, so touch scrolling and the wheel still scroll the page)
const TEASER_MOVE = matchMedia('(hover: hover) and (pointer: fine)').matches;
controls.enabled = TEASER_MOVE; controls.enableDamping = true; controls.enableZoom = false; controls.enablePan = false; controls.update();
renderer.domElement.style.pointerEvents = TEASER_MOVE ? 'auto' : 'none';
renderer.domElement.style.cursor = 'grab';
renderer.domElement.addEventListener('pointerdown', () => { renderer.domElement.style.cursor = 'grabbing' });
window.addEventListener('pointerup', () => { renderer.domElement.style.cursor = 'grab' });
const TEASER_REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
let teaserVisible = true, teaserFrames = 0;
if('IntersectionObserver' in window) new IntersectionObserver(es => { teaserVisible = es.some(e => e.isIntersecting); }).observe(app);

// expose for harness / debugging
window.scene = scene; window.camera = camera; window.renderer = renderer; window.controls = controls;

// ---------- composer (bloom where light sources glow) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.38, 0.65, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// =====================================================================
//  PROCEDURAL TEXTURES (canvas)
// =====================================================================
function makeTex(size, fn, repeatX=1, repeatY=1){
  const c = document.createElement('canvas'); c.width = c.height = size;
  fn(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const R = Math.random;

const grassTex = makeTex(256, (g,s)=>{
  g.fillStyle='#5f9c47'; g.fillRect(0,0,s,s);
  for(let i=0;i<2600;i++){
    const v=R(); g.fillStyle = v<.5?'rgba(46,94,36,.35)':'rgba(140,190,95,.35)';
    g.fillRect(R()*s, R()*s, 1+R()*2, 1+R()*4);
  }
  for(let i=0;i<14;i++){ g.fillStyle='rgba(70,120,50,.18)'; g.fillRect(0, R()*s, s, 6+R()*14); }
}, 60, 60);

const dikeTex = makeTex(256, (g,s)=>{
  g.fillStyle='#63a04b'; g.fillRect(0,0,s,s);
  for(let i=0;i<1400;i++){ g.fillStyle=R()<.5?'rgba(45,92,35,.4)':'rgba(150,205,110,.35)';
    g.fillRect(R()*s,R()*s,2,3+R()*4); }
}, 40, 2);

const pathTex = makeTex(128, (g,s)=>{
  g.fillStyle='#b7a687'; g.fillRect(0,0,s,s);
  for(let i=0;i<500;i++){ g.fillStyle=R()<.5?'rgba(90,78,58,.4)':'rgba(230,220,195,.4)';
    g.fillRect(R()*s,R()*s,2,2); }
}, 60, 1);

const brickTex = makeTex(256, (g,s)=>{
  g.fillStyle='#b9a48e'; g.fillRect(0,0,s,s);
  const bh=22, bw=54;
  for(let y=0;y<s/bh;y++){
    const off=(y%2)*bw/2;
    for(let x=-1;x<s/bw+1;x++){
      const h=18+R()*22, r=120+h*.6, gr=66+h*.3, b=46+h*.2;
      g.fillStyle=`rgb(${r|0},${gr|0},${b|0})`;
      g.fillRect(x*bw+off+2, y*bh+2, bw-4, bh-4);
      g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(x*bw+off+2, y*bh+2, bw-4, 3);
    }
  }
  for(let i=0;i<700;i++){ g.fillStyle='rgba(0,0,0,.12)'; g.fillRect(R()*s,R()*s,2,2); }
}, 2.2, 2.2);

const thatchTex = makeTex(256, (g,s)=>{
  g.fillStyle='#6d4e2d'; g.fillRect(0,0,s,s);
  for(let i=0;i<420;i++){
    const x=R()*s, w=1+R()*3.5, h=30+R()*80, y=R()*s;
    g.fillStyle = R()<.5 ? 'rgba(140,105,60,.55)' : 'rgba(58,38,18,.55)';
    g.fillRect(x,y-h/2,w,h);
  }
  for(let y=0;y<s;y+=34){ g.fillStyle='rgba(30,18,8,.5)'; g.fillRect(0,y,s,4);
    g.fillStyle='rgba(160,125,75,.35)'; g.fillRect(0,y+4,s,2); }
}, 2.6, 2.6);

const thatchDarkTex = makeTex(256, (g,s)=>{
  g.fillStyle='#553a20'; g.fillRect(0,0,s,s);
  for(let i=0;i<420;i++){ const x=R()*s; g.fillStyle=R()<.5?'rgba(110,82,44,.5)':'rgba(38,24,12,.55)';
    g.fillRect(x, R()*s, 1+R()*3, 20+R()*60); }
}, 2, 2);

const woodTex = makeTex(256, (g,s)=>{
  g.fillStyle='#6b4a2e'; g.fillRect(0,0,s,s);
  const rows=5;
  for(let r=0;r<rows;r++){
    const y=r*s/rows;
    g.fillStyle = `rgba(${40+R()*40|0},${26+R()*22|0},${12+R()*12|0},.45)`;
    g.fillRect(0,y,s,s/rows);
    g.fillStyle='rgba(20,12,5,.6)'; g.fillRect(0,y,s,2);
    for(let i=0;i<9;i++){ g.strokeStyle='rgba(35,22,10,.5)'; g.lineWidth=1;
      g.beginPath(); const gy=y+6+R()*(s/rows-10); g.moveTo(0,gy);
      for(let x=0;x<=s;x+=24) g.lineTo(x, gy+Math.sin(x*.05+r)*2.4); g.stroke(); }
  }
}, 1.6, 1.6);

const woodDarkTex = makeTex(128, (g,s)=>{
  g.fillStyle='#3f2a17'; g.fillRect(0,0,s,s);
  for(let i=0;i<250;i++){ g.fillStyle='rgba(15,9,4,.5)'; g.fillRect(R()*s,R()*s,1+R()*2,6+R()*30); }
}, 1, 1);

const soilTex = makeTex(256, (g,s)=>{
  g.fillStyle='#40301f'; g.fillRect(0,0,s,s);
  for(let x=0;x<s;x+=18){ g.fillStyle='rgba(15,10,5,.65)'; g.fillRect(x,0,6,s);
    g.fillStyle='rgba(120,92,60,.3)'; g.fillRect(x+6,0,2,s); }
  for(let i=0;i<900;i++){ g.fillStyle='rgba(90,66,40,.5)'; g.fillRect(R()*s,R()*s,2,2); }
}, 30, 1);

const clothTex = makeTex(256, (g,s)=>{
  g.fillStyle='#ece2c6'; g.fillRect(0,0,s,s);
  for(let i=0;i<300;i++){ g.fillStyle='rgba(120,105,70,.14)'; g.fillRect(R()*s,0,1+R()*2,s); }
  for(let y=24;y<s;y+=46){ g.fillStyle='rgba(105,88,55,.35)'; g.fillRect(0,y,s,2); }
  for(let i=0;i<12;i++){ g.fillStyle='rgba(90,75,45,.28)';
    g.beginPath(); g.ellipse(R()*s,R()*s,6+R()*14,10+R()*22,R()*3,0,7); g.fill(); }
}, 1, 1);

const cloudTexA = makeTex(256, (g,s)=>{
  g.clearRect(0,0,s,s);
  const blobs=[[.5,.66,.36],[.28,.7,.24],[.72,.7,.25],[.4,.5,.22],[.62,.5,.2],[.5,.74,.3]];
  for(const [x,y,r] of blobs){
    const gr=g.createRadialGradient(x*s,y*s,1,x*s,y*s,r*s);
    gr.addColorStop(0,'rgba(255,255,255,.96)'); gr.addColorStop(.62,'rgba(248,250,252,.85)');
    gr.addColorStop(1,'rgba(240,244,248,0)');
    g.fillStyle=gr; g.fillRect(0,0,s,s);
  }
  const sh=g.createRadialGradient(s*.5,s*.78,1,s*.5,s*.78,s*.42);
  sh.addColorStop(0,'rgba(168,180,196,.5)'); sh.addColorStop(1,'rgba(168,180,196,0)');
  g.fillStyle=sh; g.fillRect(0,0,s,s);
});
cloudTexA.wrapS = cloudTexA.wrapT = THREE.ClampToEdgeWrapping;

const dropTex = makeTex(64, (g,s)=>{
  const gr=g.createRadialGradient(s/2,s/2,1,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(230,248,255,1)'); gr.addColorStop(.4,'rgba(170,220,245,.85)');
  gr.addColorStop(1,'rgba(150,210,240,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
});
dropTex.wrapS = dropTex.wrapT = THREE.ClampToEdgeWrapping;

const aoTex = makeTex(128, (g,s)=>{
  const gr=g.createRadialGradient(s/2,s/2,2,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(0,0,0,.5)'); gr.addColorStop(.7,'rgba(0,0,0,.22)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
});
aoTex.wrapS = aoTex.wrapT = THREE.ClampToEdgeWrapping;

const cowTex = makeTex(128, (g,s)=>{
  g.fillStyle='#efe9dd'; g.fillRect(0,0,s,s);
  for(let i=0;i<9;i++){ g.fillStyle='#22262a';
    g.beginPath(); g.ellipse(R()*s,R()*s,8+R()*18,6+R()*14,R()*3,0,7); g.fill(); }
});

function textBoardTex(line1, line2){
  const c=document.createElement('canvas'); c.width=512; c.height=160;
  const g=c.getContext('2d');
  g.fillStyle='#33210f'; g.fillRect(0,0,512,160);
  g.strokeStyle='#7c5a30'; g.lineWidth=10; g.strokeRect(6,6,500,148);
  g.fillStyle='#efe0b8'; g.textAlign='center';
  g.font='bold 58px Georgia'; g.fillText(line1, 256, 76);
  g.font='italic 34px Georgia'; g.fillStyle='#c9b384'; g.fillText(line2, 256, 126);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

// =====================================================================
//  LIGHTS & SKY
// =====================================================================
const SUN_DIR = new THREE.Vector3(0.62, 0.42, 0.38).normalize();
const sun = new THREE.DirectionalLight(0xffedd2, 2.7);
sun.position.copy(SUN_DIR).multiplyScalar(190);
sun.target.position.set(0, 0, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -95; sun.shadow.camera.right = 95;
sun.shadow.camera.top = 80;   sun.shadow.camera.bottom = -75;
sun.shadow.camera.near = 30;  sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 1.6;
sun.shadow.radius = 4;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbfe0f6, 0x46603a, 0.95));
const amb = new THREE.AmbientLight(0xfff3e0, 0.28); scene.add(amb);

// gradient sky dome + sun disc shader (drives bloom gently)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms: { uSunDir: { value: SUN_DIR } },
  vertexShader: `
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 uSunDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 zen = vec3(0.16,0.42,0.76);
      vec3 mid = vec3(0.46,0.69,0.88);
      vec3 hor = vec3(0.93,0.90,0.80);
      vec3 col = mix(hor, mid, smoothstep(-0.02,0.16,h));
      col = mix(col, zen, smoothstep(0.12,0.68,h));
      if(h < 0.0) col = mix(hor, vec3(0.55,0.63,0.55), smoothstep(0.0,-0.25,h));
      float s = max(dot(d, normalize(uSunDir)), 0.0);
      col += vec3(1.0,0.96,0.82) * pow(s, 700.0) * 2.2;
      col += vec3(1.0,0.88,0.58) * pow(s, 14.0) * 0.30;
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(880, 32, 20), skyMat));

// =====================================================================
//  GROUND · CANAL · DIKES
// =====================================================================
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400),
  new THREE.MeshStandardMaterial({ map:grassTex, roughness:.96, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.position.y = 0; ground.receiveShadow = true;
scene.add(ground);

// canal : reflective water (planar reflection) + milky overlay + dikes
const water = new Reflector(new THREE.PlaneGeometry(400, 8.6), {
  clipBias: 0.003, textureWidth: 2048, textureHeight: 2048, color: 0x9db4b8 });
water.rotation.x = -Math.PI/2; water.position.set(0, 0.72, 0);
scene.add(water);
const waterTint = new THREE.Mesh(new THREE.PlaneGeometry(400, 8.6),
  new THREE.MeshBasicMaterial({ color:0x39637e, transparent:true, opacity:0.24, depthWrite:false }));
waterTint.rotation.x = -Math.PI/2; waterTint.position.set(0, 0.735, 0); waterTint.renderOrder = 2;
scene.add(waterTint);

const dikeMat = new THREE.MeshStandardMaterial({ map:dikeTex, roughness:.95 });
const dikeN = new THREE.Mesh(new THREE.BoxGeometry(400, 1.9, 2.7), dikeMat);
dikeN.position.set(0, 0.4, -5.75); dikeN.receiveShadow = dikeN.castShadow = true; scene.add(dikeN);
const dikeS = dikeN.clone(); dikeS.position.z = 5.75; scene.add(dikeS);
const pathMat = new THREE.MeshStandardMaterial({ map:pathTex, roughness:.9 });
const pathS = new THREE.Mesh(new THREE.BoxGeometry(400, 0.1, 1.25), pathMat);
pathS.position.set(0, 1.36, 5.75); pathS.receiveShadow = true; scene.add(pathS);
const pathN = pathS.clone(); pathN.position.z = -5.75; scene.add(pathN);

// soft contact-shadow blob helper
function aoBlob(x, z, r, opacity=1){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(r*2, r*2),
    new THREE.MeshBasicMaterial({ map:aoTex, transparent:true, depthWrite:false, opacity }));
  m.rotation.x = -Math.PI/2; m.position.set(x, 0.03, z); m.renderOrder = 1; scene.add(m);
}

// =====================================================================
//  TULIP FIELDS — instanced, wind-swayed (vertex-shader bend)
// =====================================================================
const uTimeU = { value: 0 };
const uWindU = { value: 0.5 };
function addSway(mat){
  mat.onBeforeCompile = (sh)=>{
    sh.uniforms.uTime = uTimeU; sh.uniforms.uWind = uWindU;
    sh.vertexShader = 'uniform float uTime;\nuniform float uWind;\n' +
      sh.vertexShader.replace('#include <begin_vertex>', `
        #include <begin_vertex>
        #ifdef USE_INSTANCING
          vec4 ip = instanceMatrix * vec4(0.0,0.0,0.0,1.0);
          float ph = ip.x*0.55 + ip.z*0.83;
          float wgt = clamp(position.y/0.5, 0.0, 1.0);
          float sw = sin(uTime*2.15 + ph + sin(uTime*0.85 + ph*1.7)*0.6) * uWind * wgt*wgt;
          transformed.x += sw*0.24;
          transformed.z += sw*0.11;
        #endif
      `);
  };
}

function tubeBetween(a, b, r, mat, seg=8){
  const d = b.clone().sub(a); const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  m.castShadow = true; return m;
}
function bodyRadiusAt(y){ return 2.85 + (1.75-2.85) * ((y-1.4)/8.6); }

function buildWindmill(def, index){
  const g = new THREE.Group(); g.position.set(def.x, 0, def.z);
  const bodyMat = def.style === 'brick' ? brickMat : thatchMat;

  // stone footing + mound
  g.add(M(new THREE.CylinderGeometry(3.15, 3.5, 1.4, 12), stoneMat, 0, 0.7, 0));
  // tapered body
  g.add(M(new THREE.CylinderGeometry(1.75, 2.85, 8.6, 12), bodyMat, 0, 1.4 + 4.3, 0));
  // shadow gap ring
  g.add(M(new THREE.CylinderGeometry(1.78, 1.78, 0.18, 12), woodDarkMat, 0, 10.05, 0));

  // ---- cap group (turns to face wind) ----
  const cap = new THREE.Group(); cap.position.set(0, 10.12, 0); g.add(cap);
  cap.add(M(new THREE.CylinderGeometry(0.55, 2.02, 1.95, 12), thatchDark, 0, 0.95, 0));
  cap.add(M(new THREE.ConeGeometry(0.62, 0.7, 12), thatchDark, 0, 2.25, 0));
  cap.add(M(new THREE.SphereGeometry(0.16, 8, 8), brassMat, 0, 2.66, 0));
  // tail pole
  const tail = M(new THREE.CylinderGeometry(0.085, 0.085, 4.6, 6), woodDarkMat, 0, 0.5, -3.1);
  tail.rotation.x = -1.18; cap.add(tail);
  // windshaft
  const shaft = M(new THREE.CylinderGeometry(0.2, 0.24, 2.7, 10), steelMat, 0, 1.12, 1.55);
  shaft.rotation.x = Math.PI/2 - 0.17; cap.add(shaft);

  // brake lever sticking out at the rear-left of the cap
  const leverPivot = new THREE.Group(); leverPivot.position.set(-1.45, 0.75, -0.75); cap.add(leverPivot);
  const lever = M(new THREE.BoxGeometry(0.13, 1.75, 0.13), woodDarkMat, 0, 0.75, 0);
  const grip  = M(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshStandardMaterial({color:0x7a1e12, roughness:.6}), 0, 1.62, 0);
  leverPivot.add(lever, grip);

  // ---- rotor & sails ----
  const rotor = new THREE.Group(); rotor.position.set(0, 1.35, 2.6); cap.add(rotor);
  const hub = M(new THREE.CylinderGeometry(0.34, 0.4, 0.85, 10), woodDarkMat, 0, 0, 0);
  hub.rotation.x = Math.PI/2; rotor.add(hub);
  rotor.add(M(new THREE.ConeGeometry(0.36, 0.55, 10), steelMat, 0, 0, 0.65)).rotation;
  const hubNose = rotor.children[rotor.children.length-1]; hubNose.rotation.x = Math.PI/2;
  const cloths = [];
  for(let k=0;k<4;k++){
    const sail = makeSail();
    sail.rotation.z = k*Math.PI/2 + Math.PI/4;
    rotor.add(sail); cloths.push(sail.userData.cloth);
  }

  // ---- wooden gallery (stage) ----
  const galY = 5.65;
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.95, 3.18, 12, 1),
    new THREE.MeshStandardMaterial({ map:woodTex, roughness:.85, side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI/2; ring.position.y = galY; ring.receiveShadow = true; g.add(ring);
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    g.add(M(new THREE.CylinderGeometry(0.055, 0.055, 0.82, 6), woodDarkMat, Math.cos(a)*3.02, galY+0.42, Math.sin(a)*3.02));
    const a2 = (i+0.5)/12*Math.PI*2;
    g.add(tubeBetween(new THREE.Vector3(Math.cos(a2)*1.35, galY-1.45, Math.sin(a2)*1.35),
                      new THREE.Vector3(Math.cos(a2)*3.02, galY-0.02, Math.sin(a2)*3.02), 0.075, woodDarkMat, 6));
  }
  const handrail = new THREE.Mesh(new THREE.TorusGeometry(3.02, 0.055, 6, 30), woodMat);
  handrail.rotation.x = Math.PI/2; handrail.position.y = galY + 0.85; handrail.castShadow = true; g.add(handrail);

  // ---- door (canal side) ----
  const doorR = bodyRadiusAt(2.35);
  const door = M(new THREE.BoxGeometry(1.2, 2.0, 0.14), doorMat, def.gear ? -1.15 : 0, 2.4, def.gear ? doorR-0.45 : doorR-0.06);
  door.rotation.x = -0.128; if(def.gear) door.rotation.y = 0.42; g.add(door);
  const doorStep = M(new THREE.CylinderGeometry(0.7, 0.7, 0.18, 10), stoneMat, def.gear ? -1.6 : 0, 1.44, doorR+0.15);
  g.add(doorStep);

  // name board above door
  const boardTex = textBoardTex(def.name.toUpperCase(), 'ANNO 1741');
  const board = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 0.55),
    new THREE.MeshStandardMaterial({ map:boardTex, roughness:.8 }));
  board.position.set(def.gear ? -1.32 : 0, 3.62, def.gear ? doorR-0.28 : doorR+0.02);
  board.rotation.x = -0.128; if(def.gear) board.rotation.y = 0.42; g.add(board);

  // ---- glowing windows (bloom picks these up) ----
  const winGeo = new THREE.PlaneGeometry(0.5, 0.6);
  const frameGeo = new THREE.PlaneGeometry(0.66, 0.76);
  const frameMat = woodDarkMat;
  const winSpots = def.gear
    ? [{x:1.05, y:3.0, z:bodyRadiusAt(3.0)+0.02, ry:-0.4}, {x:-2.45, y:5.2, z:bodyRadiusAt(5.2)*0.62, ry:0.9}]
    : [{x:-1.55, y:4.6, z:bodyRadiusAt(4.6)*0.8, ry:0.62}, {x:1.55, y:4.6, z:bodyRadiusAt(4.6)*0.8, ry:-0.62},
       {x:0, y:6.6, z:bodyRadiusAt(6.6)+0.02, ry:0}];
  for(const w of winSpots){
    const f = new THREE.Mesh(frameGeo, frameMat); f.position.set(w.x, w.y, w.z); f.rotation.y = w.ry; f.rotation.x=-0.128; g.add(f);
    const m = new THREE.Mesh(winGeo, windowMat); m.position.set(w.x*1.02, w.y, w.z*1.02 + 0.045); m.rotation.y = w.ry; m.rotation.x=-0.128; g.add(m);
  }

  // ================= GEAR HALL + SCOOP WHEEL (mill index 2) =================
  let gear1=null, gear2=null, scoop=null;
  if(def.gear){
    const py = 4.35, pr = bodyRadiusAt(py);
    // dark open panel
    const panel = M(new THREE.BoxGeometry(1.7, 1.5, 0.18),
      new THREE.MeshStandardMaterial({ color:0x120c07, roughness:.95 }), 0, py, pr-0.12);
    panel.rotation.x = -0.128; g.add(panel);
    // trim
    g.add(M(new THREE.BoxGeometry(1.86, 0.12, 0.2), woodDarkMat, 0, py+0.78, pr-0.1)).rotation;
    // gear pair visible through the opening
    const mkGear = (r, teeth)=>{
      const grp = new THREE.Group();
      const disc = M(new THREE.CylinderGeometry(r, r, 0.17, 18), brassMat, 0, 0, 0);
      disc.rotation.x = Math.PI/2; grp.add(disc);
      for(let i=0;i<teeth;i++){
        const a = i/teeth*Math.PI*2;
        const tooth = M(new THREE.BoxGeometry(r*0.32, r*0.32, 0.16), brassMat, Math.cos(a)*(r+r*0.14), Math.sin(a)*(r+r*0.14), 0);
        tooth.rotation.z = a; grp.add(tooth);
      }
      const axle = M(new THREE.CylinderGeometry(r*0.22, r*0.22, 0.3, 8), steelMat, 0, 0, 0);
      axle.rotation.x = Math.PI/2; grp.add(axle);
      return grp;
    };
    gear1 = mkGear(0.52, 12); gear1.position.set(-0.28, py+0.12, pr+0.04); g.add(gear1);
    gear2 = mkGear(0.32, 9);  gear2.position.set(0.42, py-0.38, pr+0.04); g.add(gear2);

    // scoop wheel at the canal-side ditch
    const wheelPos = new THREE.Vector3(3.75, 1.18, 1.1);
    scoop = new THREE.Group(); scoop.position.copy(wheelPos); g.add(scoop);
    const ringT = new THREE.TorusGeometry(1.32, 0.1, 6, 22);
    const rA = M(ringT, woodDarkMat, 0, 0, 0.42); scoop.add(rA);
    const rB = M(ringT, woodDarkMat, 0, 0, -0.42); scoop.add(rB);
    for(let i=0;i<12;i++){
      const a = i/12*Math.PI*2;
      const pad = M(new THREE.BoxGeometry(0.16, 0.52, 0.95), woodMat, Math.cos(a)*1.3, Math.sin(a)*1.3, 0);
      pad.rotation.z = a + Math.PI/2; scoop.add(pad);
      const sp1 = M(new THREE.BoxGeometry(0.07, 2.6, 0.07), latticeMat, 0, 0, 0.42);
      sp1.rotation.z = a; scoop.add(sp1);
      const sp2 = sp1.clone(); sp2.position.z = -0.42; scoop.add(sp2);
    }
    const axle = M(new THREE.CylinderGeometry(0.14, 0.14, 1.5, 10), steelMat, 0, 0, 0);
    axle.rotation.x = Math.PI/2; scoop.add(axle);
    // A-frame supports
    g.add(tubeBetween(new THREE.Vector3(wheelPos.x-1.1, 0, wheelPos.z), new THREE.Vector3(wheelPos.x, wheelPos.y, wheelPos.z+0.42), 0.09, woodDarkMat));
    g.add(tubeBetween(new THREE.Vector3(wheelPos.x+1.1, 0, wheelPos.z), new THREE.Vector3(wheelPos.x, wheelPos.y, wheelPos.z-0.42), 0.09, woodDarkMat));
    // line shaft from gear panel down to the scoop wheel
    g.add(tubeBetween(new THREE.Vector3(0.9, 3.6, pr+0.02), new THREE.Vector3(wheelPos.x, wheelPos.y+0.1, wheelPos.z), 0.075, steelMat));
    // pool the wheel dips into
    const pool = M(new THREE.CylinderGeometry(2.05, 2.05, 0.34, 18),
      new THREE.MeshStandardMaterial({ color:0x14281f, roughness:.15, metalness:.55 }), wheelPos.x, 0.18, wheelPos.z);
    pool.receiveShadow = true; g.add(pool);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.17, 6, 18), stoneMat);
    rim.rotation.x = Math.PI/2; rim.position.set(wheelPos.x, 0.37, wheelPos.z); rim.castShadow = true; g.add(rim);

    // elevated wooden flume carrying scooped water over the dike into the canal
    const P1 = new THREE.Vector3(wheelPos.x - 0.2, 2.62, wheelPos.z - 0.4);
    const P2 = new THREE.Vector3(1.55, 1.98, 10.35);   // local z → world ≈ -3.65 (over the canal)
    const mid = P1.clone().add(P2).multiplyScalar(0.5);
    const len = P1.distanceTo(P2);
    const flume = new THREE.Group(); flume.position.copy(mid);
    flume.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), P2.clone().sub(P1).normalize());
    flume.add(M(new THREE.BoxGeometry(len, 0.1, 0.62), woodMat, 0, 0, 0));
    flume.add(M(new THREE.BoxGeometry(len, 0.34, 0.07), woodMat, 0, 0.17, 0.28));
    flume.add(M(new THREE.BoxGeometry(len, 0.34, 0.07), woodMat, 0, 0.17, -0.28));
    const wplane = new THREE.Mesh(new THREE.PlaneGeometry(len*0.96, 0.46),
      new THREE.MeshStandardMaterial({ color:0x7fb6cf, transparent:true, opacity:.75, roughness:.1, metalness:.4, emissive:0x2a4a58, emissiveIntensity:.4 }));
    wplane.rotation.x = -Math.PI/2; wplane.position.y = 0.18; flume.add(wplane);
    g.add(flume);
    g.add(tubeBetween(new THREE.Vector3(mid.x, 0, mid.z), new THREE.Vector3(mid.x, mid.y-0.05, mid.z), 0.11, woodDarkMat));
    g.add(tubeBetween(new THREE.Vector3(P2.x, 1.32, P2.z), new THREE.Vector3(P2.x, P2.y, P2.z), 0.1, woodDarkMat));
  }

  scene.add(g);
  aoBlob(def.x, def.z, 4.6, 0.9);

  // invisible-but-raycastable proxy for clicking
  const proxy = new THREE.Mesh(new THREE.CylinderGeometry(4.8, 4.8, 14, 8),
    new THREE.MeshBasicMaterial({ colorWrite:false, depthWrite:false, depthTest:false }));
  proxy.position.set(def.x, 6.2, def.z); proxy.userData.millIndex = index;
  proxy.castShadow = false; proxy.receiveShadow = false;
  scene.add(proxy); hitProxies.push(proxy);

  return {
    index, def, name:def.name, group:g, cap, rotor, cloths, leverPivot,
    gear1, gear2, scoop,
    braked:false, rotorAngle:index*1.35 + 0.6, omega:1.65, capYaw:0.6, leverA:0
  };
}

// =====================================================================
//  WIND MODEL — multi-sine noise field, torque balance vs scoop load
// =====================================================================
const WIND_LEVELS = [2.4, 5.2, 7.8, 9.0];   // teaser: top level lowered from 10.8
const WIND_NAMES  = ['Calm', 'Breeze', 'Fresh', 'Gale'];
let windLevel = TEASER.wind;   // 3 = Gale, 9.0 m/s here
let windSpeed = 5.2, windDir = 2.1;
function windAt(t){
  const gust = 0.72 + 0.28*Math.sin(t*0.23 + 1.7) + 0.17*Math.sin(t*0.61 + 0.5) + 0.11*Math.sin(t*1.7 + 2.9);
  const speed = WIND_LEVELS[windLevel] * THREE.MathUtils.clamp(gust, 0.35, 1.32);
  const dir = 2.15 + 0.38*Math.sin(t*0.055 + 0.4) + 0.17*Math.sin(t*0.14 + 2.1);
  return { speed, dir };
}
const angDiff = (a, b) => { let d = a - b; while(d > Math.PI) d -= Math.PI*2; while(d < -Math.PI) d += Math.PI*2; return d; };

// ---------- simulation state ----------
let simTime = 0;
let reefTarget = 0;   // 0 = sails spread, 1 = reefed
let reefT = 0;

function resetSim(){
  simTime = 0;
  reefT = 0; reefTarget = 0;
  const w0 = windAt(0);
  for(const m of mills){
    m.rotorAngle = m.index*1.35 + 0.6;
    m.omega = 1.65;
    m.capYaw = -w0.dir;
    m.leverA = 0;
    m.braked = false;
  }
}
function stepSim(dt){
  const w = windAt(simTime); windSpeed = w.speed; windDir = w.dir;
  reefT += (reefTarget - reefT) * Math.min(1, dt*2.4);
  for(const m of mills){
    const canvasFactor = reefTarget > 0.5 ? (1 - 0.72*reefT) : 1;   // reefed ≈ 28% cloth
    const aero = 0.9 * windSpeed * windSpeed * Math.max(0.22, canvasFactor*canvasFactor*0.9+0.1)
               * (0.85 + 0.28*Math.sin(2*m.rotorAngle + m.index*1.7));
    const load = 8.0;   // teaser: De Ster's pump load (was 13) made it stall in lulls at 9 m/s
    const drag = 1.05 * m.omega * m.omega;
    if(m.braked){
      m.omega += (0 - m.omega) * Math.min(1, dt*1.9);
    } else {
      const alpha = (aero - load - drag) / 7.0;
      m.omega = THREE.MathUtils.clamp(m.omega + alpha*dt, 0, 4.6);
      if(aero < load && m.omega < 0.02) m.omega = 0;
    }
    m.rotorAngle += m.omega * dt;
    const targetYaw = -windDir;
    m.capYaw += angDiff(targetYaw, m.capYaw) * Math.min(1, dt*0.45);
    m.leverA += ((m.braked ? 1 : 0) - m.leverA) * Math.min(1, dt*2.6);
  }
}

// =====================================================================
//  VISUAL SYNC (pure function of state + simTime → seek()-deterministic)
// =====================================================================
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
function syncFromState(){
  const w = windAt(simTime); windSpeed = w.speed; windDir = w.dir;
  for(const m of mills){
    m.rotor.rotation.z = -m.rotorAngle;
    m.cap.rotation.y = m.capYaw;
    m.leverPivot.rotation.z = 0.5 + m.leverA*1.05;
    const sy = 1 - 0.72*reefT;
    for(const c of m.cloths) c.scale.y = sy;
    if(m.gear1){
      m.gear1.rotation.z =  m.rotorAngle*1.9;
      m.gear2.rotation.z = -m.rotorAngle*1.9*(12/9) + 0.24;
      m.scoop.rotation.z = -m.rotorAngle*0.33;
    }
  }
  // droplets from flume end into canal (only when De Ster is pumping)
  const pumping = !mills[2].braked && windSpeed > 2.2;
  for(let i=0;i<DROP_N;i++){
    if(!pumping){ dropPos[i*3+1] = -60; continue; }
    const age = (simTime + i*0.115) % 1.25;
    if(age > 1.02){ dropPos[i*3+1] = -60; continue; }
    const jx = (dHash(i)-0.5)*0.5, jz = (dHash(i+99)-0.5)*0.5;
    dropPos[i*3+0] = dropletEmitWorld.x + jx*(0.4+age*1.6) + age*0.25;
    dropPos[i*3+1] = dropletEmitWorld.y + 0.35*age - 4.6*age*age;
    dropPos[i*3+2] = dropletEmitWorld.z + jz*(0.4+age*1.6) - age*0.35;
  }
  dropGeo.attributes.position.needsUpdate = true;

  // barge drift (ping-pong along canal)
  {
    // teaser: always sailing forward (+x, toward the camera side) at 2.5 units/s; it starts at De Valk (x = -32), the 2nd
    // mill in the view, and after leaving the view it re-enters far up the canal
    const fwd = true;
    const x = -150 + ((simTime*2.5 + 128) % 300);   // starts in front of De Valk on screen (the canal is nearer the camera than the mills)
    barge.position.set(x, 0.05 + Math.sin(simTime*0.9)*0.05 + Math.sin(simTime*1.7+1)*0.02, 0);
    barge.rotation.y = fwd ? 0 : Math.PI;
    barge.rotation.z = Math.sin(simTime*0.7 + 1.1)*0.022;
    barge.rotation.x = Math.sin(simTime*1.1 + 0.4)*0.012;
  }
  // cyclist (ping-pong along dike crest, z = +5.75)
  {
    const raw = (simTime*6.4 + 60) % 520;
    const fwd = raw < 260;
    const x = fwd ? -130 + raw : 130 - (raw - 260);
    const dir = fwd ? 1 : -1;
    cyclist.position.set(x, 1.38 + Math.abs(Math.sin(simTime*7.5))*0.035, 5.75);
    cyclist.rotation.y = fwd ? 0 : Math.PI;
    const pedal = simTime*5.2;
    const wheels = cyclist.userData.wheels;
    wheels[0].rotation.z = -simTime*18*dir; wheels[1].rotation.z = -simTime*18*dir;
    const C = cyclist.userData.C, hip = cyclist.userData.hip;
    for(const [leg, phase, zs] of [[cyclist.userData.legL, pedal, 0.12], [cyclist.userData.legR, pedal+Math.PI, -0.12]]){
      _v1.set(C.x + Math.cos(phase)*0.19, C.y + Math.sin(phase)*0.19, zs);
      _v2.set(hip.x, hip.y, zs*0.8);
      leg.position.copy(_v2).add(_v1).multiplyScalar(0.5);
      const d = _v1.sub(_v2); const len = d.length();
      leg.scale.y = len / 0.85;
      leg.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
    }
  }
  // birds soar
  for(const b of birds){
    const a = simTime*b.speed + b.phase;
    const px = 15 + Math.cos(a)*b.radius, pz = -18 + Math.sin(a)*b.radius*0.8, py = b.height + Math.sin(simTime*0.5 + b.phase)*3;
    b.grp.position.set(px, py, pz);
    b.grp.rotation.y = -a;
    const flap = Math.sin(simTime*6.5 + b.phase*2)*0.55;
    b.wl.rotation.x = flap; b.wr.rotation.x = -flap;
  }
  // clouds drift with the wind (wrapped)
  for(const c of clouds){
    let x = c.bx + simTime*c.speed*(0.7 + windSpeed*0.12);
    x = ((x + 280) % 560 + 560) % 560 - 280;
    c.sp.position.x = x;
  }
  // tulips
  uTimeU.value = simTime;
  uWindU.value = THREE.MathUtils.clamp(windSpeed/11, 0.08, 1.15);
}

// =====================================================================
//  AUDIO — brake squeal & release clunk (Web Audio, procedural)
// =====================================================================
let actx = null;
function audio(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); return actx; }
function playSqueal(){
  try{
    const a = audio(), t = a.currentTime;
    const o = a.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(1350, t);
    o.frequency.exponentialRampToValueAtTime(620, t + 0.72);
    const vib = a.createOscillator(); vib.frequency.value = 34;
    const vibGain = a.createGain(); vibGain.gain.value = 90;
    vib.connect(vibGain); vibGain.connect(o.frequency);
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 9;
    bp.frequency.setValueAtTime(1750, t); bp.frequency.exponentialRampToValueAtTime(760, t + 0.72);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.04);
    g.gain.setValueAtTime(0.2, t + 0.42); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.78);
    o.connect(bp); bp.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.82); vib.start(t); vib.stop(t + 0.82);
    // wooden creak — filtered noise burst
    const len = a.sampleRate * 0.4, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
    const noise = a.createBufferSource(); noise.buffer = buf;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(640, t); lp.frequency.exponentialRampToValueAtTime(180, t + 0.4);
    const ng = a.createGain(); ng.gain.setValueAtTime(0.3, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    noise.connect(lp); lp.connect(ng); ng.connect(a.destination); noise.start(t);
  }catch(e){ /* audio unavailable */ }
}
function playRelease(){
  try{
    const a = audio(), t = a.currentTime;
    const o = a.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(88, t + 0.22);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.32);
  }catch(e){}
}

// =====================================================================
//  INTERACTION — click mill to brake / release · W wind · C canvas
// =====================================================================
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
function pickMill(ev){
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.set(((ev.clientX - rect.left)/rect.width)*2 - 1, -((ev.clientY - rect.top)/rect.height)*2 + 1);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(hitProxies, false);
  return hits.length ? mills[hits[0].object.userData.millIndex] : null;
}
renderer.domElement.addEventListener('pointerdown', (ev)=>{
  return;   // teaser: no braking
  const m = pickMill(ev); if(!m) return;
  m.braked = !m.braked;
  if(m.braked){ playSqueal(); toast(m.name + ' braked — sails easing to a stop'); }
  else { playRelease(); toast(m.name + ' released — sails drawing again'); }
  updateBench();
});
renderer.domElement.addEventListener('pointermove', (ev)=>{
  return;   // teaser: the canvas keeps its grab cursor
});
window.addEventListener('keydown', (ev)=>{
  return;   // teaser: no keys
  const k = ev.key.toLowerCase();
  if(k === 'w'){
    windLevel = (windLevel + 1) % WIND_LEVELS.length;
    toast('Wind: ' + WIND_NAMES[windLevel] + ' (' + WIND_LEVELS[windLevel].toFixed(1) + ' m/s)');
  } else if(k === 'c'){
    reefTarget = reefTarget > 0.5 ? 0 : 1;
    toast(reefTarget > 0.5 ? 'Sail canvas reefed — shortened cloth' : 'Sail canvas spread full');
  }
});

// =====================================================================
//  SHOWCASE — deterministic 12-second cinematic (window.showcase)
// =====================================================================
const SHOW_DURATION = 12;
const camKeys = [
  [ 74, 27,  89], [ 36, 13.5, 46], [ 13,  8.2, 19], [-15, 4.6,  6.0],
  [  3.6, 3.2, -7.0], [-24, 33, 36], [ 49, 19, 53], [ 36, 13,  47]
].map(p => new THREE.Vector3(p[0], p[1], p[2]));
const tgtKeys = [
  [  0, 9.0, -14], [  0, 9.2, -14.5], [  2, 9.6, -15], [  0, 9.4, -15],
  [  0.4, 4.0, -12.7], [  0, 0.8, -16], [ -6, 8.2, -14], [ -8, 8.0, -14]
].map(p => new THREE.Vector3(p[0], p[1], p[2]));
const camCurve = new THREE.CatmullRomCurve3(camKeys, false, 'centripetal', 0.5);
const tgtCurve = new THREE.CatmullRomCurve3(tgtKeys, false, 'centripetal', 0.5);

function renderFrame(){
  updateBench(); drawRose(); composer.render();
}
function seek(t){
  t = THREE.MathUtils.clamp(t, 0, SHOW_DURATION);
  resetSim();
  const h = 1/120;
  let s = 0;
  while(s < t){
    const step = Math.min(h, t - s);
    simTime += step; stepSim(step); s += step;
  }
  simTime = t;
  syncFromState();
  const u = t / SHOW_DURATION;
  camera.position.copy(camCurve.getPoint(u));
  controls.target.copy(tgtCurve.getPoint(u));
  camera.lookAt(controls.target);
  renderFrame();
}
window.showcase = { duration: SHOW_DURATION, seek };

// ---------- Record video button ----------
const recBtn = document.getElementById('recBtn');
const recLabel = document.getElementById('recLabel');
let recording = false;
recBtn.addEventListener('click', ()=>{
  if(recording) return;
  recording = true;
  recBtn.classList.add('recording');
  recLabel.textContent = 'Recording…';
  controls.enabled = false;
  const stream = renderer.domElement.captureStream(60);
  let mime = 'video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'polder-showcase.webm'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    recording = false;
    recBtn.classList.remove('recording');
    recLabel.textContent = 'Record video (.webm)';
    controls.enabled = true;
    toast('Showcase saved — polder-showcase.webm');
  };
  rec.start(250);
  const start = performance.now();
  const tick = ()=>{
    const t = (performance.now() - start) / 1000;
    if(t >= SHOW_DURATION){ rec.stop(); return; }
    seek(t);
    requestAnimationFrame(tick);
  };
  seek(0);
  requestAnimationFrame(tick);
});

// =====================================================================
//  MAIN LOOP
// =====================================================================
resetSim();
syncFromState();
const clock = new THREE.Clock();
let roseTick = 0;
function animate(){
  requestAnimationFrame(animate);
  if(recording) return; // showcase drives the frames while recording
  if(!teaserVisible || document.hidden) { clock.getDelta(); return; }   // teaser: idle when off screen
  if(TEASER_REDUCE && teaserFrames++ > 2) return;                      // reduced motion: a still frame
  const dt = Math.min(0.05, clock.getDelta());
  simTime += dt;
  stepSim(dt);
  syncFromState();
  controls.update();
  roseTick++;
  updateBench();
  if(roseTick % 4 === 0) drawRose();
  composer.render();
}
animate();

// ---------- resize ----------
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
