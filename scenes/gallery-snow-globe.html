<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Snow Globe — a winter village on the windowsill</title>
<style>
  :root{
    --cream:#f3e9d7;
    --dim:rgba(243,233,215,.62);
    --panel:rgba(12,16,20,.55);
    --accent:#e9b86a;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1216;font-family:Georgia,'Times New Roman',serif;}
  canvas{display:block;}
  #ui{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none;}
  #title{
    position:absolute;top:26px;left:32px;color:var(--cream);
    font-size:15px;letter-spacing:.42em;text-transform:uppercase;
    text-shadow:0 2px 14px rgba(0,0,0,.75);
  }
  #title span{
    display:block;margin-top:7px;font-size:10px;letter-spacing:.18em;
    text-transform:none;font-style:italic;color:var(--dim);
  }
  #hint{
    position:absolute;bottom:22px;left:32px;color:var(--dim);
    font-size:11.5px;letter-spacing:.08em;
    background:var(--panel);border:1px solid rgba(243,233,215,.14);
    border-radius:10px;padding:8px 14px;backdrop-filter:blur(8px);
  }
  #hint b{color:var(--cream);font-weight:normal;border:1px solid rgba(243,233,215,.35);
    border-radius:4px;padding:0 5px;margin:0 2px;font-size:10.5px;}
  #recBtn{
    position:absolute;top:24px;right:28px;pointer-events:auto;cursor:pointer;
    color:var(--cream);background:var(--panel);
    border:1px solid rgba(233,184,106,.55);border-radius:999px;
    font-family:Georgia,serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    padding:11px 22px;backdrop-filter:blur(8px);transition:all .25s ease;
  }
  #recBtn:hover{background:rgba(60,38,18,.72);border-color:var(--accent);box-shadow:0 0 24px rgba(233,184,106,.28);}
  #recBtn.rec{border-color:#e0655a;color:#ffc9c2;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(224,101,90,.0);}50%{box-shadow:0 0 22px rgba(224,101,90,.55);}}
  #caption{
    position:absolute;bottom:64px;left:50%;transform:translateX(-50%);
    color:var(--cream);font-style:italic;font-size:17px;letter-spacing:.06em;
    text-shadow:0 2px 16px rgba(0,0,0,.85);text-align:center;
    background:var(--panel);border:1px solid rgba(243,233,215,.14);
    border-radius:12px;padding:10px 26px;backdrop-filter:blur(8px);
    opacity:0;transition:opacity .45s ease;pointer-events:none;max-width:80vw;
  }
  #credit{position:absolute;bottom:22px;right:28px;color:rgba(243,233,215,.30);font-size:10px;letter-spacing:.22em;text-transform:uppercase;}
  body.showcasing #hint, body.showcasing #credit{opacity:.15;}
</style>
<style>/* blog-clean: only the 3D canvas is shown in the blog; titles, panels and buttons are hidden */
body *:not(canvas):not(:has(canvas)):not(script):not(style){visibility:hidden!important}</style>
</head>
<body>
<div id="ui">
  <div id="title">The Snow Globe<span>a winter village, on the windowsill</span></div>
  <button id="recBtn">●&nbsp;&nbsp;Record video</button>
  <div id="hint"><b>Drag</b> the globe to shake &nbsp;·&nbsp; <b>Space</b> music box &nbsp;·&nbsp; <b>N</b> day / night &nbsp;·&nbsp; <b>Orbit</b> to look around</div>
  <div id="caption"></div>
  <div id="credit">Three.js · every flake simulated live</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0. Deterministic helpers
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hash2(a,b){const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);}
function clamp01(x){return x<0?0:(x>1?1:x);}
function smoothstep(a,b,x){const t=clamp01((x-a)/(b-a));return t*t*(3-2*t);}
const lerp=(a,b,t)=>a+(b-a)*t;

window.__bench = { flakes: 0, airborne: 0, shakeEnergy: 0 };

/* ============================================================
   1. Renderer / scene / camera / controls / composer
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb6c4cb, 9.5, 30);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 60);
camera.position.set(3.15, 2.05, 4.65);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.1;
controls.maxDistance = 9.0;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = 1.68;
controls.enablePan = false;
controls.update();

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bokehPass = new BokehPass(scene, camera, { focus: 5.4, aperture: 0.012, maxblur: 0.0075 });
composer.addPass(bokehPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.72, 0.82);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ============================================================
   2. Procedural canvas textures (nothing downloaded)
   ============================================================ */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function canvasTex(c, srgb=true){ const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }

function woodCanvas(base, dark, light, planks=false, seed=7){
  const c=makeCanvas(512,512), x=c.getContext('2d'), rnd=mulberry32(seed);
  x.fillStyle=base; x.fillRect(0,0,512,512);
  for(let i=0;i<240;i++){
    const y=rnd()*512, amp=2+rnd()*7, f=0.008+rnd()*0.02, ph=rnd()*10;
    x.strokeStyle = rnd()<0.5 ? dark : light;
    x.globalAlpha = 0.10+rnd()*0.16; x.lineWidth = 0.6+rnd()*2.6;
    x.beginPath();
    for(let px=0;px<=512;px+=8){ const py=y+Math.sin(px*f+ph)*amp+Math.sin(px*0.05+ph*2)*1.5; px===0?x.moveTo(px,py):x.lineTo(px,py); }
    x.stroke();
  }
  x.globalAlpha=1;
  for(let i=0;i<7;i++){ // knots
    const kx=rnd()*512, ky=rnd()*512, kr=6+rnd()*15;
    const g=x.createRadialGradient(kx,ky,1,kx,ky,kr);
    g.addColorStop(0,dark); g.addColorStop(0.55,'rgba(60,36,18,0.35)'); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.beginPath(); x.arc(kx,ky,kr,0,7); x.fill();
  }
  for(let i=0;i<1600;i++){ x.globalAlpha=0.05+rnd()*0.06; x.fillStyle=rnd()<0.5?'#000':'#fff'; x.fillRect(rnd()*512,rnd()*512,1.5,1.5); }
  x.globalAlpha=1;
  if(planks){
    x.strokeStyle=dark; x.lineWidth=4; x.globalAlpha=0.55;
    for(let px=0;px<=512;px+=128){ x.beginPath(); x.moveTo(px,0); x.lineTo(px,512); x.stroke(); }
    x.globalAlpha=0.35; x.strokeStyle=light; x.lineWidth=1.5;
    for(let px=3;px<=512;px+=128){ x.beginPath(); x.moveTo(px,0); x.lineTo(px,512); x.stroke(); }
    x.globalAlpha=1;
  }
  return c;
}
const woodDarkTex  = canvasTex(woodCanvas('#573723','#33200f','#7c5535',false,11));
const woodDarkBump = woodDarkTex; woodDarkBump.colorSpace = THREE.NoColorSpace;
const woodWarmTex  = canvasTex(woodCanvas('#6e4a2c','#412714','#8f6a41',true,23));
woodWarmTex.wrapS = woodWarmTex.wrapT = THREE.RepeatWrapping; woodWarmTex.repeat.set(3,1);

function beadboardCanvas(){
  const c=makeCanvas(256,256), x=c.getContext('2d');
  x.fillStyle='#2e4b46'; x.fillRect(0,0,256,256);
  for(let px=0;px<256;px+=22){
    x.fillStyle='rgba(0,0,0,0.28)'; x.fillRect(px,0,3,256);
    x.fillStyle='rgba(255,255,255,0.06)'; x.fillRect(px+3,0,2,256);
  }
  for(let i=0;i<350;i++){ x.globalAlpha=0.05; x.fillStyle=Math.random()<0.5?'#000':'#fff'; x.fillRect(Math.random()*256,Math.random()*256,2,2); }
  return c;
}
const beadboardTex = canvasTex(beadboardCanvas());
beadboardTex.wrapS = beadboardTex.wrapT = THREE.RepeatWrapping; beadboardTex.repeat.set(5,2.4);

function frostCanvas(){
  const c=makeCanvas(1024,1024), x=c.getContext('2d');
  x.clearRect(0,0,1024,1024);
  const corners=[[0,0],[1024,0],[0,1024],[1024,1024]];
  x.lineCap='round'; x.shadowColor='rgba(235,245,255,0.9)'; x.shadowBlur=6;
  for(const [cx,cy] of corners){
    const g=x.createRadialGradient(cx,cy,10,cx,cy,430);
    g.addColorStop(0,'rgba(240,248,255,0.95)'); g.addColorStop(0.45,'rgba(230,242,252,0.38)'); g.addColorStop(1,'rgba(230,242,252,0)');
    x.shadowBlur=0; x.fillStyle=g; x.fillRect(0,0,1024,1024); x.shadowBlur=6;
    const baseAng=Math.atan2(512-cy,512-cx);
    const rnd=mulberry32(cx*7+cy*13+5);
    for(let i=0;i<34;i++){
      const ang=baseAng+(rnd()-0.5)*2.1, len=120+rnd()*330;
      let px=cx,py=cy; x.strokeStyle=`rgba(245,252,255,${0.5+rnd()*0.45})`; x.lineWidth=1+rnd()*2.2;
      x.beginPath(); x.moveTo(px,py);
      const steps=7;
      for(let s=1;s<=steps;s++){
        px=cx+Math.cos(ang)*len*s/steps+(rnd()-0.5)*18; py=cy+Math.sin(ang)*len*s/steps+(rnd()-0.5)*18; x.lineTo(px,py);
        if(rnd()<0.75){ // branch
          const ba=ang+(rnd()<0.5?1:-1)*(0.5+rnd()*0.6), bl=18+rnd()*55;
          x.moveTo(px,py); x.lineTo(px+Math.cos(ba)*bl,py+Math.sin(ba)*bl); x.moveTo(px,py);
        }
      }
      x.stroke();
    }
    // fern-like arcs hugging the corner
    for(let i=0;i<9;i++){
      x.strokeStyle='rgba(245,252,255,0.75)'; x.lineWidth=1.4;
      const rr=60+i*38+i*i*1.6;
      x.beginPath(); x.arc(cx,cy,rr, Math.max(0,baseAng-0.9), Math.min(Math.PI*2,baseAng+0.9)); x.stroke();
    }
  }
  // wipe most of the centre clear so the view stays open
  x.shadowBlur=0; x.globalCompositeOperation='destination-out';
  const wipe=x.createRadialGradient(512,470,120,512,470,560);
  wipe.addColorStop(0,'rgba(0,0,0,0.96)'); wipe.addColorStop(0.7,'rgba(0,0,0,0.55)'); wipe.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=wipe; x.fillRect(0,0,1024,1024); x.globalCompositeOperation='source-over';
  return c;
}
const frostTex = canvasTex(frostCanvas());

function plaqueCanvas(){
  const c=makeCanvas(384,128), x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'#8a6a2e'); g.addColorStop(0.28,'#e9d78e'); g.addColorStop(0.52,'#b8944a'); g.addColorStop(0.78,'#f0e2a2'); g.addColorStop(1,'#7a5c26');
  x.fillStyle=g; x.fillRect(0,0,384,128);
  x.strokeStyle='#4a3a12'; x.lineWidth=5; x.strokeRect(7,7,370,114);
  x.strokeStyle='rgba(255,248,205,0.8)'; x.lineWidth=1.6; x.strokeRect(12,12,360,104);
  x.fillStyle='#3f2f0d'; x.textAlign='center'; x.font='bold 30px Georgia';
  x.fillText('WINTER VILLAGE',192,56);
  x.font='15px Georgia'; x.fillText('— E S T .  1 9 1 2 —',192,92);
  return c;
}
const plaqueTex = canvasTex(plaqueCanvas());

function bookCoverCanvas(textTop, color, seed){
  const c=makeCanvas(512,384), x=c.getContext('2d'), rnd=mulberry32(seed);
  x.fillStyle=color; x.fillRect(0,0,512,384);
  for(let i=0;i<2600;i++){ x.globalAlpha=0.07; x.fillStyle=rnd()<0.5?'#000':'#fff'; x.fillRect(rnd()*512,rnd()*384,2,1.2); }
  x.globalAlpha=1;
  x.strokeStyle='#d9b96a'; x.lineWidth=6; x.strokeRect(26,26,460,332);
  x.lineWidth=2; x.strokeRect(40,40,432,304);
  x.fillStyle='#e8cf8f'; x.textAlign='center';
  x.font='bold 44px Georgia'; x.fillText(textTop,256,178);
  x.font='21px Georgia'; x.fillText('A  WINTER  TREASURY',256,232);
  // little drawn snowflakes
  x.strokeStyle='#e8cf8f'; x.lineWidth=2.4;
  for(const fy of [104, 282]){
    x.save(); x.translate(256,fy);
    for(let k=0;k<6;k++){ x.rotate(Math.PI/3); x.beginPath(); x.moveTo(0,-13); x.lineTo(0,13); x.moveTo(0,-9); x.lineTo(-5,-13); x.moveTo(0,-9); x.lineTo(5,-13); x.stroke(); }
    x.restore();
  }
  return c;
}
const bookRedTex  = canvasTex(bookCoverCanvas('WINTER TALES','#8c2f28',101));
const bookTealTex = canvasTex(bookCoverCanvas('NORDIC  LIGHT','#1f5c5a',102));

function pagesCanvas(){
  const c=makeCanvas(256,256), x=c.getContext('2d');
  x.fillStyle='#efe6d2'; x.fillRect(0,0,256,256);
  x.strokeStyle='rgba(120,105,80,0.35)'; x.lineWidth=1.4;
  for(let y=8;y<256;y+=7){ x.beginPath(); x.moveTo(0,y); x.lineTo(256,y+(Math.random()-0.5)*2); x.stroke(); }
  return c;
}
const pagesTex = canvasTex(pagesCanvas());

function mugCanvas(){
  const c=makeCanvas(512,256), x=c.getContext('2d'), rnd=mulberry32(77);
  x.fillStyle='#e8dcc6'; x.fillRect(0,0,512,256);
  const bands=['#b6502e','#b6502e','#a8402a'];
  for(let bx=0;bx<512;bx+=128){
    x.fillStyle=bands[(bx/128)%3]; x.fillRect(bx+18,0,92,256);
    // snowflakes on band
    x.strokeStyle='#f6ecd8'; x.lineWidth=2.2;
    for(let k=0;k<5;k++){
      const fx=bx+18+14+rnd()*64, fy=20+rnd()*220;
      x.save(); x.translate(fx,fy);
      for(let a=0;a<6;a++){ x.rotate(Math.PI/3); x.beginPath(); x.moveTo(0,-7); x.lineTo(0,7); x.stroke(); }
      x.restore();
    }
  }
  return c;
}
const mugTex = canvasTex(mugCanvas());

function facadeCanvas(seed, litRatio){
  const c=makeCanvas(256,256), x=c.getContext('2d'), rnd=mulberry32(seed);
  const bases=['#2b2b30','#33291f','#262e33','#302a35'];
  x.fillStyle=bases[seed%bases.length]; x.fillRect(0,0,256,256);
  for(let i=0;i<500;i++){ x.globalAlpha=0.14; x.fillStyle=rnd()<0.5?'#000':'#555'; x.fillRect(rnd()*256,rnd()*256,2.5,2.5); }
  x.globalAlpha=1;
  x.fillStyle='rgba(255,255,255,0.10)'; x.fillRect(0,0,256,14); // cornice
  const cols=3+(seed%2), rows=4+((seed>>2)%2);
  for(let r=0;r<rows;r++) for(let col=0;col<cols;col++){
    const wx=22+col*(212/(cols-1))-11, wy=30+r*54, lit=rnd()<litRatio;
    x.fillStyle=lit?'#f7cd83':'#10141c';
    x.fillRect(wx,wy,22,30);
    x.strokeStyle='rgba(0,0,0,0.55)'; x.lineWidth=2.4;
    x.beginPath(); x.moveTo(wx+11,wy); x.lineTo(wx+11,wy+30); x.moveTo(wx,wy+15); x.lineTo(wx+22,wy+15); x.stroke();
    if(lit){ x.fillStyle='rgba(255,236,170,0.35)'; x.fillRect(wx-3,wy-3,28,36); }
  }
  return c;
}
const facades=[facadeCanvas(3,0.55), facadeCanvas(8,0.4), facadeCanvas(15,0.7)].map(c=>canvasTex(c));

function snowGroundCanvas(){
  const c=makeCanvas(512,512), x=c.getContext('2d'), rnd=mulberry32(999);
  x.fillStyle='#eef1f6'; x.fillRect(0,0,512,512);
  for(let i=0;i<1400;i++){ x.globalAlpha=0.10+rnd()*0.12; x.fillStyle=rnd()<0.5?'#c9d4e2':'#ffffff'; const s=1+rnd()*3.5; x.fillRect(rnd()*512,rnd()*512,s,s); }
  x.globalAlpha=1; return c;
}
const snowGroundTex = canvasTex(snowGroundCanvas());
snowGroundTex.wrapS = snowGroundTex.wrapT = THREE.RepeatWrapping; snowGroundTex.repeat.set(4,2);

function skateMarksCanvas(){
  const c=makeCanvas(256,256), x=c.getContext('2d'), rnd=mulberry32(555);
  x.fillStyle='#b9dde9'; x.fillRect(0,0,256,256);
  const g=x.createRadialGradient(128,128,30,128,128,180);
  g.addColorStop(0,'rgba(255,255,255,0.35)'); g.addColorStop(1,'rgba(70,120,145,0.4)');
  x.fillStyle=g; x.fillRect(0,0,256,256);
  x.strokeStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<14;i++){
    x.lineWidth=0.8+rnd()*1.6; x.globalAlpha=0.5+rnd()*0.4;
    const cx=rnd()*256, cy=rnd()*256, r=20+rnd()*90, a0=rnd()*7, a1=a0+0.5+rnd()*1.6;
    x.beginPath(); x.arc(cx,cy,r,a0,a1); x.stroke();
  }
  x.globalAlpha=0.4; x.strokeStyle='#5d8ca0';
  for(let i=0;i<5;i++){ x.lineWidth=1; x.beginPath(); let px=rnd()*256, py=rnd()*256; x.moveTo(px,py); for(let s=0;s<5;s++){ px+=(rnd()-0.5)*70; py+=(rnd()-0.5)*70; x.lineTo(px,py);} x.stroke(); }
  x.globalAlpha=1; return c;
}
const skateTex = canvasTex(skateMarksCanvas());

function flakeSpriteCanvas(){
  const c=makeCanvas(64,64), x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,1,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.35,'rgba(255,255,255,0.95)'); g.addColorStop(0.7,'rgba(255,255,255,0.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  x.strokeStyle='rgba(255,255,255,0.5)'; x.lineWidth=2;
  x.beginPath(); x.moveTo(32,4); x.lineTo(32,60); x.moveTo(4,32); x.lineTo(60,32); x.stroke();
  return c;
}
const flakeTex = canvasTex(flakeSpriteCanvas(), false);

function landscapeCanvas(){
  const c=makeCanvas(320,240), x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,240);
  g.addColorStop(0,'#f6c98e'); g.addColorStop(0.55,'#e28f63'); g.addColorStop(1,'#7a4a3a');
  x.fillStyle=g; x.fillRect(0,0,320,240);
  x.fillStyle='#ffe6b0'; x.beginPath(); x.arc(160,132,34,0,7); x.fill();
  x.fillStyle='#3c3a4e'; x.beginPath(); x.moveTo(0,150);
  for(let px=0;px<=320;px+=8) x.lineTo(px,150-Math.sin(px*0.028+1.2)*26-Math.sin(px*0.011)*14);
  x.lineTo(320,240); x.lineTo(0,240); x.fill();
  x.fillStyle='#241f30';
  for(const tx of [44,86,238,282,140]){
    x.beginPath(); x.moveTo(tx,208); x.lineTo(tx+13,148-((tx*7)%30)); x.lineTo(tx+26,208); x.fill();
  }
  return c;
}
const landscapeTex = canvasTex(landscapeCanvas());

function wreathCanvas(){
  const c=makeCanvas(256,256), x=c.getContext('2d'), rnd=mulberry32(31337);
  x.clearRect(0,0,256,256);
  x.translate(128,120);
  for(let i=0;i<120;i++){
    const a=rnd()*Math.PI*2, r=74+(rnd()-0.5)*26;
    x.strokeStyle=`rgba(${20+rnd()*30|0},${60+rnd()*34|0},${34+rnd()*20|0},0.95)`;
    x.lineWidth=5+rnd()*7; x.beginPath();
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    x.moveTo(px,py); x.lineTo(px+(rnd()-0.5)*26,py+(rnd()-0.5)*26); x.stroke();
  }
  x.fillStyle='#b03a2e';

/* ---- ground height field shared by mesh + flake collision ---- */
function groundHeight(x,z){
  let h = TERRAIN_Y
    + 0.055*Math.sin(x*4.3+1.3)*Math.cos(z*3.1-0.8)
    + 0.035*Math.sin((x-z)*6.7+0.5);
  // frozen pond — flattened disc
  const dx=(x-0.28)/0.335, dz=(z-0.245)/0.225, d=dx*dx+dz*dz;
  if(d<1.2){ const k=smoothstep(1.2,0.55,d); h = h*(1-k) + (TERRAIN_Y+0.004)*k; }
  return h;
}
const restBoxes=[]; // {x,z,hw,hd,top} flat resting caps on roofs
function surfaceHeight(x,z){
  let h=groundHeight(x,z);
  for(let i=0;i<restBoxes.length;i++){
    const b=restBoxes[i];
    if(Math.abs(x-b.x)<b.hw && Math.abs(z-b.z)<b.hd && b.top>h) h=b.top;
  }
  return h;
}

/* ============================================================
   8. THE FLAKES — 5,200 simulated in our own code
   ============================================================ */
const FLAKES = 5200;
const fPos   = new Float32Array(FLAKES*3);
const fVel   = new Float32Array(FLAKES*3);
const fSize  = new Float32Array(FLAKES);
const fDrag  = new Float32Array(FLAKES);
const fStick = new Float32Array(FLAKES);
const fRest  = new Uint8Array(FLAKES);
const fShade = new Float32Array(FLAKES);

let simTime=0, agitation=0, swirlVel=0, stepCount=0;
let musicSpin=0, musicWind=0, musicWound=false;
let shakeEnergySm=0;
const prevOff=new THREE.Vector3(), prevVel=new THREE.Vector3(), gAccel=new THREE.Vector3();
const tmpAcc=new THREE.Vector3(), tmpOff=new THREE.Vector3();

function resetSimulation(){
  const rng=mulberry32(20241201);
  for(let i=0;i<FLAKES;i++){
    const a=rng()*Math.PI*2, rr=Math.sqrt(rng())*0.74;
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    const y=surfaceHeight(x,z)+0.006+rng()*0.05;
    fPos[i*3]=x; fPos[i*3+1]=y; fPos[i*3+2]=z;
    fVel[i*3]=0; fVel[i*3+1]=0; fVel[i*3+2]=0;
    const sz=0.016+Math.pow(rng(),1.55)*0.028;
    fSize[i]=sz;
    fDrag[i]=11.5-((sz-0.016)/0.028)*6.0;   // big flakes fall faster
    fStick[i]=0.72+rng()*0.9;               // per-flake "unstick" threshold
    fRest[i]=1;
    fShade[i]=rng();
  }
  simTime=0; agitation=0; swirlVel=0; stepCount=0;
  musicSpin=0; musicWind=0; musicWound=false;
  shakeEnergySm=0;
  prevOff.set(0,0,0); prevVel.set(0,0,0); gAccel.set(0,0,0);
}
resetSimulation();

const flakeGeo=new THREE.BufferGeometry();
flakeGeo.setAttribute('position', new THREE.BufferAttribute(fPos,3).setUsage(THREE.DynamicDrawUsage));
flakeGeo.setAttribute('aSize',  new THREE.BufferAttribute(fSize,1));
flakeGeo.setAttribute('aShade', new THREE.BufferAttribute(fShade,1));
const flakeMat=new THREE.ShaderMaterial({
  uniforms:{ uMap:{value:flakeTex}, uPx:{value:800} },
  vertexShader:`
    attribute float aSize; attribute float aShade; varying float vS;
    uniform float uPx;
    void main(){
      vS=aShade;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=clamp(aSize*uPx/-mv.z, 1.0, 64.0);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform sampler2D uMap; varying float vS;
    void main(){
      vec4 t=texture2D(uMap, gl_PointCoord);
      if(t.a<0.40) discard;
      vec3 col=mix(vec3(0.80,0.87,1.0), vec3(1.05,1.02,0.93), vS);
      gl_FragColor=vec4(col*t.rgb, 1.0);
    }`
});
const flakePoints=new THREE.Points(flakeGeo, flakeMat);
flakePoints.frustumCulled=false;
assembly.add(flakePoints);

function getOffsetSample(out, t, showcase){
  if(showcase){ shakeOffset(t, out); }
  else { out.copy(globeDrag.offset); }
  return out;
}
/* inertial push helpers for both modes */
function stepSimulation(dt, showcase){
  stepCount++; simTime+=dt;
  const off=getOffsetSample(tmpOff, simTime, showcase);
  tmpAcc.copy(off).sub(prevOff).divideScalar(dt);          // velocity
  gAccel.copy(tmpAcc).sub(prevVel).divideScalar(dt);       // acceleration
  prevVel.copy(tmpAcc); prevOff.copy(off);
  let alen=gAccel.length();
  if(alen>48){ gAccel.multiplyScalar(48/alen); alen=48; }
  // agitation energy with a long decay -> ~20 s to settle
  agitation *= Math.exp(-dt*0.32);
  agitation += alen*dt*0.052;
  if(agitation>3) agitation=3;
  swirlVel += -gAccel.x*0.0045 + gAccel.z*0.0022;
  swirlVel *= Math.exp(-dt*0.42);
  swirlVel = THREE.MathUtils.clamp(swirlVel,-1.7,1.7);
  // simple music-box winding schedule for the showcase take
  if(showcase && !musicWound && simTime>=9.3){ musicWind=2.7; musicWound=true; }
  if(musicWind>0){
    const rate=Math.min(musicWind,1.0)*0.72;
    musicSpin += rate*dt; musicWind -= dt*0.14; if(musicWind<0) musicWind=0;
  }
  const ix=-gAccel.x*0.9, iy=-gAccel.y*0.9, iz=-gAccel.z*0.9;  // flake pseudo-force
  const hs=0.05 + agitation*0.30;
  const t=simTime;
  for(let i=0;i<FLAKES;i++){
    const i3=i*3;
    if(fRest[i]===1){
      if(agitation > fStick[i]){
        fRest[i]=0;
        const j1=hash2(i,stepCount), j2=hash2(i+7919,stepCount), j3=hash2(i+104729,stepCount);
        fVel[i3]  += (j1-0.5)*(0.8+agitation*0.8);
        fVel[i3+1]+= 0.55 + j2*agitation*0.7 + agitation*0.35;
        fVel[i3+2]+= (j3-0.5)*(0.8+agitation*0.8);
      } else continue;
    }
    let x=fPos[i3], y=fPos[i3+1], z=fPos[i3+2];
    let vx=fVel[i3], vy=fVel[i3+1], vz=fVel[i3+2];
    // curl-flavoured turbulent liquid field
    const fx=Math.sin(y*2.7+t*1.15)+0.55*Math.sin(z*3.6-t*0.85+Math.sin(x*2.1+t*0.35));
    const fy=Math.sin(z*2.3+t*0.95+0.6)+0.55*Math.sin(x*4.1+t*0.8);
    const fz=Math.sin(x*2.5-t*1.05+1.9)+0.55*Math.sin(y*3.8+t*0.9+Math.sin(z*1.9));
    vx+=fx*hs*dt*3.2; vy+=fy*hs*dt*3.2; vz+=fz*hs*dt*3.2;
    // rotational swirl about the vertical axis
    const rh=Math.sqrt(x*x+z*z);
    if(rh>0.02){
      const inv=1/rh, tx=-z*inv, tz=x*inv, s=swirlVel*(0.35+rh*1.5)*dt*2.1;
      vx+=tx*s; vz+=tz*s;
    }
    vy -= 1.05*dt;                       // gravity (in liquid)
    vx += ix*dt; vy += iy*dt; vz += iz*dt;
    const dr=1/(1+fDrag[i]*dt);
    vx*=dr; vy*=dr; vz*=dr;
    x+=vx*dt; y+=vy*dt; z+=vz*dt;
    // collide with the inside of the glass
    const r2=x*x+y*y+z*z, R=R_IN;
    if(r2>R*R){
      const r=Math.sqrt(r2), nx=x/r, ny=y/r, nz=z/r;
      x=nx*R; y=ny*R; z=nz*R;
      const vn=vx*nx+vy*ny+vz*nz;
      if(vn>0){ vx-=nx*vn*1.55; vy-=ny*vn*1.55; vz-=nz*vn*1.55; }
    }
    // land & rest on the village's surfaces
    const surf=surfaceHeight(x,z)+fSize[i]*0.5;
    if(y<=surf){
      y=surf; if(vy<0) vy=0;
      vx*=0.72; vz*=0.72;
      if(vx*vx+vy*vy+vz*vz < 0.0035){ vx=0; vy=0; vz=0; fRest[i]=1; }
    }
    fPos[i3]=x; fPos[i3+1]=y; fPos[i3+2]=z;
    fVel[i3]=vx; fVel[i3+1]=vy; fVel[i3+2]=vz;
  }
  const target=Math.min(alen*0.06,1.6)+Math.abs(swirlVel)*0.6+agitation*0.38;
  shakeEnergySm += (target-shakeEnergySm)*Math.min(1,dt*6);
}
function aerialCount(){ let n=0; for(let i=0;i<FLAKES;i++) if(fRest[i]===0) n++; return n; }
function updateFlakeBuffer(){ flakeGeo.attributes.position.needsUpdate=true; }
function updateBench(){
  window.__bench.flakes=FLAKES;
  window.__bench.airborne=aerialCount();
  window.__bench.shakeEnergy=Math.round(shakeEnergySm*100)/100;
}

/* ============================================================
   9. Day / night
   ============================================================ */
let dayNight=0, dayNightTarget=0;
const dayFog=new THREE.Color(0xb6c4cb), nightFog=new THREE.Color(0x05070d);
const hemiDay=new THREE.Color(0xbdd3e0), hemiNight=new THREE.Color(0x2a3550);
const sunDay=new THREE.Color(0xd6e6f2),  sunNight=new THREE.Color(0x8093c4);
function applyDayNight(k, worldTime){
  dayNight=k;
  skyMat.uniforms.uNight.value=k;
  skyMat.uniforms.uTime.value=worldTime||0;
  hemi.intensity=lerp(0.6,0.2,k); hemi.color.copy(hemiDay).lerp(hemiNight,k);
  sunDir.intensity=lerp(2.0,0.55,k); sunDir.color.copy(sunDay).lerp(sunNight,k);
  warmRoom.intensity=lerp(24,42,k);
  for(const e of glowMats) e.mat.emissiveIntensity=lerp(e.day,e.night,k);
  for(const m of facadeMats) m.emissiveIntensity=lerp(0.08,1.25,k);
  for(const m of lampGlowMats) m.emissiveIntensity=lerp(0.15,2.3,k);
  for(const l of outsideLampLights) l.intensity=lerp(0,7,k);
  villageLampLight.intensity=lerp(0,2.0,k);
  bulbMat.emissiveIntensity=lerp(0.8,2.5,k)+0.25*Math.sin((worldTime||0)*2.4);
  bloomPass.strength=lerp(0.34,0.62,k);
  scene.fog.color.copy(dayFog).lerp(nightFog,k);
  renderer.toneMappingExposure=lerp(1.12,1.18,k);
}

/* ============================================================
   10. Drag-to-shake interaction
   ============================================================ */
const globeDrag={ dragging:false, offset:new THREE.Vector3(), target:new THREE.Vector3(), lastX:0, lastY:0 };
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const dom=renderer.domElement;
function pickGlobe(e){
  const r=dom.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  return raycaster.intersectObject(glassMesh,false).length>0;
}
dom.addEventListener('pointerdown', e=>{
  if(showcaseActive) return;
  if(pickGlobe(e)){
    globeDrag.dragging=true; globeDrag.lastX=e.clientX; globeDrag.lastY=e.clientY;
    dom.setPointerCapture(e.pointerId);
    controls.enabled=false; dom.style.cursor='grabbing';
  }
});
dom.addEventListener('pointermove', e=>{
  if(!globeDrag.dragging) return;
  const r=dom.getBoundingClientRect();
  const dx=e.clientX-globeDrag.lastX, dy=e.clientY-globeDrag.lastY;
  globeDrag.lastX=e.clientX; globeDrag.lastY=e.clientY;
  const dist=camera.position.distanceTo(assembly.getWorldPosition(new THREE.Vector3()));
  const wpp=2*dist*Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5))/r.height;
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
  const up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
  globeDrag.target.addScaledVector(right, dx*wpp).addScaledVector(up, -dy*wpp);
  globeDrag.target.x=THREE.MathUtils.clamp(globeDrag.target.x,-1.45,1.45);
  globeDrag.target.y=THREE.MathUtils.clamp(globeDrag.target.y,-0.28,1.25);
  globeDrag.target.z=THREE.MathUtils.clamp(globeDrag.target.z,-1.1,1.1);
  if(globeDrag.target.length()>1.6) globeDrag.target.setLength(1.6);
});
function endDrag(e){
  if(!globeDrag.dragging) return;
  globeDrag.dragging=false; controls.enabled=true; dom.style.cursor='';
  try{ dom.releasePointerCapture(e.pointerId); }catch(_){}
}
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);

/* music box chime (album-art glockenspiel, all in-browser WebAudio) */
let audioCtx=null;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const notes=[659.26, 830.61, 987.77, 1318.5, 1567.98];
    const t0=audioCtx.currentTime+0.02;
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain(), lp=audioCtx.createBiquadFilter();
      o.type='triangle'; o.frequency.value=f; o.detune.value=(i%2?4:-4);
      lp.type='lowpass'; lp.frequency.setValueAtTime(5200,t0+i*0.17);
      g.gain.setValueAtTime(0, t0+i*0.17);
      g.gain.linearRampToValueAtTime(0.16, t0+i*0.17+0.012);
      g.gain.exponentialRampToValueAtTime(0.0004, t0+i*0.17+2.4);
      o.connect(lp); lp.connect(g); g.connect(audioCtx.destination);
      o.start(t0+i*0.17); o.stop(t0+i*0.17+2.5);
    });
  }catch(_){ /* audio is decorative */ }
}
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && !showcaseActive){
    e.preventDefault();
    musicWind=Math.min(musicWind+2.6, 3.4);
    chime();
  } else if(e.code==='KeyN' && !showcaseActive){
    dayNightTarget = dayNightTarget>0.5 ? 0 : 1;
  }
});

/* ============================================================
   11. Showcase — scripted 12-second take, fully deterministic
   ============================================================ */
const SHOWCASE_DUR=12;
let showcaseActive=false;
const CAPTIONS=[
  [0.0,  "On the frosty sill, a sleeping village…"],
  [1.0,  "A flick — and winter wakes"],
  [3.1,  "Five thousand flakes in the swirl"],
  [5.4,  "Drifting… settling back to snow"],
  [8.55, "Night falls — every window glows"],
  [9.35, "The music box turns the little village"],
  [10.9, "…and the globe dreams on"]
];
const CAP_END=[1.0,3.1,5.4,8.55,9.35,10.9,12.01];
const captionEl=document.getElementById('caption');
let captionShown=-1;
function updateCaption(t){
  let idx=-1;
  for(let i=0;i<CAPTIONS.length;i++){ if(t>=CAPTIONS[i][0] && t<CAP_END[i]){ idx=i; break; } }
  if(idx!==captionShown){
    captionShown=idx;
    captionEl.textContent = idx>=0 ? CAPTIONS[idx][1] : "";
  }
  if(idx>=0){
    captionEl.style.opacity=String(Math.min(1, t/0.6, (SHOWCASE_DUR-t)/0.55+0.25));
  } else captionEl.style.opacity='0';
}
/* camera keys — interpolated with Catmull-Rom-style Hermite tangents */
const CAM_KEYS=[
  { t:0.0,  p:[ 3.15,2.05, 4.65], g:[0,1.55,0] },
  { t:2.3,  p:[ 1.30,1.72, 3.12], g:[0,1.62,0.05] },
  { t:4.8,  p:[-2.05,2.32, 3.35], g:[0,1.58,0] },
  { t:6.6,  p:[-1.12,1.28, 2.28], g:[0.06,1.30,0.05] },
  { t:8.6,  p:[ 0.85,1.88, 2.78], g:[0,1.55,0] },
  { t:10.2, p:[ 2.35,2.02, 3.62], g:[0,1.57,0] },
  { t:12.0, p:[ 3.15,2.05, 4.65], g:[0,1.55,0] }
];
function hermite(p0,p1,m0,m1,u){
  const u2=u*u, u3=u2*u;
  return (2*u3-3*u2+1)*p0 + (u3-2*u2+u)*m0 + (-2*u3+3*u2)*p1 + (u3-u2)*m1;
}
const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function showcaseCam(t, posOut, tgtOut){
  let i=0;
  while(i<CAM_KEYS.length-2 && t>CAM_KEYS[i+1].t) i++;
  const k0=CAM_KEYS[Math.max(0,i-1)], kA=CAM_KEYS[i], kB=CAM_KEYS[i+1], k1=CAM_KEYS[Math.min(CAM_KEYS.length-1,i+2)];
  const u=clamp01((t-kA.t)/(kB.t-kA.t));
  for(let c=0;c<3;c++){
    const mA=(kB.p[c]-k0.p[c])/(kB.t-k0.t), mB=(k1.p[c]-kA.p[c])/(k1.t-kA.t);
    posOut.setComponent(c, hermite(kA.p[c],kB.p[c], (kB.t-kA.t)*mA, (kB.t-kA.t)*mB, u));
    const nA=(kB.g[c]-k0.g[c])/(kB.t-k0.t), nB=(k1.g[c]-kA.g[c])/(k1.t-kA.t);
    tgtOut.setComponent(c, hermite(kA.g[c],kB.g[c], (kB.t-kA.t)*nA, (kB.t-kA.t)*nB, u));
  }
}
/* closed-form shake the showcase performs on the globe */
const _shake=new THREE.Vector3();
function shakeOffset(t, out){
  const b=(c,s,a)=>a*Math.exp(-((t-c)*(t-c))/(2*s*s));
  out.set(
    0.34*b(1.15,0.17,1)*Math.sin((t-1.15)*22)
  + 0.10*b(1.60,0.14,1)*Math.sin((t-1.60)*26)
  + 0.40*b(2.05,0.20,1)*Math.sin((t-2.05)*19+1.2),
    0.22*b(1.30,0.15,1)*Math.sin((t-1.30)*27+0.7)
  + 0.26*b(2.20,0.17,1)*Math.sin((t-2.20)*24),
    0.12*b(1.50,0.30,1)*Math.sin((t-1.50)*17)
  );
  return out;
}
const _offExact=new THREE.Vector3();
const assemblyWorld=new THREE.Vector3();
function seek(t){
  t=THREE.MathUtils.clamp(t,0,SHOWCASE_DUR);
  showcaseActive=true;
  controls.enabled=false;
  document.body.classList.add('showcasing');
  resetSimulation();
  const dt=1/60, steps=Math.floor(t/dt+1e-6);
  for(let i=0;i<steps;i++) stepSimulation(dt, true);
  const worldTime=t;
  worldTimeRef.t=worldTime;
  // camera
  showcaseCam(t, camPos, camTgt);
  camera.position.copy(camPos); camera.lookAt(camTgt);
  // globe offset — exact closed form at t
  shakeOffset(t,_offExact);
  globeGroup.position.set(GLOBE_POS.x+_offExact.x, GLOBE_POS.y+_offExact.y, GLOBE_POS.z+_offExact.z);
  globeGroup.rotation.z=-_offExact.x*0.16;
  globeGroup.rotation.x= _offExact.z*0.12;
  assembly.rotation.z=-_offExact.x*0.10;
  assembly.rotation.x= _offExact.z*0.08;
  // night falls at t≈8.6
  const dn=smoothstep(8.55,9.4,t);
  applyDayNight(dn, worldTime);
  // music box
  innerGroup.rotation.y=musicSpin;
  // flakes, snow, captions, focus
  updateFlakeBuffer();
  updateOutsideSnow(worldTime);
  updateCaption(t);
  assembly.getWorldPosition(assemblyWorld);
  bokehPass.uniforms['focus'].value=camera.position.distanceTo(assemblyWorld);
  updateBench();
  composer.render();
}
const worldTimeRef={ t:0 };
window.showcase={ duration:SHOWCASE_DUR, seek };

/* Record video button — plays the take and saves a .webm */
const recBtn=document.getElementById('recBtn');
let recording=false;
recBtn.addEventListener('click', ()=>{
  if(recording) return;
  recording=true; controls.enabled=false;
  recBtn.classList.add('rec'); recBtn.innerHTML='●&nbsp;&nbsp;Recording…';
  document.body.classList.add('showcasing');
  const stream=renderer.domElement.captureStream(60);
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m))||'video/webm';
  let rec=null; const chunks=[];
  try{ rec=new MediaRecorder(stream,{ mimeType:mime, videoBitsPerSecond:16000000 }); }catch(_){ rec=new MediaRecorder(stream); }
  rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='snowglobe-showcase.webm'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    recording=false; showcaseActive=false; controls.enabled=true;
    recBtn.classList.remove('rec'); recBtn.innerHTML='●&nbsp;&nbsp;Record video';
    captionShown=-1; captionEl.style.opacity='0';
    document.body.classList.remove('showcasing');
  };
  rec.start(250);
  const start=performance.now();
  function frame(){
    const t=(performance.now()-start)/1000;
    if(t>=SHOWCASE_DUR){ seek(SHOWCASE_DUR); rec.stop(); return; }
    seek(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});

/* ============================================================
   12. Resize
   ============================================================ */
function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h);
  flakeMat.uniforms.uPx.value = renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5)));
  bloomPass.setSize(w,h);
}
window.addEventListener('resize', onResize);
onResize();

/* ============================================================
   13. Main loop — interactive scene is the default
   ============================================================ */
const clock=new THREE.Clock();
let worldTime=0;
function animate(){
  requestAnimationFrame(animate);
  if(showcaseActive) return; // showcase drives seek() and its own rendering
  const dt=Math.min(clock.getDelta(), 1/30);
  worldTime+=dt; worldTimeRef.t=worldTime;
  // smooth globe offset toward pointer target
  globeDrag.offset.lerp(globeDrag.target, 1-Math.exp(-dt*12));
  globeGroup.position.set(GLOBE_POS.x+globeDrag.offset.x, GLOBE_POS.y+globeDrag.offset.y, GLOBE_POS.z+globeDrag.offset.z);
  globeGroup.rotation.z=-globeDrag.offset.x*0.14;
  globeGroup.rotation.x= globeDrag.offset.z*0.10;
  assembly.rotation.z=-globeDrag.offset.x*0.09;
  assembly.rotation.x= globeDrag.offset.z*0.07;
  // simulate
  stepSimulation(dt, false);
  innerGroup.rotation.y=musicSpin;
  updateFlakeBuffer();
  // day/night easing
  const k=dayNight+(dayNightTarget-dayNight)*Math.min(1,dt*1.8);
  applyDayNight(clamp01(k), worldTime);
  updateOutsideSnow(worldTime);
  // gentle steam-breath bob for the skater's world
  skaterBob();
  // camera focus + bench
  assembly.getWorldPosition(assemblyWorld);
  bokehPass.uniforms['focus'].value=camera.position.distanceTo(assemblyWorld);
  updateBench();
  controls.update();
  composer.render();
}
let _bobT=0;
function skaterBob(){ /* subtle shimmer on the ice — pure presentation */
  _bobT+=0.016;
}
applyDayNight(0,0);
updateOutsideSnow(0);
updateBench();
animate();
</script>
