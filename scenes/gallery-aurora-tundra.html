<!DOCTYPE html>

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #02040a;
    font-family: "Avenir Next", "Futura", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .hud {
    position: fixed; z-index: 10; pointer-events: none; color: #cfe0ee;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }
  #ui-title {
    top: 26px; left: 30px;
    letter-spacing: 0.42em; font-size: 21px; font-weight: 600;
    color: #e8f2fa;
  }
  #ui-title span {
    display: block; margin-top: 6px;

  }
  #ui-title .rule {
    width: 168px; height: 1px; margin-top: 12px;
    background: linear-gradient(90deg, rgba(120,255,180,0.85), rgba(200,110,255,0.5) 60%, transparent);
  }
  #ui-hint {
    bottom: 24px; left: 30px;
    font-size: 10px; letter-spacing: 0.22em; color: #9db4c8;
  }

  #ui-badge {

  }
  #ui-badge .dot {

    background: #47ffa0; box-shadow: 0 0 10px #47ffa0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

  #substormPill {
    top: 84px; right: 30px;
    padding: 7px 16px; border: 1px solid rgba(255, 120, 220, 0.45);
    border-radius: 2px; background: rgba(40, 6, 34, 0.55);
    letter-spacing: 0.34em; font-size: 10px; color: #ffc2ef;
    opacity: 0; transition: opacity 0.25s ease;
    box-shadow: 0 0 26px rgba(255, 80, 220, 0.35);
  }

  #recordBtn {
    position: fixed; z-index: 11; bottom: 22px; right: 26px;
    pointer-events: auto; cursor: pointer;
    padding: 12px 20px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.26em; font-weight: 600;
    color: #f3e9e2; background: rgba(40, 10, 16, 0.55);
    border: 1px solid rgba(255, 150, 140, 0.45); border-radius: 2px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s, box-shadow 0.2s, color 0.2s;
  }
  #recordBtn:hover { background: rgba(84, 18, 24, 0.7); box-shadow: 0 0 24px rgba(255, 90, 80, 0.35); }
  #recordBtn:disabled { opacity: 0.75; cursor: default; }
  #recordBtn .rec-dot { color: #ff5b4d; }
</style>
<style>/* blog-clean: only the 3D canvas is shown in the blog; titles, panels and buttons are hidden */
body *:not(canvas):not(:has(canvas)):not(script):not(style){visibility:hidden!important}</style>
</head>
<body>
<div id="app"></div>

<div class="hud" id="ui-title">AURORA BOREALIS<span>TUNDRA CAMP · FROZEN LAKE</span><div class="rule"></div></div>
<div class="hud" id="ui-hint"><b>DRAG</b> orbit &nbsp;·&nbsp; <b>1</b> quiet &nbsp;<b>2</b> active &nbsp;<b>3</b> storm &nbsp;·&nbsp; <b>SPACE</b> substorm</div>
<div class="hud" id="ui-badge"><div class="dot"></div><span id="badgeText">ACTIVE</span></div>
<div class="hud" id="substormPill">SUBSTORM SURGE</div>
<button id="recordBtn"><span class="rec-dot">●</span>&nbsp; REC — RECORD 12s SHOWCASE</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   AURORA BOREALIS — TUNDRA CAMP
   Everything procedural: geometry, textures, sky, physics of snow.
   ============================================================ */

// ---------- deterministic RNG / noise ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(1337);

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct) {
  let amp = 0.5, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += vnoise(x * freq, y * freq) * amp;
    norm += amp; amp *= 0.5; freq *= 2.03;
  }
  return sum / norm;
}
function sstep(a, b, x) { // handles reversed edges too
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

const LAKE_Y = 0.12;
const LAKE_CENTER = new THREE.Vector3(0, LAKE_Y, -40);
const TERRAIN_OFFSET_Z = -20;

function terrainHeight(wx, wz) {
  // rolling tundra
  let h = (fbm(wx * 0.011 + 13.7, wz * 0.011 + 7.3, 5) - 0.5) * 2.0 * 6.2;
  h += (fbm(wx * 0.045 + 3.1, wz * 0.045 + 9.7, 3) - 0.5) * 2.2;
  // distant northern ridge / mountains
  const north = sstep(-105, -215, wz);
  h += north * (fbm(wx * 0.013 + 51.2, wz * 0.021 + 17.7, 4) * 36.0 + 7.0);
  // flanking uplands east / west
  const edge = sstep(125, 225, Math.abs(wx));
  h += edge * (fbm(wx * 0.021 + 71.3, wz * 0.016 + 29.4, 4) * 13.0 + 3.0);
  // gentle rim behind the camera (south)
  const south = sstep(80, 190, wz);
  h += south * (fbm(wx * 0.02 + 91.5, wz * 0.02 + 43.2, 3) * 6.0 + 1.5);
  // wind-carved sastrugi: stretched ripples
  h += (fbm(wx * 0.055 + 31.7, wz * 0.62 + 47.1, 2) - 0.5) * 0.5;
  // frozen lake basin
  const dx = wx / 98.0, dz = (wz + 40.0) / 50.0;
  const d = dx * dx + dz * dz;
  const lake = sstep(1.22, 0.72, d);
  h = h * (1 - lake) + (-1.7) * lake;
  return h;
}

// ---------- renderer / scene / camera ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x060d1a, 70, 640);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 2400);
camera.position.set(-3.3, 5, 40);   // blog: opens closer to the camp, tent centred

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(-20.1, 7.5, -48.4);
{ // blog: ?cam=x,y,z,tx,ty,tz overrides the opening view
  const c=(new URLSearchParams(location.search).get('cam')||'').split(',').map(Number);
  if(c.length===6 && c.every(isFinite)){ camera.position.set(c[0],c[1],c[2]); controls.target.set(c[3],c[4],c[5]); }
}
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 170;
controls.maxPolarAngle = 1.52;
controls.update();

// ---------- lights ----------
const ambient = new THREE.AmbientLight(0x1c2a44, 0.6);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x2a4160, 0x0b1210, 0.55);
scene.add(hemi);

const moonLight = new THREE.DirectionalLight(0xa9c6e8, 0.85);
moonLight.position.set(150, 200, 130);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(4096, 4096);
moonLight.shadow.camera.left = -95; moonLight.shadow.camera.right = 95;
moonLight.shadow.camera.top = 95; moonLight.shadow.camera.bottom = -95;
moonLight.shadow.camera.near = 20; moonLight.shadow.camera.far = 640;
moonLight.shadow.bias = -0.0004;
moonLight.shadow.normalBias = 1.4;
scene.add(moonLight);
scene.add(moonLight.target);

const auroraLight = new THREE.DirectionalLight(0x4dff9d, 1.0); // green wash from the north
auroraLight.position.set(0, 150, -190);
scene.add(auroraLight);
scene.add(auroraLight.target);

// ---------- shared GLSL noise ----------
const GLSL_NOISE = `
float hash21(vec2 p){
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){
    s += a * vnoise(p);
    p = p * 2.03 + vec2(17.3, 9.1);
    a *= 0.55;
  }
  return s;
}`;

// ---------- procedural canvas textures ----------
function makeCanvas(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}

const iceTex = makeCanvas(1024, (g, s) => {
  const trng = mulberry32(9021);
  const bg = g.createLinearGradient(0, 0, s, s);
  bg.addColorStop(0, '#0a1424'); bg.addColorStop(0.5, '#060b15'); bg.addColorStop(1, '#0c1626');
  g.fillStyle = bg; g.fillRect(0, 0, s, s);
  // mottled frozen depth
  for (let i = 0; i < 420; i++) {
    const x = trng() * s, y = trng() * s, r = 14 + trng() * 130;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    const bright = trng() > 0.5;
    grad.addColorStop(0, bright ? 'rgba(34,54,80,0.28)' : 'rgba(2,5,10,0.35)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  // faint pressure ridges (long soft streaks)
  for (let i = 0; i < 40; i++) {
    g.strokeStyle = 'rgba(60,90,125,' + (0.08 + trng() * 0.12) + ')';
    g.lineWidth = 2 + trng() * 5;
    g.beginPath();
    let x = trng() * s, y = trng() * s, ang = trng() * Math.PI;
    g.moveTo(x, y);
    for (let k = 0; k < 14; k++) { ang += (trng() - 0.5) * 0.5; x += Math.cos(ang) * 46; y += Math.sin(ang) * 46; g.lineTo(x, y); }
    g.stroke();
  }
  // cracks — jagged random walks, drawn hot then core
  function crack(x, y, ang, steps, width) {
    const pts = [[x, y]];
    for (let k = 0; k < steps; k++) {
      ang += (trng() - 0.5) * 0.62;
      const len = 5 + trng() * 12;
      x += Math.cos(ang) * len; y += Math.sin(ang) * len;
      pts.push([x, y]);
      if (trng() < 0.055 && steps > 30) crack(x, y, ang + (trng() > 0.5 ? 1 : -1) * (0.6 + trng() * 0.9), Math.floor(steps * 0.4), width * 0.6);
    }
    const passes = [
      { w: width * 4.2, col: 'rgba(140,180,215,0.10)' },
      { w: width * 1.5, col: 'rgba(185,215,240,0.50)' },
      { w: width * 0.55, col: 'rgba(238,250,255,0.90)' }
    ];
    for (const p of passes) {
      g.strokeStyle = p.col; g.lineWidth = p.w; g.lineJoin = 'round'; g.lineCap = 'round';
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let k = 1; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
      g.stroke();
    }
  }
  for (let i = 0; i < 17; i++) crack(trng() * s, trng() * s, trng() * Math.PI * 2, 70 + trng() * 110, 1.4 + trng() * 1.8);
  // snow dust — soft pale blobs
  for (let i = 0; i < 110; i++) {
    const x = trng() * s, y = trng() * s, r = 10 + trng() * 85;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(228,238,248,' + (0.10 + trng() * 0.30) + ')');
    grad.addColorStop(1, 'rgba(228,238,248,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
});
iceTex.wrapS = iceTex.wrapT = THREE.ClampToEdgeWrapping;

const fabricTex = makeCanvas(256, (g, s) => {
  g.fillStyle = '#a4502c'; g.fillRect(0, 0, s, s);
  const trng = mulberry32(5150);
  for (let i = 0; i < 900; i++) { // woven noise
    g.fillStyle = 'rgba(' + (trng() > 0.5 ? '255,190,130' : '60,25,12') + ',' + (0.05 + trng() * 0.12) + ')';
    g.fillRect(trng() * s, trng() * s, 1 + trng() * 3, 1 + trng() * 2);
  }
  g.fillStyle = 'rgba(70,30,14,0.55)'; g.fillRect(0, s - 26, s, 26); // dark hem
  g.fillStyle = 'rgba(255,205,150,0.28)'; g.fillRect(0, 10, s, 4);   // sun-bleached ridge seam
  g.fillStyle = 'rgba(60,25,10,0.5)'; g.fillRect(s / 2 - 3, 0, 6, s); // center seam
});

const plankTex = makeCanvas(128, (g, s) => {
  g.fillStyle = '#5d3f26'; g.fillRect(0, 0, s, s);
  const trng = mulberry32(777);
  for (let row = 0; row < 4; row++) {
    g.fillStyle = 'rgba(' + (30 + trng() * 40) + ',' + (18 + trng() * 24) + ',8,0.55)';
    g.fillRect(0, row * 32, s, 3);
    for (let i = 0; i < 26; i++) {
      g.fillStyle = 'rgba(20,12,6,' + (0.15 + trng() * 0.3) + ')';
      g.fillRect(trng() * s, row * 32 + 6 + trng() * 22, 8 + trng() * 40, 1);
    }
  }
});

const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.28, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  return tex;
})();

// ---------- sky dome (gradient + milky way + airglow) ----------
const skyUniforms = {
  uTime: { value: 0 },
  uAuroraGlow: { value: 0.6 }
};
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform float uTime, uAuroraGlow;
    ${GLSL_NOISE}
    void main(){
      vec3 d = normalize(vDir);
      float y = d.y;
      vec3 zen = vec3(0.006, 0.010, 0.032);
      vec3 mid = vec3(0.022, 0.046, 0.105);
      vec3 hor = vec3(0.058, 0.115, 0.165);
      vec3 col = mix(hor, mid, smoothstep(0.0, 0.20, y));
      col = mix(col, zen, smoothstep(0.16, 0.68, y));
      // subtle warm remnant far south-east horizon
      float warm = exp(-max(abs(y), 0.0) * 13.0) * smoothstep(0.15, 0.9, d.x * 0.7 + 0.3) * step(0.0, y);
      col += vec3(0.085, 0.055, 0.032) * warm;
      // milky way band — great circle through the northern sky
      vec3 n = normalize(vec3(0.52, 0.36, -0.77));
      float bd = dot(d, n);
      float band = exp(-bd * bd / 0.030);
      float mn = fbm(d.xy * 6.5 + d.z * 3.6 + 4.7);
      float dust = fbm(d.xz * 10.5 + 31.7);
      float mw = band * smoothstep(0.32, 0.88, mn);
      col += vec3(0.375, 0.415, 0.545) * mw * 0.62;
      col += vec3(0.55, 0.48, 0.44) * band * smoothstep(0.52, 0.9, fbm(d.yx * 8.0 + 11.2)) * 0.18; // faint warm star clouds
      col -= vec3(0.16, 0.16, 0.19) * band * smoothstep(0.42, 0.78, dust); // dark dust lane
      // airglow — faint green layer hugging the horizon
      float ag = exp(-max(y, 0.0) * 8.5) * step(-0.02, y);
      float agn = fbm(d.xz * 4.6 + uTime * 0.015 + 8.8);
      col += vec3(0.045, 0.155, 0.098) * ag * (0.55 + 0.75 * agn);
      // faint violet counter-glow
      col += vec3(0.075, 0.05, 0.115) * exp(-max(y, 0.0) * 15.0) * (0.45 + 0.65 * fbm(d.zx * 5.2 + 7.1));
      // aurora's own tint on the northern horizon
      float northFacing = smoothstep(0.05, 0.85, -d.z);
      col += vec3(0.06, 0.23, 0.13) * exp(-max(y, 0.0) * 7.0) * northFacing * uAuroraGlow * 0.9;
      // below horizon — deep cold fade
      col = mix(col, vec3(0.008, 0.014, 0.032), smoothstep(0.02, -0.18, y));
      gl_FragColor = vec4(col, 1.0);
    }`
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1150, 48, 32), skyMat);
scene.add(skyDome);

// moon disc + halo
const moonDir = new THREE.Vector3(0.46, 0.42, 0.36).normalize();
const moonMesh = new THREE.Mesh(
  new THREE.CircleGeometry(26, 40),
  new THREE.MeshBasicMaterial({ color: 0xe9eef6, fog: false })
);
moonMesh.position.copy(moonDir).multiplyScalar(1080);
moonMesh.lookAt(0, 0, 0);
scene.add(moonMesh);
const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xbdd2ee, transparent: true, opacity: 0.75,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
}));
moonGlow.position.copy(moonDir).multiplyScalar(1075);
moonGlow.scale.set(260, 260, 1);
scene.add(moonGlow);

// ---------- stars (7000 twinkling points) ----------
const STAR_COUNT = 7000;
const starGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(STAR_COUNT * 3);
  const size = new Float32Array(STAR_COUNT);
  const phase = new Float32Array(STAR_COUNT);
  const speed = new Float32Array(STAR_COUNT);
  const tint = new Float32Array(STAR_COUNT * 3);
  const srng = mulberry32(20771);
  const palette = [
    [1.0, 1.0, 1.0], [0.82, 0.89, 1.0], [0.72, 0.82, 1.0],
    [1.0, 0.92, 0.78], [0.85, 0.93, 1.0], [1.0, 0.85, 0.68]
  ];
  for (let i = 0; i < STAR_COUNT; i++) {
    // uniform sphere, keep above/near horizon
    let x, y, z, r;
    do {
      x = srng() * 2 - 1; y = srng() * 2 - 1; z = srng() * 2 - 1;
      r = x * x + y * y + z * z;
    } while (r > 1 || r < 0.01);
    r = Math.sqrt(r);
    x = x / r * 1090; y = y / r * 1090; z = z / r * 1090;
    if (y < -40) y = -40 + srng() * 30;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    const big = srng() > 0.965;
    size[i] = big ? 2.6 + srng() * 1.5 : 0.7 + Math.pow(srng(), 2.1) * 1.9;
    phase[i] = srng() * Math.PI * 2;
    speed[i] = 0.7 + srng() * 2.6;
    const c = palette[Math.floor(srng() * palette.length)];
    tint[i * 3] = c[0]; tint[i * 3 + 1] = c[1]; tint[i * 3 + 2] = c[2];
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  starGeo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  starGeo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
  starGeo.setAttribute('aTint', new THREE.BufferAttribute(tint, 3));
}
const starUniforms = {
  uTime: { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};
const starMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  uniforms: starUniforms,
  vertexShader: `
    attribute float aSize, aPhase, aSpeed;
    attribute vec3 aTint;
    uniform float uTime, uPixelRatio;

const auroraUniforms = [];   // shared-per-curtain uniform bundles

const AURORA_VERT = `
uniform float uTime, uPhase, uSpeed;
varying vec2 vUv;
varying float vFold;
void main(){
  vUv = uv;
  vec3 p = position;
  float x = p.x;
  float t = uTime * uSpeed;
  float fold1 = sin(x * 0.028 - t * 0.55 + uPhase) * 15.0;
  float fold2 = sin(x * 0.061 - t * 1.08 + uPhase * 1.7 + 2.0) * 6.8;
  float fold3 = sin(x * 0.135 - t * 1.95 + uPhase * 2.3 + 4.2) * 2.7;
  float amp = 0.35 + 0.75 * uv.y;             // anchored near the ground, wild at the top
  p.z += (fold1 + fold2 + fold3) * amp;
  p.x += sin(x * 0.012 + t * 0.30 + uPhase) * 4.5 * uv.y;
  p.y += sin(x * 0.020 - t * 0.46 + uPhase * 0.7) * 4.2 * uv.y + fold2 * 0.38 * uv.y;
  vFold = fold1 + fold2;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;

const AURORA_FRAG = `
uniform float uTime, uPhase, uSpeed, uBrightness, uHueShift;
varying vec2 vUv;
varying float vFold;
${GLSL_NOISE}
void main(){
  float v = vUv.y;
  float u = vUv.x;
  float t = uTime * uSpeed;

  // fine vertical ray striations — sharpened noise sheets
  float rays = fbm(vec2(u * 150.0 + uPhase * 37.0, v * 2.4 - t * 0.16));
  float raySharp = pow(smoothstep(0.38, 0.95, rays), 2.6);
  float fine = fbm(vec2(u * 480.0 + uPhase * 91.0, v * 5.5 - t * 0.30));
  float fineSharp = pow(smoothstep(0.45, 0.95, fine), 3.2);
  // slow brightening waves sweeping sideways
  float sweep = 0.72 + 0.5 * sin(u * 9.0 - t * 0.75 + fbm(vec2(u * 6.0, t * 0.12)) * 4.0);

  // altitude gradient: green base → teal → magenta → red crown
  vec3 cLow  = vec3(0.16, 1.00, 0.42);
  vec3 cMid  = vec3(0.10, 0.86, 0.60);
  vec3 cMag  = vec3(0.70, 0.24, 0.97);
  vec3 cRed  = vec3(0.95, 0.26, 0.30);
  float hs = uHueShift;
  vec3 col = mix(cLow, cMid, smoothstep(0.02, 0.34, v + hs * 0.15));
  col = mix(col, cMag, smoothstep(0.38, 0.72, v + hs * 0.25));
  col = mix(col, cRed, smoothstep(0.70, 0.99, v + hs * 0.35));

  // intensity profile: bright fringe low, glow dies toward the top
  float fringe = exp(-pow((v - 0.155) * 3.05, 2.0)) * 1.15;
  float body   = 0.42 + 0.95 * raySharp + 0.38 * fineSharp;
  float topFade  = 1.0 - smoothstep(0.58, 1.02, v) * 0.88;
  float botFade  = smoothstep(0.0, 0.075, v);
  float endFade  = smoothstep(0.0, 0.055, u) * smoothstep(1.0, 0.945, u);
  // fold shading — rays catch on the fold crests
  float foldLight = 0.78 + 0.4 * sin(vFold * 0.16 + u * 3.0);

  float I = (fringe * (0.55 + 0.75 * raySharp) + body * (0.30 + 0.85 * v * 0.9))
            * topFade * botFade * endFade * sweep * foldLight;
  I *= uBrightness;

  gl_FragColor = vec4(col * I, 1.0);
}`;

function makeCurtain(opts) {

}

const REFLECT_RES = 2048;
const reflectRT = new THREE.WebGLRenderTarget(REFLECT_RES, REFLECT_RES, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat
});
const virtualCamera = new THREE.PerspectiveCamera();
const textureMatrix = new THREE.Matrix4();
const lakeUniforms = {
  tRefl: { value: reflectRT.texture },
  tIce: { value: iceTex },
  uTime: { value: 0 },
  uTexMatrix: { value: textureMatrix }
};
const lakeMat = new THREE.ShaderMaterial({
  uniforms: lakeUniforms,
  fog: false,
  vertexShader: `
    uniform mat4 uTexMatrix;
    varying vec4 vProj;
    varying vec2 vUv;
    varying vec3 vWorld;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      vProj = uTexMatrix * wp;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform sampler2D tRefl, tIce;
    uniform float uTime;
    varying vec4 vProj;
    varying vec2 vUv;
    varying vec3 vWorld;
    void main(){
      vec3 V = normalize(cameraPosition - vWorld);
      float ndv = max(dot(V, vec3(0.0, 1.0, 0.0)), 0.0);
      float fres = pow(1.0 - ndv, 5.0) * 0.80 + 0.20;

      vec4 ice = texture2D(tIce, vUv);
      float lum = dot(ice.rgb, vec3(0.299, 0.587, 0.114));
      float crack = smoothstep(0.40, 0.80, lum);          // bright thin fracture lines
      float dust  = smoothstep(0.26, 0.62, lum);          // snow-dusted patches

      // roughened reflection lookup — cracks & dust scatter the mirror
      vec2 shimmer = vec2(
        sin(uTime * 0.7 + vWorld.x * 1.9 + vWorld.z * 0.8),
        cos(uTime * 0.6 + vWorld.z * 1.6 - vWorld.x * 0.9)
      ) * 0.004;
      vec2 duv = (ice.rg - 0.5) * 0.055 + shimmer;
      vec2 ruv = clamp(vProj.xy / vProj.w + duv, vec2(0.002), vec2(0.998));
      vec3 refl = texture2D(tRefl, ruv).rgb;

      vec3 deep = vec3(0.012, 0.024, 0.046) * (0.55 + ice.b * 0.6);
      float rStrength = clamp(fres * (1.0 - dust * 0.72) * (1.0 - crack * 0.38), 0.0, 1.0);
      vec3 col = mix(deep, refl * vec3(0.80, 0.89, 1.04), rStrength);
      // icy glints along the fractures
      col += vec3(0.52, 0.66, 0.82) * crack * (0.28 + 0.72 * fres) * 0.55;
      // sunlit-looking snow dust lying on the ice
      col = mix(col, vec3(0.60, 0.68, 0.79), dust * 0.55 * (1.0 - fres * 0.45));
      // fade into the fogged distance
      float dist = length(vWorld - cameraPosition);
      col = mix(col, vec3(0.024, 0.051, 0.098), smoothstep(55.0, 230.0, dist));
      gl_FragColor = vec4(col, 1.0);
    }`
});
const lake = new THREE.Mesh(new THREE.CircleGeometry(1, 72), lakeMat);
lake.rotation.x = -Math.PI / 2;

lake.position.copy(LAKE_CENTER);

const _plane = new THREE.Plane();
const _normal = new THREE.Vector3(0, 1, 0);
const _mirrorPos = LAKE_CENTER.clone();
const _view = new THREE.Vector3();
const _target = new THREE.Vector3();
const _lookAt = new THREE.Vector3();
const _clipPlane = new THREE.Vector4();
const _q = new THREE.Vector4();
const _rot = new THREE.Matrix4();

function renderReflection() {
  lake.visible = false;
  // mirrored camera across y = LAKE_Y
  _view.copy(_mirrorPos).sub(camera.position);
  _view.reflect(_normal).negate();
  _view.add(_mirrorPos);
  virtualCamera.position.copy(_view);
  _rot.extractRotation(camera.matrixWorld);
  _lookAt.set(0, 0, -1).applyMatrix4(_rot).add(camera.position);
  _target.copy(_mirrorPos).sub(_lookAt).reflect(_normal).negate().add(_mirrorPos);
  virtualCamera.up.set(0, 1, 0).applyMatrix4(_rot).reflect(_normal);
  virtualCamera.lookAt(_target);
  virtualCamera.far = camera.far;
  virtualCamera.updateMatrixWorld();
  virtualCamera.projectionMatrix.copy(camera.projectionMatrix);

  // texture matrix (bias * virtual proj * virtual view)
  textureMatrix.set(
    0.5, 0.0, 0.0, 0.5,
    0.0, 0.5, 0.0, 0.5,
    0.0, 0.0, 0.5, 0.5,
    0.0, 0.0, 0.0, 1.0
  );
  textureMatrix.multiply(virtualCamera.projectionMatrix);
  textureMatrix.multiply(virtualCamera.matrixWorldInverse);

  // oblique near-plane clipping so submerged terrain never leaks
  _plane.setFromNormalAndCoplanarPoint(_normal, _mirrorPos);
  _plane.applyMatrix4(virtualCamera.matrixWorldInverse);
  _clipPlane.set(_plane.normal.x, _plane.normal.y, _plane.normal.z, _plane.constant);
  const pm = virtualCamera.projectionMatrix;
  _q.x = (Math.sign(_clipPlane.x) + pm.elements[8]) / pm.elements[0];
  _q.y = (Math.sign(_clipPlane.y) + pm.elements[9]) / pm.elements[5];
  _q.z = -1.0;
  _q.w = (1.0 + pm.elements[10]) / pm.elements[14];
  _clipPlane.multiplyScalar(2.0 / _clipPlane.dot(_q));
  pm.elements[2] = _clipPlane.x;
  pm.elements[6] = _clipPlane.y;
  pm.elements[10] = _clipPlane.z + 1.0 - 0.005;
  pm.elements[14] = _clipPlane.w;

  const prevRT = renderer.getRenderTarget();
  renderer.setRenderTarget(reflectRT);
  renderer.state.buffers.depth.setMask(true);
  renderer.clear();
  renderer.render(scene, virtualCamera);
  renderer.setRenderTarget(prevRT);
  lake.visible = true;
}

// ============================================================
//  STATE — simulation clock, activity tiers, substorm envelope
// ============================================================
const state = {
  simTime: 0,
  activity: 2,            // 1 quiet · 2 active · 3 storm
  substormT0: -1000,
  subEnv: 0,
  stormGlow: 0,
  brightness: 0.6
};

const glowTexShared = glowTex;
const sparkleMatRef = window.__sparkleMat;

function analyticSubstorm(x) {
  if (x <= 0) return 0;
  const attack = 1 - Math.exp(-x * 2.7);
  const decay = Math.exp(-x * 0.52);
  return Math.min(1, Math.max(0, attack * decay));
}
function showcaseSubstorm(t) {
  const attack = sstep(6.15, 7.05, t);
  const decay = 1 - sstep(8.1, 11.7, t);
  const shimmer = 0.82 + 0.24 * Math.sin(t * 9.0 + Math.sin(t * 5.3) * 1.7);
  return Math.min(1, Math.max(0, attack * decay * shimmer + attack * decay * 0.25));
}
function showcaseActivity(t) {
  return t < 2.0 ? 1 : (t < 5.5 ? 2 : 3);
}
function flick(t) {
  return 0.5 + 0.5 * Math.sin(t * 0.83 + Math.sin(t * 0.31 + 1.7) * 2.2);
}
function computeBrightness() {
  const base = [0, 0.36, 0.66, 0.95][state.activity];
  const f1 = flick(state.simTime);
  const f2 = 0.5 + 0.5 * Math.sin(state.simTime * 2.15 + 0.5);
  let b = base * (0.80 + 0.30 * f1) + state.subEnv * 0.52 + state.stormGlow * 0.10 + f2 * 0.045 * state.activity;
  return Math.min(1, Math.max(0, b));
}

const badgeText = document.getElementById('badgeText');
const substormPill = document.getElementById('substormPill');
const ACTIVITY_NAMES = { 1: 'QUIET', 2: 'ACTIVE', 3: 'STORM' };
function refreshBadge() { badgeText.textContent = ACTIVITY_NAMES[state.activity]; }

// per-frame uniform/light pump — shared by interactive loop, seek() and recorder
function applyEnvironment() {
  const t = state.simTime;
  state.brightness = computeBrightness();
  const speed = 0.55 + state.activity * 0.5 + state.subEnv * 1.7;
  const flare = 1.0 + state.subEnv * 1.15 + state.stormGlow * 0.25;
  for (const u of auroraUniforms) {
    u.uTime.value = t;
    u.uSpeed.value = speed;
    u.uBrightness.value = state.brightness * flare;
  }
  coronaUniforms.uTime.value = t;
  coronaUniforms.uCorona.value = state.stormGlow * (0.72 + 0.28 * flick(t * 1.3 + 2.0));
  starUniforms.uTime.value = t;
  snowUniforms.uTime.value = t;
  skyUniforms.uTime.value = t;
  skyUniforms.uAuroraGlow.value = state.brightness;
  lakeUniforms.uTime.value = t;
  sparkleMatRef.uniforms.uTime.value = t;
  auroraLight.intensity = 0.35 + state.brightness * 1.75;
  auroraLight.color.setHSL(0.36 + 0.06 * Math.sin(t * 0.4), 1.0, 0.62);
  // lantern breathing
  lanternLight.intensity = 2.05 + Math.sin(t * 9.3) * 0.22 + Math.sin(t * 23.7 + 1.2) * 0.14 + Math.sin(t * 3.1) * 0.18;
  doorGlowSprite.material.opacity = 0.68 + 0.2 * Math.sin(t * 9.3 + 0.4) + 0.08 * Math.sin(t * 15.7);
  // pill visibility
  substormPill.style.opacity = state.subEnv > 0.18 ? String(Math.min(1, state.subEnv)) : '0';
}

// ---------- __bench ----------
const __bench = { activity: 2, curtains: CURTAIN_COUNT, stars: STAR_COUNT, brightness: 0.6 };
window.__bench = __bench;
function updateBench() {
  __bench.activity = state.activity;
  __bench.curtains = CURTAIN_COUNT;
  __bench.stars = STAR_COUNT;
  __bench.brightness = state.brightness;
}

// ---------- render pipeline ----------
function renderFrame() {
  applyEnvironment();
  renderReflection();
  renderer.render(scene, camera);
  updateBench();
}

// ---------- showcase (12 s deterministic camera journey) ----------
const SHOWCASE_DURATION = 12.0;
const camCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(30.0, 9.0, 66.0),
  new THREE.Vector3(17.0, 4.4, 40.0),
  new THREE.Vector3(4.0, 2.5, 27.5),
  new THREE.Vector3(-14.5, 3.6, 31.0),
  new THREE.Vector3(-2.0, 13.0, 53.0),
  new THREE.Vector3(7.0, 21.0, 76.0)
], false, 'centripetal');
const lookCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.0, 18.0, -75.0),
  new THREE.Vector3(-2.0, 12.0, -62.0),
  new THREE.Vector3(-8.2, tentPos.y + 1.2, 14.5),
  new THREE.Vector3(-7.0, tentPos.y + 1.5, 15.5),
  new THREE.Vector3(0.0, 34.0, -95.0),
  new THREE.Vector3(0.0, 27.0, -85.0)
], false, 'centripetal');

function computeShowcaseState(t) {
  t = Math.min(SHOWCASE_DURATION, Math.max(0, t));
  state.simTime = t;
  state.activity = showcaseActivity(t);
  state.subEnv = showcaseSubstorm(t);
  state.stormGlow = sstep(5.35, 6.95, t);
  const k = t / SHOWCASE_DURATION;
  camera.position.copy(camCurve.getPoint(k));
  const look = lookCurve.getPoint(k);
  controls.target.copy(look);
  camera.lookAt(look);
  refreshBadge();
}

window.showcase = {
  duration: SHOWCASE_DURATION,
  seek(t) {
    computeShowcaseState(t);
    renderFrame(); // renders exactly one deterministic frame
  }
};

// ---------- record video button ----------
const recordBtn = document.getElementById('recordBtn');
let recording = false;
let showcasePlaying = false;
let showcaseStartReal = 0;
let mediaRecorder = null;
let recordedChunks = [];

function startRecording() {
  if (recording) return;
  if (!renderer.domElement.captureStream || typeof MediaRecorder === 'undefined') {
    recordBtn.textContent = 'RECORDING NOT SUPPORTED';
    return;
  }
  recording = true;
  showcasePlaying = true;
  showcaseStartReal = performance.now();
  controls.enabled = false;
  recordBtn.disabled = true;
  recordBtn.innerHTML = '<span class="rec-dot">●</span>&nbsp; RECORDING…';

  recordedChunks = [];
  const stream = renderer.domElement.captureStream(60);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16_000_000 });
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'aurora-borealis-showcase.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recording = false;
    recordBtn.disabled = false;
    recordBtn.innerHTML = '<span class="rec-dot">●</span>&nbsp; REC — RECORD 12s SHOWCASE';
  };
  mediaRecorder.start(120);
}
recordBtn.addEventListener('click', startRecording);

// ---------- input: keys 1–3 & space ----------
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!showcasePlaying) {
      state.substormT0 = state.simTime;
    }
    return;
  }
  if (e.code === 'Digit1' || e.code === 'Numpad1') { if (!showcasePlaying) { state.activity = 1; refreshBadge(); } }
  else if (e.code === 'Digit2' || e.code === 'Numpad2') { if (!showcasePlaying) { state.activity = 2; refreshBadge(); } }
  else if (e.code === 'Digit3' || e.code === 'Numpad3') { if (!showcasePlaying) { state.activity = 3; refreshBadge(); } }
});

// ---------- main loop ----------
let lastNow = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;

  if (showcasePlaying) {
    const t = (now - showcaseStartReal) / 1000;
    if (t >= SHOWCASE_DURATION) {
      showcasePlaying = false;
      controls.enabled = true;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      // leave the camera exactly at the finale; interactive clock resumes from there
      state.simTime = SHOWCASE_DURATION;
      state.substormT0 = -1000;
    } else {
      computeShowcaseState(t);
    }
    renderFrame();
    return;
  }

  state.simTime += dt;
  state.subEnv = analyticSubstorm(state.simTime - state.substormT0);
  const stormTarget = state.activity === 3 ? 1 : 0;
  state.stormGlow += (stormTarget - state.stormGlow) * Math.min(1, dt * 1.9);
  if (state.stormGlow < 0.002 && stormTarget === 0) state.stormGlow = 0;

  controls.update();
  renderFrame();
}

// ---------- resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  const pr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(pr);
  starUniforms.uPixelRatio.value = pr;
  snowUniforms.uPixelRatio.value = pr;
  sparkleMatRef.uniforms.uPixelRatio.value = pr;
});

// ---------- go ----------
refreshBadge();
renderer.render(scene, camera);
animate();
