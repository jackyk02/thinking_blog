<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Break — Billiard Hall</title>
<style>
  :root {
    --gold: #d4b36a;
    --gold-dim: rgba(212,179,106,.35);
    --ink: #e9dec6;
    --panel: linear-gradient(165deg, rgba(28,23,17,.86), rgba(13,11,9,.88));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #060504;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position: fixed; inset: 0; }
  canvas.game { display: block; cursor: crosshair; }

  /* ------- cinematic vignette ------- */
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(0,0,0,.38) 78%, rgba(0,0,0,.72) 100%); }

  /* ------- generic panel ------- */
  .panel {
    position: fixed; z-index: 10; color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--gold-dim); border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 12px 14px;
  }

  /* ------- title ------- */
  #title {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: var(--gold); letter-spacing: .38em; font-size: 15px; text-transform: uppercase;
    text-shadow: 0 2px 14px rgba(0,0,0,.9); pointer-events: none; white-space: nowrap;
    padding: 8px 22px; border: 1px solid var(--gold-dim); border-radius: 999px;
    background: rgba(10,8,6,.55); backdrop-filter: blur(4px);
  }
  #title small { display:block; text-align:center; letter-spacing:.24em; font-size:8px; color:#b9a071; margin-top:3px; }

  /* ------- stats / pocketed tray ------- */
  #stats { top: 16px; right: 16px; width: 216px; }
  #stats .row { display:flex; justify-content:space-between; align-items:baseline;
    border-bottom: 1px solid rgba(212,179,106,.25); padding-bottom: 8px; margin-bottom: 8px; }
  #stats .label { font-size: 10px; letter-spacing: .3em; color: #b9a071; }
  #shots { font-size: 30px; color: #f3e6bd; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #trayLabel { font-size: 9px; letter-spacing:.28em; color:#b9a071; margin: 4px 0 6px; }
  #tray { display: flex; flex-wrap: wrap; gap: 5px; min-height: 28px; }
  .tok {
    width: 26px; height: 26px; border-radius: 50%;
    font-size: 12px; font-weight: bold; color: #141414;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset -2px -3px 5px rgba(0,0,0,.45), inset 2px 3px 4px rgba(255,255,255,.5), 0 2px 4px rgba(0,0,0,.6);
    border: 1px solid rgba(0,0,0,.55);
  }
  #msg { margin-top: 9px; min-height: 18px; font-size: 12.5px; color: #f0c674;
    opacity: 0; transition: opacity .25s; letter-spacing:.04em; font-style: italic; }
  #msg.show { opacity: 1; }
  #msg.scratch { color: #ff8f6b; }

  /* ------- spin diagram ------- */
  #spinPanel { left: 16px; bottom: 16px; display:flex; align-items:center; gap:12px; }
  #spinCanvas { display:block; }
  #spinPanel .hint { font-size: 10.5px; color:#cbbb93; line-height: 1.65; letter-spacing:.06em; }
  #spinPanel .hint b { color:#f0d797; font-weight: normal; border:1px solid var(--gold-dim);
    border-radius:4px; padding:0 5px; margin:0 2px; font-size:10px; background:rgba(0,0,0,.35); }

  /* ------- power bar ------- */
  #powerWrap {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
    width: 340px; height: 14px; border-radius: 999px; z-index: 10;
    border: 1px solid var(--gold-dim); background: rgba(8,7,5,.72);
    box-shadow: 0 6px 22px rgba(0,0,0,.6), inset 0 1px 3px rgba(0,0,0,.8);
    opacity: .35; transition: opacity .18s; overflow: hidden; pointer-events: none;
  }
  #powerWrap.active { opacity: 1; }
  #powerFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#3f9e5f 0%, #a8c94e 35%, #e8c542 62%, #e07b39 82%, #d2402e 100%);
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(232,197,66,.55);
    transition: none;
  }
  #powerLabel { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    z-index: 10; font-size: 9px; letter-spacing: .34em; color:#b9a071; pointer-events:none;
    opacity: 0; transition: opacity .2s; }
  #powerWrap.active + #powerLabel { opacity: 1; }

  /* ------- buttons ------- */
  #controls { position: fixed; right: 16px; bottom: 16px; z-index: 11; display:flex; gap:10px; }
  .btn {
    font-family: Georgia, serif; font-size: 12px; letter-spacing:.12em; color: var(--ink);
    background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 10px;
    padding: 10px 16px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    transition: all .18s; text-transform: uppercase;
  }
  .btn:hover { border-color: rgba(240,215,151,.75); color:#f7eccb;
    box-shadow: 0 8px 30px rgba(0,0,0,.65), 0 0 22px rgba(212,179,106,.22); }
  .btn kbd { font-size: 9px; color:#b9a071; border:1px solid var(--gold-dim); border-radius:4px; padding:1px 5px; margin-left:6px; }
  #recordBtn { border-color: rgba(255,120,90,.4); }
  #recordBtn:hover { border-color: rgba(255,140,110,.8); box-shadow: 0 8px 30px rgba(0,0,0,.65), 0 0 24px rgba(255,110,80,.25); }
  #recordBtn.rec { color:#ffd2c2; border-color:#ff7a52; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,110,70,.45);} 50% { box-shadow: 0 0 22px 4px rgba(255,110,70,.4);} }

  /* ------- help hint ------- */
  #helpHint { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 9;
    font-size: 9.5px; letter-spacing:.14em; color: rgba(233,222,198,.4); pointer-events:none; white-space:nowrap; }
</style>
<style>/* blog-clean: only the 3D canvas is shown in the blog; titles, panels and buttons are hidden */
body *:not(canvas):not(:has(canvas)):not(script):not(style){visibility:hidden!important}
#spinPanel{display:none!important}</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="title">The Break<small>billiard hall · est. 1924</small></div>

<div id="stats" class="panel">
  <div class="row"><span class="label">SHOTS</span><span id="shots">0</span></div>
  <div id="trayLabel">POCKETED</div>
  <div id="tray"></div>
  <div id="msg"></div>
</div>

<div id="spinPanel" class="panel">
  <canvas id="spinCanvas" width="112" height="112"></canvas>
  <div class="hint">
    <b>W</b><b>S</b> follow / draw<br/>
    <b>A</b><b>D</b> left / right english<br/>
    cue-tip offset
  </div>
</div>

<div id="powerWrap"><div id="powerFill"></div></div>
<div id="powerLabel">POWER</div>

<div id="controls">
  <button id="rerackBtn" class="btn">Re-rack<kbd>R</kbd></button>
  <button id="recordBtn" class="btn">⏺&nbsp; Record video</button>
</div>

<div id="helpHint">LEFT-DRAG hold &amp; release — shoot &nbsp;·&nbsp; RIGHT-DRAG — orbit &nbsp;·&nbsp; WHEEL — zoom &nbsp;·&nbsp; MOUSE — aim</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ============================================================
   THE BREAK — a fully self-built 3D pool table & simulation
   ============================================================ */

// ---------- regulation-ish dimensions (metres, 9-ft table) ----------
const L = 2.54, W = 1.27;          // playing surface
const HX = L / 2, HZ = W / 2;
const R = 0.0286;                  // ball radius (57.2 mm)
const BED_Y = 0.82;                // slate playing height
const BALL_Y = BED_Y + R;
const CORNER_GAP = 0.082;          // half-width of corner pocket mouth (rail ends)
const SIDE_GAP   = 0.095;          // half-width of side pocket mouth
const CAP_CORNER = 0.062, CAP_SIDE = 0.055;   // capture radii
const BACK_R = 0.085;              // pocket throat backstop radius
const JAW_R  = 0.040;              // jaw collision radius (incl. ball)
const G = 9.81, MU = 0.20, MU_ROLL = 0.055;
const REST_BALL = 0.92, REST_CUSH = 0.76;
const STEP  = 1 / 240;

// pockets: 4 corners + 2 sides (mouth openings)
const POCKETS = [
  { x:-HX, z:-HZ, cap:CAP_CORNER, side:false },
  { x: HX, z:-HZ, cap:CAP_CORNER, side:false },
  { x:-HX, z: HZ, cap:CAP_CORNER, side:false },
  { x: HX, z: HZ, cap:CAP_CORNER, side:false },
  { x: 0,  z:-HZ, cap:CAP_SIDE,   side:true  },
  { x: 0,  z: HZ, cap:CAP_SIDE,   side:true  }
];
// cushion nose-end "jaw" points (12)
const JAWS = [];
for (const s of [-1,1]) {
  JAWS.push({ x: s*SIDE_GAP, z:  HZ });
  JAWS.push({ x: s*SIDE_GAP, z: -HZ });
  for (const z of [-1,1]) {
    JAWS.push({ x: s*(HX-CORNER_GAP), z: z*HZ });       // side-rail end
    JAWS.push({ x: s*HX,              z: z*(HZ-CORNER_GAP) }); // end-rail end
  }
}

// ---------- global three.js handles (top-level, per spec) ----------
let scene, camera, renderer, controls, composer = null;

// ---------- simulation state ----------
const balls = [];            // index 0 = cue ball
const pocketedNumbers = [];
let shots = 0;
let scratchPending = false;
let movingFlag = false;

const aimDir = new THREE.Vector3(1, 0, 0);
const tipOffset = { x: 0, y: 0 };
let charging = false, power = 0, powerDir = 1;
const UP = new THREE.Vector3(0, 1, 0);

const bench = { balls: [], pocketed: [], moving: false, shots: 0 };
window.__bench = bench;

// ============================================================
//  PROCEDURAL CANVAS TEXTURES
// ============================================================
function canvasTex(w, h, draw, opts) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  if (opts && opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  return t;
}

const feltTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#1f5c39'; g.fillRect(0, 0, w, h);
  // elongated wear sheen along the play axis
  const sheen = g.createLinearGradient(0, 0, 0, h);
  sheen.addColorStop(0, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.42, 'rgba(255,255,255,0.085)');
  sheen.addColorStop(0.58, 'rgba(255,255,255,0.085)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sheen; g.fillRect(0, 0, w, h);
  // nap speckles
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.05)';
    g.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
  // vignette toward the cushions
  const v = g.createRadialGradient(w/2, h/2, h*0.32, w/2, h/2, w*0.62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.34)');
  g.fillStyle = v; g.fillRect(0, 0, w, h);
});

const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#5a3822'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 240; i++) {
    const y0 = Math.random() * h, amp = 3 + Math.random() * 9, alpha = 0.10 + Math.random() * 0.22;
    g.strokeStyle = Math.random() < 0.72 ? `rgba(30,17,8,${alpha})` : `rgba(150,105,64,${alpha})`;
    g.lineWidth = 0.6 + Math.random() * 2.6;
    g.beginPath(); g.moveTo(0, y0);
    for (let x = 0; x <= w; x += 16) g.lineTo(x, y0 + Math.sin(x * 0.02 + i) * amp + Math.sin(x * 0.006 + i * 2) * amp * 0.6);
    g.stroke();
  }
  for (let i = 0; i < 7; i++) { // knots
    const kx = Math.random() * w, ky = Math.random() * h;
    const kg = g.createRadialGradient(kx, ky, 1, kx, ky, 9 + Math.random() * 12);
    kg.addColorStop(0, 'rgba(24,12,5,0.85)'); kg.addColorStop(0.5, 'rgba(70,42,20,0.55)'); kg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = kg; g.beginPath(); g.ellipse(kx, ky, 18, 11, 0, 0, Math.PI*2); g.fill();
  }
});

const darkWoodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#38220f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 170; i++) {
    const y0 = Math.random() * h;
    g.strokeStyle = Math.random() < 0.6 ? `rgba(12,6,2,${0.15+Math.random()*0.3})` : `rgba(120,80,44,${0.08+Math.random()*0.16})`;
    g.lineWidth = 0.8 + Math.random() * 3;
    g.beginPath(); g.moveTo(0, y0);
    for (let x = 0; x <= w; x += 20) g.lineTo(x, y0 + Math.sin(x*0.018 + i) * 6);
    g.stroke();
  }
});

const panelTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#241509'; g.fillRect(0, 0, w, h);
  const bw = 62;
  for (let x = 0; x < w; x += bw) {
    const grad = g.createLinearGradient(x, 0, x + bw, 0);
    grad.addColorStop(0, '#1c1008'); grad.addColorStop(0.18, '#33200f');
    grad.addColorStop(0.5, '#402a16'); grad.addColorStop(0.82, '#33200f'); grad.addColorStop(1, '#160d06');
    g.fillStyle = grad; g.fillRect(x, 0, bw, h);
    g.fillStyle = 'rgba(0,0,0,0.75)'; g.fillRect(x, 0, 3, h); g.fillRect(x + bw - 3, 0, 3, h);
    // inner moulding rectangle
    g.strokeStyle = 'rgba(190,140,80,0.16)'; g.lineWidth = 2;
    g.strokeRect(x + 10, 66, bw - 20, h - 132);
  }
  g.fillStyle = '#150c05'; g.fillRect(0, h - 46, w, 46);   // baseboard
  g.fillStyle = '#0f0904'; g.fillRect(0, 0, w, 22);         // crown
  g.fillStyle = 'rgba(200,150,85,0.22)'; g.fillRect(0, h - 48, w, 3); g.fillRect(0, 22, w, 3);
}, { repeat: [6, 1.6] });

const parquetTex = canvasTex(512, 512, (g, w, h) => {
  const tile = 128;
  for (let ty = 0; ty < h / tile; ty++) for (let tx = 0; tx < w / tile; tx++) {
    const even = (tx + ty) % 2 === 0;
    g.fillStyle = even ? '#33200f' : '#2a1a0d';
    g.fillRect(tx * tile, ty * tile, tile, tile);
    for (let i = 0; i < 6; i++) {
      g.fillStyle = even ? (i % 2 ? '#3d2716' : '#2c1d0f') : (i % 2 ? '#342312' : '#241709');
      if (even) g.fillRect(tx * tile, ty * tile + i * (tile / 6), tile, tile / 6 - 2);
      else      g.fillRect(tx * tile + i * (tile / 6), ty * tile, tile / 6 - 2, tile);
    }
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 2; g.strokeRect(tx * tile, ty * tile, tile, tile);
  }
}, { repeat: [9, 7] });

const rugTex = canvasTex(512, 352, (g, w, h) => {
  g.fillStyle = '#4e1f1b'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c9a86a'; g.lineWidth = 10; g.strokeRect(14, 14, w - 28, h - 28);
  g.strokeStyle = '#7a3b26'; g.lineWidth = 16; g.strokeRect(34, 34, w - 68, h - 68);
  g.strokeStyle = '#c9a86a'; g.lineWidth = 3;  g.strokeRect(48, 48, w - 96, h - 96);
  // medallion
  g.save(); g.translate(w / 2, h / 2);
  for (const rr of [86, 62, 34]) {
    g.strokeStyle = 'rgba(201,168,106,0.85)'; g.lineWidth = rr === 34 ? 6 : 3.5;
    g.beginPath(); g.arc(0, 0, rr, 0, Math.PI * 2); g.stroke();
  }
  for (let i = 0; i < 8; i++) {
    g.rotate(Math.PI / 4);
    g.strokeStyle = 'rgba(201,168,106,0.5)'; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(0, -86); g.lineTo(0, -62); g.stroke();
  }
  g.restore();
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,220,160,0.05)';
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
});

// glow sprite (also used for dust motes)
const glowTex = canvasTex(128, 128, (g, w, h) => {
  const grad = g.createRadialGradient(64, 64, 2, 64, 64, 62);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,240,205,0.75)');
  grad.addColorStop(1, 'rgba(255,230,180,0)');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
});

const blobTex = canvasTex(128, 128, (g) => {
  const grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grad.addColorStop(0, 'rgba(0,0,0,0.9)'); grad.addColorStop(0.55, 'rgba(0,0,0,0.45)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
});

const netTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#3b2414'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(15,8,3,0.85)'; g.lineWidth = 3;
  for (let i = -h; i < w; i += 14) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); }
  g.strokeStyle = 'rgba(120,80,45,0.5)';
  for (let i = 0; i < w + h; i += 14) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i - h, h); g.stroke(); }
}, { repeat: [3, 2] });

const BALL_HEX = ['', '#f5c242', '#3f63b8', '#cf4438', '#7d4ba8', '#e07830', '#3c7a47', '#8a3a3a', '#191919'];
function ballColorCss(n) {
  const hex = BALL_HEX[n > 8 ? n - 8 : n];
  if (n <= 8) return hex;
  return `linear-gradient(180deg,#f2efe4 26%, ${hex} 26%, ${hex} 74%, #f2efe4 74%)`;
}
function makeBallTexture(num) {
  const solid = num === 0 || num <= 8;
  const col = num === 0 ? '#f7f5ec' : BALL_HEX[num > 8 ? num - 8 : num];
  return canvasTex(256, 128, (g, w, h) => {
    if (num === 0) {
      g.fillStyle = '#f7f5ec'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 260; i++) { g.fillStyle = 'rgba(160,150,130,0.16)'; g.fillRect(Math.random()*w, Math.random()*h, 1.4, 1.4); }
      g.fillStyle = 'rgba(190,60,45,0.85)'; g.beginPath(); g.arc(200, 40, 5.5, 0, Math.PI * 2); g.fill(); // tiny locator dot
    } else if (solid) {
      g.fillStyle = col; g.fillRect(0, 0, w, h);
    } else {
      g.fillStyle = '#f2efe4'; g.fillRect(0, 0, w, h);
      g.fillStyle = col; g.fillRect(0, 40, w, 48);
    }
    if (num !== 0) {
      for (const cx of [64, 192]) {
        g.beginPath(); g.arc(cx, 64, 25, 0, Math.PI * 2);
        g.fillStyle = '#f6f3e9'; g.fill();
        g.fillStyle = '#181818';
        g.font = 'bold 29px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(String(num), cx, 66);
      }
    }
    // subtle pole shading
    const v = g.createLinearGradient(0, 0, 0, h);
    v.addColorStop(0, 'rgba(0,0,0,0.28)'); v.addColorStop(0.25, 'rgba(0,0,0,0)');
    v.addColorStop(0.75, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.32)');
    g.fillStyle = v; g.fillRect(0, 0, w, h);
  });
}

// ============================================================
//  SCENE CONSTRUCTION
// ============================================================
const BALL_Y_WORLD = BALL_Y;
const raycaster = new THREE.Raycaster();
const hitPlanePoint = new THREE.Vector3();

scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0806);
scene.fog = new THREE.Fog(0x0a0806, 10.5, 19);

camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.05, 60);
camera.position.set(3.5, 2.35, 4.2);

renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const ballGeo = new THREE.SphereGeometry(R, 48, 32);
function makeBall(num) {
  const mat = new THREE.MeshStandardMaterial({ map: makeBallTexture(num), roughness: 0.16, metalness: 0.04 });
  const mesh = new THREE.Mesh(ballGeo, mat);
  mesh.castShadow = true;
  // fixed pseudo-random decal orientation (deterministic)
  const seed = (num + 3) * 9301 + 49297;
  mesh.rotation.set((seed % 628) / 100, ((seed * 7) % 628) / 100, ((seed * 13) % 628) / 100);
  mesh.position.set(0, BALL_Y, 0);
  scene.add(mesh);
  // soft contact blob shadow
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(R * 4.4, R * 4.4),
    new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, opacity: 0.3, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = BED_Y + 0.0012;
  scene.add(blob);
  return { num, mesh, blob, vel: new THREE.Vector3(), omega: new THREE.Vector3(),
           pocketed: false, dropping: false, done: false, dropT: 0, dropTarget: new THREE.Vector3() };
}
for (let n = 0; n <= 15; n++) balls.push(makeBall(n));

const RACK_ROWS = [[1], [9, 2], [10, 8, 3], [11, 4, 12, 5], [6, 13, 14, 7, 15]];
function rackBalls() {
  for (const b of balls) {
    b.pocketed = false; b.dropping = false; b.done = false; b.dropT = 0;
    b.vel.set(0, 0, 0); b.omega.set(0, 0, 0);
    b.mesh.visible = true; b.blob.visible = true;
  }
  // cue ball behind the head string
  const cue = balls[0];
  cue.mesh.position.set(-0.95, BALL_Y, 0);
  // triangle rack, apex on the foot spot
  const apexX = L / 4, stepX = R * Math.sqrt(3), stepZ = 2 * R;
  let idx = 1;
  for (let row = 0; row < RACK_ROWS.length; row++) {
    const rowNums = RACK_ROWS[row];
    for (let k = 0; k < rowNums.length; k++) {
      const ball = balls[idx++];
      // find by number to be explicit
      const target = balls.find(b => b.num === rowNums[k]);
      target.mesh.position.set(apexX + row * stepX, BALL_Y, (k - row / 2) * stepZ);
    }
  }
}
// sanity: ensure every number exists
(function checkRack() {
  const nums = RACK_ROWS.flat().sort((a, b) => a - b);
  for (let n = 1; n <= 15; n++) if (nums[n - 1] !== n) console.warn('rack layout issue near', n);
})();

function reRack() {
  rackBalls();
  pocketedNumbers.length = 0;
  shots = 0;
  scratchPending = false;
  charging = false; power = 0;
  document.getElementById('powerWrap').classList.remove('active');
  updatePocketedHUD();
  document.getElementById('shots').textContent = '0';
  updateStickVis();
}

//  AIMING — dashed guide + ghost ball
// ============================================================
const guideGeo = new THREE.BufferGeometry();
const guidePositions = new Float32Array(6);
guideGeo.setAttribute('position', new THREE.BufferAttribute(guidePositions, 3));
const guide = new THREE.Line(guideGeo, new THREE.LineDashedMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, dashSize: 0.05, gapSize: 0.032, depthTest: false }));
guide.renderOrder = 5; guide.frustumCulled = false;
scene.add(guide);
const ghost = new THREE.Mesh(new THREE.SphereGeometry(R, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, depthWrite: false }));
scene.add(ghost);

function firstContact() {
  const cue = balls[0].mesh.position;
  const o = { x: cue.x, z: cue.z };
  const d = { x: aimDir.x, z: aimDir.z };
  let bestT = Infinity, bestPoint = null;
  // vs object balls (ghost distance = 2R)
  for (let i = 1; i < balls.length; i++) {
    const b = balls[i]; if (b.pocketed) continue;
    const bp = b.mesh.position;
    const ox = o.x - bp.x, oz = o.z - bp.z;
    const bq = ox * d.x + oz * d.z;
    const c = ox * ox + oz * oz - 4 * R * R;
    const disc = bq * bq - c;
    if (disc <= 0) continue;
    const t = -bq - Math.sqrt(disc);
    if (t > 0.001 && t < bestT) { bestT = t; bestPoint = { x: o.x + d.x * t, z: o.z + d.z * t }; }
  }
  // vs cushions (nose lines), honouring pocket gaps
  const rails = [
    { nx: 0, nz: 1,  dist: (HZ - o.z) },   // +z
    { nx: 0, nz: -1, dist: (o.z + HZ) },
    { nx: 1, nz: 0,  dist: (HX - o.x) },
    { nx: -1, nz: 0, dist: (o.x + HX) }
  ];
  for (const r of rails) {
    const denom = d.x * r.nx + d.z * r.nz;
    if (denom <= 1e-6) continue;
    const t = r.dist / denom;
    if (t <= 0.001) continue;
    const px = o.x + d.x * t, pz = o.z + d.z * t;
    let valid;
    if (r.nz !== 0) {
      if (Math.abs(px) > HX - CORNER_GAP) valid = false;              // corner mouth
      else if (Math.abs(px) < SIDE_GAP)  valid = false;               // side pocket mouth
      else valid = true;
    } else {
      valid = Math.abs(pz) <= HZ - CORNER_GAP;                        // short rail, corner mouths excluded
    }
    if (valid && t < bestT) { bestT = t; bestPoint = { x: px, z: pz }; }
  }
  if (!bestPoint || bestT === Infinity || bestT > 6) {
    bestT = Math.min(2.2, 4); bestPoint = { x: o.x + d.x * bestT, z: o.z + d.z * bestT };
    return { t: bestT, point: bestPoint, contact: false };
  }
  return { t: bestT, point: bestPoint, contact: true };
}

function updateGuide() {
  const stopped = allStopped();
  guide.visible = stopped;
  ghost.visible = stopped;
  if (!stopped) return;
  const cue = balls[0].mesh.position;
  const hit = firstContact();
  const startT = R + 0.004, endT = Math.max(startT + 0.01, hit.t - R * 0.4);
  guidePositions[0] = cue.x + aimDir.x * startT; guidePositions[1] = BALL_Y; guidePositions[2] = cue.z + aimDir.z * startT;
  guidePositions[3] = cue.x + aimDir.x * endT;   guidePositions[4] = BALL_Y; guidePositions[5] = cue.z + aimDir.z * endT;
  guideGeo.attributes.position.needsUpdate = true;
  guide.computeLineDistances();
  ghost.position.set(hit.point.x, BALL_Y, hit.point.z);
}

function updateStickVis() {
  const show = allStopped() && !charging ? true : true;
  stick.visible = allStopped();
  return show;
}
function positionStick(pull) {
  const cue = balls[0].mesh.position;
  const back = R + 0.012 + pull + 0.70;
  stick.position.set(cue.x - aimDir.x * back, BALL_Y + 0.004, cue.z - aimDir.z * back);
  stick.rotation.set(0, Math.atan2(aimDir.x, aimDir.z), 0);
}

// ============================================================
//  PHYSICS — fixed sub-step simulation
// ============================================================
const _axis = new THREE.Vector3();
const _tmpV = new THREE.Vector3();

function allStopped() {
  for (const b of balls) {
    if (!b.pocketed) {
      if (b.vel.lengthSq() > 0.0009) return false;
    } else if (!b.done) return false;
  }
  return true;
}

function reflectCircle(b, cx, cz, radius, rest) {
  const p = b.mesh.position;
  const dx = p.x - cx, dz = p.z - cz;
  const d2 = dx * dx + dz * dz;
  if (d2 >= radius * radius || d2 < 1e-9) return false;
  const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
  p.x = cx + nx * radius; p.z = cz + nz * radius;
  const vn = b.vel.x * nx + b.vel.z * nz;
  if (vn < 0) {
    b.vel.x -= (1 + rest) * vn * nx;
    b.vel.z -= (1 + rest) * vn * nz;
    b.vel.x *= 0.94; b.vel.z *= 0.94;
    b.omega.y *= 0.65;
  }
  return true;
}

function pocketBall(b, pocket) {
  b.pocketed = true; b.dropping = true; b.dropT = 0;
  b.dropTarget.set(pocket.x, BED_Y, pocket.z);
  b.vel.set(0, 0, 0);
  b.blob.visible = false;
  if (b.num === 0) {
    scratchPending = true;
    showMessage('Scratch! Cue ball respawns behind the head string', true);
  } else {
    pocketedNumbers.push(b.num);
    showMessage('Ball ' + b.num + ' pocketed', false);
    updatePocketedHUD();
  }
}

function advanceDrop(b, dt) {
  b.dropT += dt;
  const p = b.mesh.position;
  p.x += (b.dropTarget.x - p.x) * Math.min(1, 2.6 * dt);
  p.z += (b.dropTarget.z - p.z) * Math.min(1, 2.6 * dt);
  p.y = BALL_Y - 0.5 * 9.8 * b.dropT * b.dropT;
  const w = b.omega.length();
  if (w > 0.01) { _axis.copy(b.omega).normalize(); b.mesh.rotateOnWorldAxis(_axis, w * dt); }
  if (p.y < BED_Y - 0.33 || b.dropT > 0.8) { b.mesh.visible = false; b.done = true; b.dropping = false; }
}

function physicsStep(dt) {
  for (const b of balls) {
    if (b.pocketed) { if (b.dropping) advanceDrop(b, dt); continue; }
    const v = b.vel, o = b.omega;

    // ---- sliding vs rolling friction ----
    const cvx = v.x + o.z * R, cvz = v.z - o.x * R;
    const cv = Math.hypot(cvx, cvz);
    if (cv > 0.012) {
      const nx = cvx / cv, nz = cvz / cv;
      v.x -= nx * MU * G * dt; v.z -= nz * MU * G * dt;
      o.x += (2.5 * MU * G * dt * nz) / R;
      o.z += (-2.5 * MU * G * dt * nx) / R;
    } else {
      const sp = Math.hypot(v.x, v.z);
      if (sp > 1e-5) {
        const dec = Math.min(sp, MU_ROLL * G * dt);
        v.x -= (v.x / sp) * dec; v.z -= (v.z / sp) * dec;
      }
    }
    o.y *= Math.exp(-0.55 * dt);

    // full stop
    if (v.lengthSq() < 0.0008 && cv < 0.05) { v.set(0, 0, 0); o.x = 0; o.z = 0; }

    // integrate
    const p = b.mesh.position;
    p.x += v.x * dt; p.z += v.z * dt;
    const w = o.length();
    if (w > 0.01) { _axis.copy(o).normalize(); b.mesh.rotateOnWorldAxis(_axis, w * dt); }
  }

  // ---- ball ↔ ball elastic collisions ----
  for (let i = 0; i < balls.length; i++) {
    const a = balls[i]; if (a.pocketed) continue;
    const pa = a.mesh.position;
    for (let j = i + 1; j < balls.length; j++) {
      const b = balls[j]; if (b.pocketed) continue;
      const pb = b.mesh.position;
      const dx = pb.x - pa.x, dz = pb.z - pa.z;
      const minD = 2 * R, d2 = dx * dx + dz * dz;
      if (d2 >= minD * minD || d2 < 1e-12) continue;
      const d = Math.sqrt(d2), nx = dx / d, nz = dz / d, overlap = minD - d;
      pa.x -= nx * overlap * 0.5; pa.z -= nz * overlap * 0.5;
      pb.x += nx * overlap * 0.5; pb.z += nz * overlap * 0.5;
      const rvx = a.vel.x - b.vel.x, rvz = a.vel.z - b.vel.z;
      const vn = rvx * nx + rvz * nz;
      if (vn < 0) {
        const imp = (1 + REST_BALL) * (-vn) / 2;
        a.vel.x += nx * imp; a.vel.z += nz * imp;
        b.vel.x -= nx * imp; b.vel.z -= nz * imp;
      }
    }
  }

  for (const b of balls) {
    if (b.pocketed) continue;
    const p = b.mesh.position;

    // ---- pockets (capture) ----
    let captured = null;
    for (const pk of POCKETS) {
      const dx = p.x - pk.x, dz = p.z - pk.z;
      if (dx * dx + dz * dz < pk.cap * pk.cap) { captured = pk; break; }
    }
    if (captured) { pocketBall(b, captured); continue; }

    // ---- jaws (cushion nose ends) ----
    for (const jaw of JAWS) reflectCircle(b, jaw.x, jaw.z, JAW_R, 0.55);

    // ---- pocket throat backstop (only beyond the nose line) ----
    for (const pk of POCKETS) {
      const dx = p.x - pk.x, dz = p.z - pk.z;
      const d = Math.hypot(dx, dz);
      if (d < BACK_R) {
        const beyond = pk.side ? Math.abs(p.z) > HZ - R : (Math.abs(p.x) > HX - R || Math.abs(p.z) > HZ - R);
        if (beyond) reflectCircle(b, pk.x, pk.z, BACK_R, 0.35);
      }
    }

    // ---- cushions with mouth gaps ----
    if (p.z > HZ - R && Math.abs(p.x) <= HX - CORNER_GAP && Math.abs(p.x) >= SIDE_GAP) {
      p.z = HZ - R;
      if (b.vel.z > 0) {
        b.vel.z = -b.vel.z * REST_CUSH;
        b.vel.x = b.vel.x * 0.88 + b.omega.y * R * 0.32;   // english kick
        b.omega.y *= 0.55;
      }
    } else if (p.z < -(HZ - R) && Math.abs(p.x) <= HX - CORNER_GAP && Math.abs(p.x) >= SIDE_GAP) {
      p.z = -(HZ - R);
      if (b.vel.z < 0) {
        b.vel.z = -b.vel.z * REST_CUSH;
        b.vel.x = b.vel.x * 0.88 + b.omega.y * R * 0.32;
        b.omega.y *= 0.55;
      }
    }
    if (p.x > HX - R && Math.abs(p.z) <= HZ - CORNER_GAP) {
      p.x = HX - R;
      if (b.vel.x > 0) {
        b.vel.x = -b.vel.x * REST_CUSH;
        b.vel.z = b.vel.z * 0.88 - b.omega.y * R * 0.32;
        b.omega.y *= 0.55;
      }
    } else if (p.x < -(HX - R) && Math.abs(p.z) <= HZ - CORNER_GAP) {
      p.x = -(HX - R);
      if (b.vel.x < 0) {
        b.vel.x = -b.vel.x * REST_CUSH;
        b.vel.z = b.vel.z * 0.88 - b.omega.y * R * 0.32;
        b.omega.y *= 0.55;
      }
    }

    // ---- ultimate failsafe: never lose a ball outside the table ----
    if (Math.abs(p.x) > HX + 0.22 || Math.abs(p.z) > HZ + 0.22) {
      let nearest = POCKETS[0], nd = Infinity;
      for (const pk of POCKETS) { const d = (p.x - pk.x) ** 2 + (p.z - pk.z) ** 2; if (d < nd) { nd = d; nearest = pk; } }
      pocketBall(b, nearest);
    }
  }
}

// ============================================================
//  SHOOTING
// ============================================================
function doShoot(pw, dir, tip) {
  const cue = balls[0];
  if (cue.pocketed) return;
  cue.vel.copy(dir).multiplyScalar(0.6 + pw * 6.6);
  _tmpV.crossVectors(UP, dir).normalize();
  cue.omega.copy(_tmpV).multiplyScalar(tip.y * 24).addScaledVector(UP, tip.x * 24);
  shots++;
  document.getElementById('shots').textContent = String(shots);
}

function respawnCueIfNeeded() {
  if (!scratchPending || !allStopped()) return;
  scratchPending = false;
  const cue = balls[0];
  const candidates = [];
  for (let z = 0; z <= 0.5; z += 0.07) {
    candidates.push([-1.02, z]); candidates.push([-1.02, -z]);
    if (z > 0.14) { candidates.push([-0.82, z * 0.7]); candidates.push([-0.82, -z * 0.7]); }
  }
  let placed = null;
  for (const [x, z] of candidates) {
    let ok = true;
    for (const b of balls) {
      if (b.num === 0 || b.pocketed) continue;
      const p = b.mesh.position;
      if ((p.x - x) ** 2 + (p.z - z) ** 2 < (2 * R + 0.01) ** 2) { ok = false; break; }
    }
    if (ok) { placed = [x, z]; break; }
  }
  if (!placed) placed = [-1.02, 0];
  cue.mesh.position.set(placed[0], BALL_Y, placed[1]);
  cue.mesh.visible = true; cue.pocketed = false; cue.dropping = false; cue.done = false;
  cue.vel.set(0, 0, 0); cue.omega.set(0, 0, 0);
  cue.blob.visible = true;
}

// spin diagram
const spinCtx = document.getElementById('spinCanvas').getContext('2d');
function drawSpinDiagram() {
  const ctx = spinCtx, S = 112, c = S / 2;
  ctx.clearRect(0, 0, S, S);
  const g = ctx.createRadialGradient(c - 12, c - 14, 4, c, c, c - 2);
  g.addColorStop(0, '#fdfcf4'); g.addColorStop(0.55, '#e8e6da'); g.addColorStop(1, '#b9b7ac');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c, c, c - 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(40,36,28,0.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(c, c, c - 3, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(40,36,28,0.28)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(c, 8); ctx.lineTo(c, S - 8); ctx.moveTo(8, c); ctx.lineTo(S - 8, c); ctx.stroke();
  ctx.strokeStyle = 'rgba(40,36,28,0.4)';
  ctx.beginPath(); ctx.arc(c, c, 15, 0, Math.PI * 2); ctx.stroke();
  // tip dot (clamped into the contact circle)
  let tx = tipOffset.x, ty = tipOffset.y;
  const m = Math.hypot(tx, ty); if (m > 1) { tx /= m; ty /= m; }
  const px = c + tx * 30, py = c - ty * 30;
  ctx.fillStyle = '#c2472e';
  ctx.beginPath(); ctx.arc(px, py, 8.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff4e0'; ctx.lineWidth = 2; ctx.stroke();
}
drawSpinDiagram();

const mouseNDC = new THREE.Vector2(0.6, 0.2);
function updateAimFromMouse() {
  raycaster.setFromCamera(mouseNDC, camera);
  const o = raycaster.ray.origin, d = raycaster.ray.direction;
  if (Math.abs(d.y) < 1e-5) return;
  const t = (BALL_Y - o.y) / d.y;
  if (t <= 0) return;
  hitPlanePoint.copy(o).addScaledVector(d, t);
  const cue = balls[0].mesh.position;
  _tmpV.set(hitPlanePoint.x - cue.x, 0, hitPlanePoint.z - cue.z);
  if (_tmpV.lengthSq() > 1e-6) aimDir.copy(_tmpV.normalize());
}
window.addEventListener('pointermove', e => {
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
renderer.domElement.addEventListener('mousedown', e => {
  if (e.button !== 0 || !allStopped() || mode === 'recording') return;
  charging = true; power = 0; powerDir = 1;
  document.getElementById('powerWrap').classList.add('active');
});
window.addEventListener('mouseup', e => {
  if (e.button !== 0 || !charging) return;
  charging = false;
  document.getElementById('powerWrap').classList.remove('active');
  if (power > 0.045 && allStopped()) doShoot(power, aimDir, tipOffset);
  power = 0;
});
window.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const step = 0.2;
  let handled = true;
  switch (k) {
    case 'w': tipOffset.y = Math.min(1, tipOffset.y + step); break;
    case 's': tipOffset.y = Math.max(-1, tipOffset.y - step); break;
    case 'a': tipOffset.x = Math.max(-1, tipOffset.x - step); break;
    case 'd': tipOffset.x = Math.min(1, tipOffset.x + step); break;
    case 'r': if (mode !== 'recording') reRack(); break;
    default: handled = false;
  }
  if (handled) {
    const m = Math.hypot(tipOffset.x, tipOffset.y);
    if (m > 1) { tipOffset.x /= m; tipOffset.y /= m; }
    drawSpinDiagram();
    e.preventDefault();
  }
});
document.getElementById('rerackBtn').addEventListener('click', () => { if (mode !== 'recording') reRack(); });

// ============================================================
//  SHOWCASE — deterministic 12-second scripted break
// ============================================================
const SHOWCASE = {
  duration: 12,
  shotT: 1.0,
  keys: [
    { t: 0.0,  p: [4.6, 3.7, 6.1],   l: [0, 0.8, 0] },
    { t: 1.7,  p: [3.0, 2.05, 3.35], l: [-0.35, 0.82, 0] },
    { t: 3.3,  p: [0.35, 4.7, 0.55], l: [0.15, 0.8, 0] },
    { t: 5.1,  p: [2.95, 1.12, 1.35],l: [0.75, 0.82, 0.02] },
    { t: 7.3,  p: [2.15, 1.5, -2.35],l: [0.9, 0.82, 0.25] },
    { t: 9.4,  p: [-2.45, 1.5, 1.95],l: [0.55, 0.82, 0.05] },
    { t: 12.0, p: [0.1, 2.4, 4.4],   l: [0, 0.84, 0] }
  ]
};
const showKeys = SHOWCASE.keys.map(k => ({ t: k.t, p: new THREE.Vector3(...k.p), l: new THREE.Vector3(...k.l) }));
const _camP = new THREE.Vector3(), _camL = new THREE.Vector3();

function smoothstep(s) { return s * s * (3 - 2 * s); }
function positionShowcaseCamera(t) {
  let i = 0;
  while (i < showKeys.length - 2 && t > showKeys[i + 1].t) i++;
  const a = showKeys[i], b = showKeys[i + 1];
  const s = smoothstep(Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))));
  _camP.lerpVectors(a.p, b.p, s);
  _camL.lerpVectors(a.l, b.l, s);
  camera.position.copy(_camP);
  camera.lookAt(_camL);
}
function showcaseLight(t) {
  // lamp flares through the break, then settles back
  let boost = 0;
  if (t > 0.9 && t < 3.2) boost = Math.sin((t - 0.9) / 2.3 * Math.PI);
  spot.intensity = 1.55 + boost * 0.95;
  lampFill.intensity = 0.55 + boost * 0.35;
  lampGroup.userData.innerDisc.material.emissiveIntensity = 1.6 + boost * 1.5;
  glowBig.material.opacity = 0.62 + boost * 0.3;
  hemi.intensity = 0.5 - boost * 0.1;
}
function showcaseStick(t) {
  const cue = balls[0].mesh.position;
  const dir = _tmpV.set(1, 0, 0);
  if (t >= SHOWCASE.shotT + 0.28) { stick.visible = false; return; }
  stick.visible = true;
  let pull;
  if (t < 0.62) pull = 0.06;
  else if (t < SHOWCASE.shotT) pull = 0.06 + smoothstep((t - 0.62) / (SHOWCASE.shotT - 0.62)) * 0.44;
  else pull = Math.max(-0.03, 0.5 - ((t - SHOWCASE.shotT) / 0.10) * 0.53);
  const back = R + 0.012 + pull + 0.70;
  stick.position.set(cue.x - back, BALL_Y + 0.004, cue.z);
  stick.rotation.set(0, Math.atan2(1, 0), 0);
}
function resetForShowcase() {
  reRack();
  tipOffset.x = 0; tipOffset.y = 0.55;          // a touch of follow on the break
  drawSpinDiagram();
  aimDir.set(1, 0, 0);
  charging = false; power = 0;
  document.getElementById('shots').textContent = '0';
}
function syncBench() {
  bench.balls.length = balls.length;
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i], p = b.mesh.position;
    let s = bench.balls[i];
    if (!s) s = bench.balls[i] = {};
    s.n = b.num; s.x = +p.x.toFixed(4); s.y = +p.y.toFixed(4); s.z = +p.z.toFixed(4);
    s.pocketed = b.pocketed;
  }
  bench.pocketed = pocketedNumbers.slice();
  bench.shots = shots;
  bench.moving = !allStopped();
}
function seekShowcase(t) {
  t = Math.min(SHOWCASE.duration, Math.max(0, t));
  resetForShowcase();
  const dt = STEP;
  let simT = 0, fired = false;
  while (simT < t - 1e-9) {
    const h = Math.min(dt, t - simT);
    if (!fired && simT + h >= SHOWCASE.shotT) {
      doShoot(1.0, new THREE.Vector3(1, 0, 0), { x: 0, y: 0.55 });
      fired = true;
    }
    physicsStep(h);
    for (const b of balls) { if (b.pocketed) b.blob.visible = false; }
    simT += h;
  }
  // re-seat all blob shadows under resting balls
  for (const b of balls) {
    if (!b.pocketed) {
      b.blob.position.set(b.mesh.position.x, BED_Y + 0.0012, b.mesh.position.z);
      b.blob.visible = true;
    }
  }
  positionShowcaseCamera(t);
  showcaseLight(t);
  showcaseStick(t);
  guide.visible = false; ghost.visible = false;
  updateMotes(t);
  updatePocketedHUD();
  document.getElementById('shots').textContent = String(shots);
  syncBench();
  renderFrame();
}
window.showcase = { duration: SHOWCASE.duration, seek: seekShowcase };

function updateMotes(time) {
  for (let i = 0; i < MOTES; i++) {
    const m = moteBase[i];
    motePos[i * 3]     = m.x + Math.sin(time * 0.6 + m.ph) * 0.03;
    motePos[i * 3 + 1] = 0.95 + ((m.y + time * 0.055) % 1.45);
    motePos[i * 3 + 2] = m.z + Math.cos(time * 0.5 + m.ph * 1.7) * 0.03;
  }
  moteGeo.attributes.position.needsUpdate = true;
}

// ============================================================
//  BLOOM COMPOSER (with graceful fallback)
// ============================================================
try {
  if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.55, 0.74);
    composer.addPass(bloom);
  }
} catch (err) {
  composer = null;
  console.warn('Bloom unavailable, rendering direct.', err);
}
function renderFrame() {
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

// ============================================================
//  RECORD VIDEO BUTTON
// ============================================================
let mode = 'interactive';
let recorder = null, recordChunks = [], recordStartMs = 0;
const recordBtn = document.getElementById('recordBtn');
function pickMime() {
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const t of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  return '';
}
recordBtn.addEventListener('click', () => {
  if (mode === 'recording') return;
  if (!window.MediaRecorder || !renderer.domElement.captureStream) { showMessage('MediaRecorder not supported in this browser', true); return; }
  const mime = pickMime();
  const stream = renderer.domElement.captureStream(60);
  try {
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12000000 } : undefined);
  } catch (err) { showMessage('Recording not available', true); return; }
  recordChunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) recordChunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(recordChunks, { type: recorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'the-break-showcase.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    mode = 'interactive';
    controls.enabled = true;
    recordBtn.classList.remove('rec');
    recordBtn.innerHTML = '⏺&nbsp; Record video';
    reRack();
    showMessage('Showcase saved — the-break-showcase.webm', false);
  };
  mode = 'recording';
  controls.enabled = false;
  recordBtn.classList.add('rec');
  recordBtn.innerHTML = '●&nbsp; Recording…';
  recordStartMs = performance.now();
  recorder.start(250);
});

// ============================================================
//  MAIN LOOP
// ============================================================
let lastMs = performance.now(), accumulator = 0;
const powerFill = document.getElementById('powerFill');

rackBalls();
updatePocketedHUD();

function animate(now) {
  requestAnimationFrame(animate);
  const rawDt = Math.min(0.05, (now - lastMs) / 1000);
  lastMs = now;

  if (mode === 'recording') {
    const t = (now - recordStartMs) / 1000;
    if (t >= SHOWCASE.duration) { seekShowcase(SHOWCASE.duration); try { recorder.stop(); } catch (e) {} }
    else seekShowcase(t);
    return;
  }

  // fixed-step physics
  accumulator += rawDt;
  let guard = 0;
  while (accumulator >= STEP && guard++ < 24) { physicsStep(STEP); accumulator -= STEP; }
  respawnCueIfNeeded();

  // blob shadows follow balls
  for (const b of balls) {
    if (!b.pocketed) {
      b.blob.position.set(b.mesh.position.x, BED_Y + 0.0012, b.mesh.position.z);
      b.blob.visible = true;
    } else b.blob.visible = false;
  }

  // charge power (ping-pong)
  if (charging) {
    power += powerDir * rawDt * 1.25;
    if (power >= 1) { power = 1; powerDir = -1; }
    else if (power <= 0) { power = 0; powerDir = 1; }
    powerFill.style.width = (power * 100).toFixed(1) + '%';
  } else {
    powerFill.style.width = '0%';
  }

  // aim & stick
  updateAimFromMouse();
  updateGuide();
  if (allStopped()) { stick.visible = true; positionStick(charging ? 0.06 + power * 0.5 : 0.06); }
  else stick.visible = false;

  // dust motes drift (wall-clock — fine for interactivity)
  updateMotes(now * 0.001);

  controls.update();
  syncBench();
  renderFrame();
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
