<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rooftop Garden — Golden Hour Above Marlowe Street</title>
<style>
  :root{
    --cream:#f3e7d3; --gold:#e8b96b; --ink:rgba(12,14,20,0.72);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0b0e16; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* cinematic vignette */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(8,8,14,0.38) 100%);
  }

  .hud{
    position:fixed; z-index:10; color:var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    user-select:none; -webkit-user-select:none;
  }
  #title{
    top:22px; left:26px; pointer-events:none;
    text-shadow:0 2px 18px rgba(0,0,0,0.6);
  }
  #title h1{
    font-size:15px; font-weight:400; letter-spacing:0.42em; text-transform:uppercase;
    color:var(--cream); opacity:0.96;
  }
  #title h1 em{ color:var(--gold); font-style:normal; }
  #title p{
    margin-top:6px; font-size:10.5px; letter-spacing:0.22em; text-transform:uppercase;
    color:rgba(243,231,211,0.62);
  }

  #topRight{
    top:20px; right:22px; display:flex; align-items:center; gap:14px;
  }
  #hourPill{
    display:flex; align-items:center; gap:9px;
    padding:8px 16px; border:1px solid rgba(232,185,107,0.4);
    border-radius:999px; background:var(--ink); backdrop-filter:blur(6px);
    font-size:13px; letter-spacing:0.12em;
  }
  #hourPill .sunDot{
    width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #ffe9b0, #f0a44c);
    box-shadow:0 0 12px 2px rgba(255,200,110,0.75);
  }
  #recordBtn{
    cursor:pointer; font-family:Georgia, serif; font-size:11.5px; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--gold);
    padding:10px 18px; border:1px solid rgba(232,185,107,0.65); border-radius:3px;
    background:linear-gradient(180deg, rgba(43,32,18,0.85), rgba(24,18,12,0.9));
    transition: all .25s ease; backdrop-filter:blur(6px);
  }
  #recordBtn:hover{ background:linear-gradient(180deg, rgba(74,54,28,0.9), rgba(38,28,16,0.95));
    box-shadow:0 0 22px rgba(232,185,107,0.35); color:#ffd98f; }
  #recordBtn.recording{ color:#ff8d6b; border-color:#ff8d6b; animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 6px rgba(255,120,80,0.2);} 50%{ box-shadow:0 0 20px rgba(255,120,80,0.55);} }

  #legend{
    bottom:20px; left:26px; pointer-events:none;
    font-size:10.5px; letter-spacing:0.14em; line-height:2.05;
    color:rgba(243,231,211,0.78); text-shadow:0 1px 8px rgba(0,0,0,0.8);
    background:linear-gradient(90deg, rgba(10,12,18,0.55), transparent);
    padding:10px 44px 10px 14px; border-left:2px solid rgba(232,185,107,0.55);
    border-radius:2px;
  }
  #legend b{ color:var(--gold); font-weight:600; padding:1px 6px; border:1px solid rgba(232,185,107,0.4);
    border-radius:3px; margin-right:6px; font-size:9.5px; }

  #credit{
    bottom:20px; right:24px; pointer-events:none; font-size:9px;
    letter-spacing:0.3em; text-transform:uppercase; color:rgba(243,231,211,0.35);
  }
  #beesChip{
    bottom:20px; left:50%; transform:translateX(-50%); pointer-events:none;
    font-size:9px; letter-spacing:0.32em; text-transform:uppercase;
    color:rgba(255,222,150,0.55);
  }
  /* blog full-screen view: the scene only */
  .hud,#vignette{display:none!important}
</style>
</head>
<body>
<script>/* early-embed: hide overlays before the scene script runs */ if (new URLSearchParams(location.search).get("orbit")) document.documentElement.classList.add("embed");</script>
<div id="app"></div>
<div id="vignette"></div>

<div class="hud" id="title">
  <h1>The <em>Rooftop</em> Garden</h1>
  <p>Golden Hour Above Marlowe Street</p>
</div>

<div class="hud" id="topRight">
  <div id="hourPill"><div class="sunDot"></div><span id="hourText">5:18 PM</span></div>
  <button id="recordBtn">⏺&nbsp;&nbsp;Record Video</button>
</div>

<div class="hud" id="legend">
  <div><b>H</b> advance the hour — dusk to neon night</div>
  <div><b>CLICK</b> greenhouse — roof vents &nbsp;·&nbsp; string lights — switch on early</div>
  <div><b>DRAG</b> orbit &nbsp;·&nbsp; <b>SCROLL</b> zoom</div>
</div>

<div class="hud" id="credit">Marlowe Street &nbsp;·&nbsp; 14th Floor</div>
<div class="hud" id="beesChip">— Bees at work —</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   THE ROOFTOP GARDEN — a single-file Three.js vignette
   ============================================================ */

// ---------- deterministic RNG ----------
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1337);
const rand = (a=1, b) => b === undefined ? rng()*a : a + rng()*(b-a);
const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = v => { v = clamp01(v); return v*v*(3-2*v); };
const lerp = (a,b,t) => a + (b-a)*t;

// ---------- renderer / scene / camera ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf2c184, 70, 265);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 1400);
camera.position.set(17.6, 6.3, 16.1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-2.0, 1.1, -2.4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 3.5;
controls.maxDistance = 60;
controls.update();

/* ---------- blog embed (?orbit=1): both rooftop gardens circle their roof from the same angle, in step ----------
   The angle comes from the wall clock, so the two pages stay together without talking to each other; dragging one
   (mouse or trackpad) turns both, through a BroadcastChannel. The hour is left at the scene's afternoon default. */
const ORBIT = new URLSearchParams(location.search).get('orbit') ? { dist: 31, elev: 0.38, period: 50, off: 0 } : null;
let orbitVisible = true;
if (ORBIT){
  camera.fov = 46; camera.updateProjectionMatrix();
  controls.enabled = false; controls.enableDamping = false;
  const ch = 'BroadcastChannel' in window ? new BroadcastChannel('rooftop-orbit') : null;
  if (ch) ch.onmessage = e => { if (typeof e.data === 'number') ORBIT.off = e.data; };
  const el = renderer.domElement; let drag = null;
  if (matchMedia('(hover: hover) and (pointer: fine)').matches){
    el.style.cursor = 'grab';
    el.addEventListener('pointerdown', e => { drag = { x: e.clientX, off: ORBIT.off }; el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', e => { if (!drag) return; ORBIT.off = drag.off - (e.clientX - drag.x) * 0.008; if (ch) ch.postMessage(ORBIT.off); });
    const end = () => { drag = null; el.style.cursor = 'grab'; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  } else el.style.pointerEvents = 'none';
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { orbitVisible = es[0].isIntersecting; }).observe(document.documentElement);
}
function orbitStep(){
  if (!ORBIT) return;
  // ?a0=<radians> sets the first view; ?t0=<ms> (set by the page for both scenes) starts the circle there; ?still=1 holds it
  const q = orbitStep.q || (orbitStep.q = new URLSearchParams(location.search));
  const a0 = q.get('a0') !== null ? +q.get('a0') : 0.75;
  const turn = q.get('still') ? 0 : q.get('t0') ? (Date.now() - +q.get('t0')) / 1000 / ORBIT.period : (Date.now() / 1000 % ORBIT.period) / ORBIT.period;
  const a = a0 + ORBIT.off + turn * Math.PI * 2;
  const r = ORBIT.dist * Math.cos(ORBIT.elev);
  camera.position.set(Math.sin(a) * r, 1.2 + ORBIT.dist * Math.sin(ORBIT.elev), Math.cos(a) * r);
  controls.target.set(0, 1.2, 0); camera.lookAt(0, 1.2, 0);
}

// ---------- postprocessing (bloom for bulbs / candles / sun) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.75, 0.78);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ============================================================
   PROCEDURAL CANVAS TEXTURES
   ============================================================ */
function makeCanvas(w, h, fn, srgb=true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function makeCanvasPair(w, h, fn){
  const cA = document.createElement('canvas'); cA.width=w; cA.height=h;
  const cB = document.createElement('canvas'); cB.width=w; cB.height=h;
  fn(cA.getContext('2d'), cB.getContext('2d'), w, h);
  const a = new THREE.CanvasTexture(cA); a.colorSpace = THREE.SRGBColorSpace; a.wrapS=a.wrapT=THREE.RepeatWrapping;
  const b = new THREE.CanvasTexture(cB); b.colorSpace = THREE.SRGBColorSpace; b.wrapS=b.wrapT=THREE.RepeatWrapping;
  return { map:a, emissive:b };
}

const texGravel = makeCanvas(512, 512, (g,w,h) => {
  g.fillStyle = '#8a8177'; g.fillRect(0,0,w,h);
  for (let i=0;i<12000;i++){
    const v = 100 + Math.random()*110;
    g.fillStyle = `rgb(${v},${v*0.96},${v*0.9})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*2.4, 1+Math.random()*2.4);
  }
  for (let i=0;i<26;i++){
    g.fillStyle = `rgba(60,56,50,${0.12+Math.random()*0.2})`;
    g.beginPath(); g.ellipse(Math.random()*w, Math.random()*h, 30+Math.random()*80, 20+Math.random()*50, Math.random()*3, 0, 7); g.fill();
  }
  // painted rooftop stencil circle
  g.strokeStyle = 'rgba(220,214,200,0.35)'; g.lineWidth = 7;
  g.beginPath(); g.arc(w*0.72, h*0.3, 60, 0, 7); g.stroke();
});
texGravel.repeat.set(7, 5);

const texWood = makeCanvas(512, 512, (g,w,h) => {
  g.fillStyle = '#6e4f30'; g.fillRect(0,0,w,h);
  const plank = 64;
  for (let y=0; y<h; y+=plank){
    g.fillStyle = `rgb(${105+Math.random()*35},${72+Math.random()*26},${42+Math.random()*16})`;
    g.fillRect(0, y+2, w, plank-4);
    for (let i=0;i<48;i++){
      g.strokeStyle = `rgba(40,24,12,${0.15+Math.random()*0.3})`;
      g.lineWidth = 1+Math.random()*1.6;
      g.beginPath();
      const yy = y + 6 + Math.random()*(plank-12);
      g.moveTo(0, yy);
      g.bezierCurveTo(w*0.3, yy+Math.random()*6-3, w*0.7, yy+Math.random()*6-3, w, yy+Math.random()*4-2);
      g.stroke();
    }
    g.fillStyle = '#3c2a18'; g.fillRect(0, y, w, 3);
  }
});
texWood.repeat.set(1.6, 1);

const texBrick = makeCanvas(512, 512, (g,w,h) => {
  g.fillStyle = '#c8b6a2'; g.fillRect(0,0,w,h);
  const bh = 34, bw = 84;
  for (let y=0, row=0; y<h; y+=bh, row++){
    for (let x=-bw; x<w+bw; x+=bw){
      const off = (row%2) ? bw/2 : 0;
      const r = 128 + Math.random()*52, gg = 62 + Math.random()*30, b = 40 + Math.random()*20;
      g.fillStyle = `rgb(${r},${gg},${b})`;
      g.fillRect(x+off+2.5, y+2.5, bw-5, bh-5);
      g.fillStyle = 'rgba(255,235,210,0.10)';
      g.fillRect(x+off+2.5, y+2.5, bw-5, 5);
    }
  }
  for (let i=0;i<900;i++){
    g.fillStyle = `rgba(30,18,10,${Math.random()*0.3})`;
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2);
  }
});

const texFacade = makeCanvas(512, 512, (g,w,h) => {
  g.fillStyle = '#5f5b55'; g.fillRect(0,0,w,h);
  for (let i=0;i<380;i++){
    g.fillStyle = `rgba(${Math.random()<0.5?20:220},${Math.random()<0.5?18:215},${Math.random()<0.5?16:205},${0.05+Math.random()*0.08})`;
    g.fillRect(Math.random()*w, Math.random()*h, 20+Math.random()*160, 8+Math.random()*60);
  }
  // concrete panel seams
  g.strokeStyle = 'rgba(28,26,24,0.7)'; g.lineWidth = 3;
  for (let x=0; x<=w; x+=128){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for (let y=0; y<=h; y+=170){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  // rain grime
  for (let i=0;i<44;i++){
    const x = Math.random()*w;
    const grad = g.createLinearGradient(x,0,x+14,0);
    grad.addColorStop(0,'rgba(30,30,28,0)'); grad.addColorStop(0.5,`rgba(30,30,28,${0.25+Math.random()*0.3})`); grad.addColorStop(1,'rgba(30,30,28,0)');
    g.fillStyle = grad;
    g.fillRect(x, Math.random()*h*0.4, 12, h);
  }
  // a few small vents
  for (let i=0;i<6;i++){
    g.fillStyle = '#2e2c29';
    g.fillRect(40+Math.random()*(w-80), 40+Math.random()*(h-80), 26, 18);
  }
});
texFacade.repeat.set(5, 4);

function makeBuildingFace(seed){
  const rnd = mulberry32(seed);
  return makeCanvasPair(256, 512, (g, ge, w, h) => {
    const bases = ['#3b414d','#453e38','#36404d','#413d47','#333c46','#474038'];
    g.fillStyle = bases[seed % bases.length]; g.fillRect(0,0,w,h);
    for (let i=0;i<300;i++){
      g.fillStyle = `rgba(0,0,0,${rnd()*0.22})`;
      g.fillRect(rnd()*w, rnd()*h, 10+rnd()*70, 6+rnd()*40);
    }
    ge.fillStyle = '#000000'; ge.fillRect(0,0,w,h);
    const cols=6, rows=17, mx=16, my=14;
    const ww=(w-mx*2)/cols, wh=(h-my*2)/rows;
    for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){
      const wx=mx+x*ww+3, wy=my+y*wh+3.5, wwd=ww-6, whh=wh-7;
      const grad=g.createLinearGradient(0,wy,0,wy+whh);
      if (rnd()<0.3){ grad.addColorStop(0,'#67779a'); grad.addColorStop(1,'#222a3a'); }
      else { grad.addColorStop(0,'#1a202c'); grad.addColorStop(1,'#10141c'); }
      g.fillStyle = grad; g.fillRect(wx,wy,wwd,whh);
      if (rnd()<0.40){
        const warm = rnd()<0.76;
        ge.fillStyle = warm
          ? `rgba(255,${185+((rnd()*55)|0)},${95+((rnd()*60)|0)},${0.7+rnd()*0.3})`
          : `rgba(130,215,255,${0.65+rnd()*0.35})`;
        ge.fillRect(wx,wy,wwd,whh);
        if (rnd()<0.45){ ge.fillStyle='rgba(0,0,0,0.6)'; ge.fillRect(wx,wy,wwd,(0.25+rnd()*0.45)*whh); }
        if (rnd()<0.2){ ge.fillRect(wx,wy,wwd,whh); }
      }
    }
  });
}

const texSoil = makeCanvas(256, 256, (g,w,h) => {
  g.fillStyle = '#533b29'; g.fillRect(0,0,w,h);
  for (let i=0;i<2600;i++){
    const v = Math.random();
    g.fillStyle = v<0.5 ? `rgba(28,18,10,${0.3+Math.random()*0.5})` : `rgba(140,105,70,${0.25+Math.random()*0.4})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*3, 1+Math.random()*3);
  }
});

const texTank = makeCanvas(512, 256, (g,w,h) => {
  for (let x=0;x<w;x+=16){
    g.fillStyle = (x/16)%2 ? '#8d9299' : '#6f757d';
    g.fillRect(x,0,16,h);
    g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(x+2,0,3,h);
  }
  g.fillStyle = '#274d4a'; g.fillRect(0, h*0.62, w, 44);
  g.fillStyle = 'rgba(255,255,255,0.16)'; g.fillRect(0, h*0.62, w, 5);
  g.fillStyle = '#e9dfc8';
  g.font = '700 44px Georgia';
  g.textAlign = 'center';
  g.fillText('H₂O', w/2, h*0.36);
  g.font = '600 15px Georgia';
  g.fillText('R O O F T O P   R E S E R V E', w/2, h*0.52);
  for (let x=8;x<w;x+=16){ g.fillStyle='rgba(20,22,26,0.7)'; g.beginPath(); g.arc(x, h-14, 2.2, 0, 7); g.fill(); g.beginPath(); g.arc(x, 10, 2.2, 0, 7); g.fill(); }
});

const texDoor = makeCanvas(256, 512, (g,w,h) => {
  g.fillStyle = '#2e5a57'; g.fillRect(0,0,w,h);
  g.fillStyle = '#264c49'; g.fillRect(20, 30, w-40, h-60);
  for (let i=0;i<30;i++){
    g.fillStyle = `rgba(15,10,8,${Math.random()*0.4})`;
    const x = Math.random()*w; g.fillRect(x, 0, 4+Math.random()*8, h*Math.random());
  }
  g.strokeStyle = '#d8cfae'; g.lineWidth = 3;
  g.strokeRect(40, 90, w-80, 120);
  g.fillStyle = '#d8cfae'; g.font = '700 26px Georgia'; g.textAlign='center';
  g.fillText('ROOF', w/2, 145); g.fillText('ACCESS', w/2, 182);
  g.fillStyle = '#c8b060'; g.beginPath(); g.arc(w-38, h*0.55, 6, 0, 7); g.fill();
});

const texSunflower = makeCanvas(128, 128, (g,w,h) => {
  g.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  for (let i=0;i<18;i++){
    const a = i/18 * Math.PI*2;
    g.save(); g.translate(cx,cy); g.rotate(a);
    const grad = g.createLinearGradient(0,-14,0,-60);
    grad.addColorStop(0,'#e09a1e'); grad.addColorStop(0.5,'#f5c33c'); grad.addColorStop(1,'#f8e06a');
    g.fillStyle = grad;
    g.beginPath(); g.ellipse(0, -36, 8.5, 26, 0, 0, 7); g.fill();
    g.restore();
  }
  const rg = g.createRadialGradient(cx,cy,2,cx,cy,22);
  rg.addColorStop(0,'#5a3416'); rg.addColorStop(0.7,'#3c2210'); rg.addColorStop(1,'#241207');
  g.fillStyle = rg; g.beginPath(); g.arc(cx,cy,21,0,7); g.fill();
  // seed spiral
  g.fillStyle = 'rgba(220,180,90,0.5)';
  for (let i=0;i<60;i++){
    const a = i*2.39996, r = 2.1*Math.sqrt(i);
    g.fillRect(cx+Math.cos(a)*r, cy+Math.sin(a)*r, 1.6, 1.6);
  }
});

const texLeaf = makeCanvas(64, 64, (g,w,h) => {
  g.clearRect(0,0,w,h);
  const leaves = [[32,34,0],[22,28,-0.8],[42,28,0.8],[17,40,-1.4],[47,40,1.4],[32,18,0],[26,46,-0.4],[38,46,0.4]];
  for (const [x,y,rot] of leaves){
    g.save(); g.translate(x,y); g.rotate(rot);
    const grad = g.createLinearGradient(0,4,0,-16);
    grad.addColorStop(0,'#2d5426'); grad.addColorStop(1,'#5d8b3a');
    g.fillStyle = grad;
    g.beginPath(); g.ellipse(0,-7,5.5,13,0,0,7); g.fill();
    g.restore();
  }
});

function stripesCloth(c1, c2, vertical=true){
  return makeCanvas(256, 256, (g,w,h) => {
    g.fillStyle = c1; g.fillRect(0,0,w,h);
    g.fillStyle = c2;
    if (vertical) for (let x=0;x<w;x+=64) g.fillRect(x,0,22,h);
    else for (let y=0;y<h;y+=42) g.fillRect(0,y,w,14);

/* ============================================================
   SKY — gradient shader with sun, neon dusk band, stars, clouds
   ============================================================ */
const skyUniforms = {
  sunDir:     { value: new THREE.Vector3(-0.2, 0.25, -0.95).normalize() },
  zenith:     { value: new THREE.Color('#3f5a7c') },
  horizon:    { value: new THREE.Color('#f6bd7d') },
  sunGlow:    { value: new THREE.Color('#ffdf9e') },
  nightF:     { value: 0.0 },
  time:       { value: 0.0 }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vDir;
    uniform vec3 sunDir, zenith, horizon, sunGlow;
    uniform float nightF, time;

    float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f*f*(3.0-2.0*f);
      float a = hash21(i), b = hash21(i+vec2(1,0)), c = hash21(i+vec2(0,1)), d = hash21(i+vec2(1,1));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }
    float fbm(vec2 p){
      float v = 0.0, a = 0.55;
      for (int i=0;i<4;i++){ v += a*vnoise(p); p = p*2.13 + vec2(17.3, 9.1); a *= 0.52; }
      return v;
    }

    void main(){
      vec3 dir = normalize(vDir);
      float h = clamp(dir.y, 0.0, 1.0);
      float t = pow(1.0 - h, 2.1);
      vec3 col = mix(zenith, horizon, t);

      float s = max(dot(dir, sunDir), 0.0);
      col += sunGlow * (pow(s, 420.0)*1.6 + pow(s, 32.0)*0.55 + pow(s, 5.0)*0.16);

      // neon dusk haze + magenta city glow toward the skyline at night
      float skylineFacing = pow(max(dot(normalize(dir.xz + vec2(1e-4)), normalize(vec2(-0.28, -1.0))), 0.0), 5.0);
      col += vec3(0.06, 0.42, 0.52) * nightF * pow(t, 3.2) * 0.95;
      col += vec3(0.42, 0.10, 0.44) * nightF * skylineFacing * t * 1.15;

      // drifting clouds, lit warm at dusk, bruised blue at night
      if (dir.y > 0.015){
        vec2 uv = dir.xz / (dir.y + 0.18);
        float n = fbm(uv*1.35 + vec2(time*0.012, time*0.004));
        float cloud = smoothstep(0.50, 0.78, n) * smoothstep(0.015, 0.16, dir.y);
        vec3 warmLit = mix(vec3(1.0, 0.72, 0.42), vec3(0.16, 0.22, 0.34), nightF);
        vec3 cloudCol = mix(warmLit, vec3(0.10, 0.13, 0.22), nightF*0.7);
        col = mix(col, cloudCol, cloud*0.78);
        // silver lining near sun
        col += sunGlow * cloud * pow(s, 6.0) * 0.35 * (1.0 - nightF*0.8);
      }

      // stars
      if (nightF > 0.02 && dir.y > 0.03){
        vec3 sp = dir * 210.0;
        vec3 cell = floor(sp);
        float hs = fract(sin(dot(cell, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
        float star = smoothstep(0.992, 1.0, hs);
        float tw = 0.55 + 0.45*sin(time*2.4 + hs*61.0);
        col += vec3(0.9, 0.95, 1.0) * star * tw * nightF * smoothstep(0.05, 0.35, dir.y);
      }

      // below horizon: abyss with faint city bounce
      if (dir.y < 0.0) col = mix(col, horizon*0.32, clamp(-dir.y*5.0, 0.0, 1.0));

      gl_FragColor = vec4(col, 1.0);
    }`
});

function makeBed(x, z, w, d){
  const g = new THREE.Group();
  const h = 0.5;
  const wallT = 0.09;
  // timber frame
  const long1 = new THREE.Mesh(new THREE.BoxGeometry(w, h, wallT), woodMat);
  long1.position.set(0, h/2, -d/2 + wallT/2); long1.castShadow = long1.receiveShadow = true;
  const long2 = long1.clone(); long2.position.z = d/2 - wallT/2;
  const short1 = new THREE.Mesh(new THREE.BoxGeometry(wallT, h, d - wallT*2), woodMat);
  short1.position.set(-w/2 + wallT/2, h/2, 0); short1.castShadow = short1.receiveShadow = true;
  const short2 = short1.clone(); short2.position.x = w/2 - wallT/2;
  // corner posts
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, h+0.14, 0.16), darkWood);
    post.position.set(sx*(w/2 - wallT/2), (h+0.14)/2, sz*(d/2 - wallT/2));
    post.castShadow = true; g.add(post);
  }
  g.add(long1, long2, short1, short2);
  // soil
  const soil = new THREE.Mesh(new THREE.BoxGeometry(w - wallT*2, 0.1, d - wallT*2), soilMat);
  soil.position.y = h - 0.06; soil.receiveShadow = true;
  g.add(soil);
  g.position.set(x, 0, z);
  scene.add(g);
  return { group: g, topY: h - 0.01, w, d };
}

  const herbShades = [0x3e6b34, 0x547a3a, 0x2f5429, 0x6b8a44];
  const bladeGeo = new THREE.PlaneGeometry(0.075, 0.34);
  bladeGeo.translate(0, 0.17, 0);
  const bed = bedHerb;
  for (let i=0;i<46;i++){
    const tuft = new THREE.Group();
    const px = (rng()-0.5)*(bed.w-0.5), pz = (rng()-0.5)*(bed.d-0.4);
    const shade = new THREE.MeshStandardMaterial({ color: herbShades[(rng()*herbShades.length)|0], roughness: 0.9, side: THREE.DoubleSide });
    const blades = 9 + (rng()*5|0);
    for (let b=0;b<blades;b++){
      const blade = new THREE.Mesh(bladeGeo, shade);
      blade.rotation.y = rng()*Math.PI*2;
      blade.rotation.z = (rng()-0.5)*0.7;
      blade.scale.setScalar(0.7 + rng()*0.8);
      blade.position.y = bed.topY;
      blade.castShadow = true;
      tuft.add(blade);
    }
    tuft.position.set(px, 0, pz);
    bed.group.add(tuft);
    addSwayer(tuft, 0.09);
  }
  // a terracotta marker pot in the middle
  const marker = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.07, 0.16, 10), terracotta);
  marker.position.set(0.4, bed.topY + 0.08, 0); bed.group.add(marker);
}

// --- sunflower row along the east parapet ---
const sunflowerHeads = [];
{
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x47703a, roughness: 0.85 });

    const px = 14.9, pz = -2.6 + i*1.85 + (rng()-0.5)*0.4;

    const plant = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, h, 7), stemMat);
    stem.position.y = h/2; stem.castShadow = true; plant.add(stem);
    const headGroup = new THREE.Group();
    headGroup.position.y = h;
    const face = new THREE.Mesh(new THREE.CircleGeometry(0.21 + rng()*0.05, 20), faceMat);
    face.position.z = 0.028;

/* ============================================================
   PERGOLA + VINES + DINING TABLE SET FOR DINNER
   ============================================================ */
const PERGOLA = { x0:-13.2, x1:-6.9, z0:-6.6, z1:-1.3, h:2.72 };
{
  const postGeo = new THREE.BoxGeometry(0.2, PERGOLA.h, 0.2);
  for (const px of [PERGOLA.x0, PERGOLA.x1]) for (const pz of [PERGOLA.z0, PERGOLA.z1]){
    const post = new THREE.Mesh(postGeo, woodMat);
    post.position.set(px, PERGOLA.h/2, pz);
    post.castShadow = post.receiveShadow = true;
    scene.add(post);
  }
  // beams along x on both z sides
  for (const pz of [PERGOLA.z0, PERGOLA.z1]){
    const beam = new THREE.Mesh(new THREE.BoxGeometry(PERGOLA.x1-PERGOLA.x0+0.7, 0.22, 0.18), darkWood);
    beam.position.set((PERGOLA.x0+PERGOLA.x1)/2, PERGOLA.h + 0.11, pz);
    beam.castShadow = true; scene.add(beam);
  }
  // rafters along z
  for (let i=0;i<7;i++){
    const px = PERGOLA.x0 + 0.3 + i*(PERGOLA.x1-PERGOLA.x0-0.6)/6;
    const rafter = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.16, PERGOLA.z1-PERGOLA.z0+1.0), woodMat);
    rafter.position.set(px, PERGOLA.h + 0.3, (PERGOLA.z0+PERGOLA.z1)/2);
    rafter.castShadow = true; scene.add(rafter);
  }
  // vine canopy — instanced leaf cards hugging the rafters
  const canopyGeo = new THREE.PlaneGeometry(0.44, 0.44);
  const canopy = new THREE.InstancedMesh(canopyGeo, leafMat, 260);
  const dummy = new THREE.Object3D();
  const cRnd = mulberry32(4242);
  for (let i=0;i<260;i++){
    dummy.position.set(
      PERGOLA.x0 + cRnd()*(PERGOLA.x1-PERGOLA.x0),
      PERGOLA.h + 0.38 + (cRnd()-0.5)*0.16,
      PERGOLA.z0 + cRnd()*(PERGOLA.z1-PERGOLA.z0)
    );
    dummy.rotation.set(cRnd()*Math.PI, cRnd()*Math.PI, cRnd()*Math.PI);
    dummy.scale.setScalar(0.7 + cRnd()*0.9);
    dummy.updateMatrix();
    canopy.setMatrixAt(i, dummy.matrix);
  }
  canopy.castShadow = true;
  scene.add(canopy);
  // hanging vine strands swaying in the wind
  const strandGroup = new THREE.Group();
  for (let s=0;s<9;s++){
    const sx = PERGOLA.x0 + 0.5 + cRnd()*(PERGOLA.x1-PERGOLA.x0-1);
    const sz = cRnd() < 0.5 ? PERGOLA.z1 : PERGOLA.z0 + cRnd()*1.2;
    const len = 0.4 + cRnd()*0.75;
    const strand = new THREE.Group();
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, len, 4), new THREE.MeshStandardMaterial({ color: 0x3c5a2a, roughness: 0.9 }));
    cord.position.y = -len/2; strand.add(cord);
    for (let l=0;l<5;l++){
      const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2), leafMat);
      leaf.position.set((cRnd()-0.5)*0.12, -0.15 - l*len/5, (cRnd()-0.5)*0.12);
      leaf.rotation.set(cRnd()*3, cRnd()*3, cRnd()*3);
      strand.add(leaf);
    }
    strand.position.set(sx, PERGOLA.h + 0.3, sz);
    strandGroup.add(strand);
    addSwayer(strand, 0.16);
  }
  scene.add(strandGroup);
  // grape clusters
  const grapeMat = new THREE.MeshStandardMaterial({ color: 0x5b3a6e, roughness: 0.35, emissive: 0x1c0e26, emissiveIntensity: 0.5 });
  for (let gI=0;gI<4;gI++){
    const cluster = new THREE.Group();
    for (let i=0;i<11;i++){
      const berry = new THREE.Mesh(new THREE.SphereGeometry(0.045, 7, 6), grapeMat);
      const a = i*2.4, r = 0.05 + (i%3)*0.035;
      berry.position.set(Math.cos(a)*r, -Math.floor(i/3)*0.075, Math.sin(a)*r);
      cluster.add(berry);
    }
    cluster.position.set(PERGOLA.x0 + 1 + cRnd()*(PERGOLA.x1-PERGOLA.x0-2), PERGOLA.h - 0.05, PERGOLA.z0 + 0.3 + cRnd()*(PERGOLA.z1-PERGOLA.z0-0.6));
    scene.add(cluster);
  }
}

// candles with live flames
const candleFlames = [];
function makeCandle(x, z, hgt){
  const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.036, hgt, 10), new THREE.MeshStandardMaterial({ color: 0xefe6d0, roughness: 0.5 }));
  candle.position.set(x, 0.815 + hgt/2, z); scene.add(candle);
  const flameTex = makeCanvas(32, 64, (g,w,h) => {
    g.clearRect(0,0,w,h);
    const grad = g.createRadialGradient(16,40,1,16,34,26);
    grad.addColorStop(0,'rgba(255,255,220,1)');
    grad.addColorStop(0.35,'rgba(255,205,95,0.95)');
    grad.addColorStop(0.75,'rgba(255,130,30,0.5)');
    grad.addColorStop(1,'rgba(255,90,10,0)');
    g.fillStyle = grad;
    g.beginPath(); g.ellipse(16, 36, 9, 22, 0, 0, 7); g.fill();
  });
  const mat = new THREE.SpriteMaterial({ map: flameTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  const flame = new THREE.Sprite(mat);
  flame.position.set(x, 0.815 + hgt + 0.075, z);
  flame.scale.set(0.09, 0.19, 1);
  scene.add(flame);
  candleFlames.push({ sprite: flame, phase: rng()*10, baseY: flame.position.y });
}
makeCandle(tablePos.x + 0.13, tablePos.z + 0.18, 0.14);
makeCandle(tablePos.x - 0.16, tablePos.z - 0.12, 0.2);

/* ============================================================
   GREENHOUSE — arched, translucent, with clickable roof vents
   ============================================================ */
const greenhouse = { ventL: null, ventR: null, hitBox: null, ventTarget: 0 };
{
  const g = new THREE.Group();
  const W = 5.0, D = 3.6, wallH = 1.15, radius = W/2;
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xe8e4da, roughness: 0.35, metalness: 0.75 });
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xd6ecdd, roughness: 0.08, metalness: 0, transparent: true, opacity: 0.30,
    side: THREE.DoubleSide, depthWrite: false
  });

  // curb / base
  const curb = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, 0.4, D + 0.3), new THREE.MeshStandardMaterial({ map: texBrick, color: 0xd8d2c8, roughness: 0.9 }));
  curb.position.y = 0.2; curb.receiveShadow = curb.castShadow = true; g.add(curb);

  // straight wall glazing
  for (const side of [-1, 1]){
    const wallPanel = new THREE.Mesh(new THREE.PlaneGeometry(D, wallH), glassMat);
    wallPanel.position.set(side*(W/2), 0.4 + wallH/2, 0);
    wallPanel.rotation.y = side * Math.PI/2;
    g.add(wallPanel);
  }
  for (const end of [-1, 1]){
    const wallPanel = new THREE.Mesh(new THREE.PlaneGeometry(W, wallH), glassMat);
    wallPanel.position.set(0, 0.4 + wallH/2, end*(D/2));
    g.add(wallPanel);
  }
  // arched roof shell
  const shell = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, D, 26, 1, true, 0, Math.PI),
    glassMat
  );
  shell.rotation.z = Math.PI/2;
  shell.rotation.y = Math.PI/2;
  shell.position.y = 0.4 + wallH;
  g.add(shell);
  // end caps (half circles)
  for (const end of [-1, 1]){
    const cap = new THREE.Mesh(new THREE.CircleGeometry(radius, 26, 0, Math.PI), glassMat);
    cap.position.set(0, 0.4 + wallH, end*(D/2));
    if (end < 0) cap.rotation.y = Math.PI;
    g.add(cap);
    // gable frame arc
    const arcPts = [];
    for (let i=0;i<=20;i++){
      const a = i/20 * Math.PI;
      arcPts.push(new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius + 0.4 + wallH, end*(D/2)));
    }
    const arc = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(arcPts), 24, 0.055, 6), frameMat);
    g.add(arc);
  }
  // ribs
  for (let i=0;i<5;i++){
    const z = -D/2 + i*(D/(5-1));
    const arcPts = [];
    for (let j=0;j<=20;j++){
      const a = j/20 * Math.PI;
      arcPts.push(new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius + 0.4 + wallH, z));
    }
    const rib = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(arcPts), 22, 0.05, 6), frameMat);
    rib.castShadow = true; g.add(rib);
  }
  // ridge beam + corner posts
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, D + 0.2), frameMat);
  ridge.position.y = 0.4 + wallH + radius; g.add(ridge);
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, wallH, 0.12), frameMat);
    post.position.set(sx*W/2, 0.4 + wallH/2, sz*D/2); g.add(post);
  }
  // door on the sun-facing gable
  const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.72, 0.08), frameMat);
  doorFrame.position.set(0, 0.4 + 0.86, D/2 + 0.01); g.add(doorFrame);
  const doorGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.84, 1.56), new THREE.MeshPhysicalMaterial({ color: 0xbfe0cd, transparent: true, opacity: 0.45, roughness: 0.1 }));
  doorGlass.position.set(0, 0.4 + 0.86, D/2 + 0.06); g.add(doorGlass);
  const doorBar = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.07, 0.03), frameMat);
  doorBar.position.set(0, 0.4 + 0.9, D/2 + 0.075); g.add(doorBar);

  // interior silhouettes — shelving + plants
  const shelfMat = new THREE.MeshStandardMaterial({ color: 0x4c3a28, roughness: 0.9 });
  for (const sz of [-0.8, 0.5]){
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(W - 1.0, 0.06, 0.5), shelfMat);
    shelf.position.set(0, 1.0, sz); g.add(shelf);
    for (let i=0;i<7;i++){
      const px = -W/2 + 0.8 + i*(W-1.6)/6;

function makeSpan(ax, ay, az, bx, by, bz, sag, bulbCount, phase){
  const span = { a: new THREE.Vector3(ax, ay, az), b: new THREE.Vector3(bx, by, bz), sag, bulbCount, phase, bulbs: [], cords: null, hitSpheres: [] };
  const dir = span.b.clone().sub(span.a);
  const len = dir.length();
  span.perp = new THREE.Vector3(-dir.z, 0, dir.x).normalize();

  // wire as dynamic line
  const wireGeo = new THREE.BufferGeometry();
  wireGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(25*3), 3));
  span.wire = new THREE.Line(wireGeo, wireMat);
  span.wire.frustumCulled = false;
  scene.add(span.wire);

  // cords: line segments wire→bulb
  const cordGeo = new THREE.BufferGeometry();
  cordGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bulbCount*2*3), 3));
  span.cords = new THREE.LineSegments(cordGeo, wireMat);
  span.cords.frustumCulled = false;
  scene.add(span.cords);

  const bulbGeo = new THREE.SphereGeometry(0.062, 10, 8);
  const capGeo = new THREE.CylinderGeometry(0.028, 0.034, 0.045, 8);
  for (let i=0;i<bulbCount;i++){
    const u = (i + 0.5) / bulbCount;
    const holder = new THREE.Group();
    const cap = new THREE.Mesh(capGeo, darkMetal); cap.position.y = -0.02; holder.add(cap);
    const bulb = new THREE.Mesh(bulbGeo, bulbGlassMat); bulb.position.y = -0.105; holder.add(bulb);
    scene.add(holder);
    span.bulbs.push({ u, holder, bulb });
    bulbMeshes.push(bulb);
    // invisible fat hit sphere for easy clicking
    const hit = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 6), bulbHitMat);
    hit.userData.type = 'lights';
    scene.add(hit);
    span.hitSpheres.push(hit);
    bulbHitMeshes.push(hit);
  }
  stringSpans.push(span);
  return span;
}

function spanPoint(span, u, time, wind){
  const p = span.a.clone().lerp(span.b, u);
  p.y -= Math.sin(Math.PI * u) * span.sag;
  // wind sway: traveling wave along the wire
  const sway = Math.sin(time*1.35 + u*2.6 + span.phase) * 0.055 * wind
             + Math.sin(time*3.1 + u*5.2 + span.phase*2.0) * 0.018 * wind;
  p.addScaledVector(span.perp, sway);
  p.y += Math.sin(time*2.2 + u*4.0 + span.phase) * 0.02 * wind;
  return p;
}
function updateStringLights(time, wind){
  for (const span of stringSpans){
    const posAttr = span.wire.geometry.getAttribute('position');
    for (let i=0;i<25;i++){
      const p = spanPoint(span, i/24, time, wind);
      posAttr.setXYZ(i, p.x, p.y, p.z);
    }
    posAttr.needsUpdate = true;
    const cordAttr = span.cords.geometry.getAttribute('position');
    for (let i=0;i<span.bulbs.length;i++){
      const b = span.bulbs[i];
      const wireP = spanPoint(span, b.u, time, wind);
      b.holder.position.copy(wireP);
      // bulb lags the wire — pendulum swing
      const swing = Math.sin(time*1.9 + b.u*3.0 + span.phase*1.3) * 0.06 * wind;
      b.holder.rotation.z = swing;
      b.holder.rotation.x = Math.cos(time*1.6 + b.u*2.2 + span.phase) * 0.04 * wind;
      cordAttr.setXYZ(i*2, wireP.x, wireP.y, wireP.z);
      cordAttr.setXYZ(i*2+1, wireP.x, wireP.y - 0.075, wireP.z);
      span.hitSpheres[i].position.set(wireP.x, wireP.y - 0.105, wireP.z);
    }
    cordAttr.needsUpdate = true;
  }
}

class Cloth {
  constructor(uPinA, uPinB, width, height, tex, opts={}){
    this.uA = uPinA; this.uB = uPinB;
    this.cols = opts.cols || 9; this.rows = opts.rows || 7;
    this.width = width; this.height = height;
    this.tex = tex; this.alphaTest = !!opts.alphaTest;
    this.particles = [];
    this.prev = [];
    this.pinnedTop = opts.pinnedTop !== false;   // sheet pins whole top row
    this.phase = rand(Math.PI*2);
    this.build();
  }
  gridPoint(col, row){
    const u = this.uA + (this.uB - this.uA) * (col/this.cols);
    const sag = Math.sin(Math.PI * u) * 0.13;
    const base = laundryPoint(u, 0, 1);
    return new THREE.Vector3(base.x, base.y - (row/this.rows)*this.height, base.z);
  }
  build(){
    const geo = new THREE.PlaneGeometry(this.width, this.height, this.cols, this.rows);
    for (let row=0; row<=this.rows; row++){
      for (let col=0; col<=this.cols; col++){
        const p = this.gridPoint(col, row);
        // small deterministic flutter offset
        p.x += Math.sin(col*2.1 + row*1.3 + this.phase)*0.01;
        this.particles.push(p.clone());
        this.prev.push(p.clone());
        const idx = row*(this.cols+1)+col;
        const posAttr = geo.getAttribute('position');
        posAttr.setXYZ(idx, p.x, p.y, p.z);
      }
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      map: this.tex, side: THREE.DoubleSide, roughness: 0.9,
      alphaTest: this.alphaTest ? 0.5 : 0.0, transparent: this.alphaTest
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.castShadow = true;
    this.mesh.receiveShadow = true;
    this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  }
  reset(){
    this.particles = [];
    this.prev = [];
    for (let row=0; row<=this.rows; row++) for (let col=0; col<=this.cols; col++){
      const p = this.gridPoint(col, row);
      this.particles.push(p.clone());
      this.prev.push(p.clone());
    }
  }
  update(dt, time, wind){
    const gravity = -3.4;
    const windStrength = wind * (1.1 + 0.9*Math.sin(time*0.9 + this.phase) + 0.5*Math.sin(time*2.63 + this.phase*1.7));
    const windDir = new THREE.Vector3(0.35, 0.06, 1).normalize();
    const damping = 0.982;
    // integrate
    for (let i=0;i<this.particles.length;i++){
      const row = Math.floor(i/(this.cols+1));
      if (row === 0 && (this.pinnedTop || i % this.cols === 0)) continue; // pinned
      const p = this.particles[i], pr = this.prev[i];
      const vx = (p.x - pr.x)*damping, vy = (p.y - pr.y)*damping, vz = (p.z - pr.z)*damping;
      pr.copy(p);
      const flutter = Math.sin(time*6.3 + i*0.7 + this.phase) * 0.35 + Math.sin(time*11.7 + i*1.9) * 0.15;
      p.x += vx + (windDir.x*windStrength + flutter*0.4) * dt*dt*60;
      p.y += vy + gravity*dt*dt*3.2 + flutter*0.08*dt*60;
      p.z += vz + (windDir.z*windStrength + flutter) * dt*dt*60;
    }
    // pin top row (or its corners) to the moving line
    for (let col=0; col<=this.cols; col++){
      const idx = col;
      const isCorner = col === 0 || col === this.cols;
      if (this.pinnedTop || isCorner){
        const u = this.uA + (this.uB - this.uA)*(col/this.cols);
        const lp = laundryPoint(u, time, wind);
        this.particles[idx].copy(lp);
      }
    }
    // constraints
    const restH = this.height/this.rows;
    const restW = this.width/this.cols;
    const idxOf = (c,r) => r*(this.cols+1)+c;
    for (let iter=0; iter<4; iter++){
      for (let row=0; row<=this.rows; row++){
        for (let col=0; col<=this.cols; col++){
          const i = idxOf(col, row);
          if (col < this.cols) this.solve(i, idxOf(col+1, row), restW, row===0, time, wind);
          if (row < this.rows) this.solve(i, idxOf(col, row+1), restH, row===0, time, wind);
        }
      }
    }
    // write back to geometry
    const posAttr = this.mesh.geometry.getAttribute('position');
    for (let i=0;i<this.particles.length;i++){
      posAttr.setXYZ(i, this.particles[i].x, this.particles[i].y, this.particles[i].z);
    }
    posAttr.needsUpdate = true;
    this.mesh.geometry.computeVertexNormals();
  }
  solve(i, j, rest, topPinnedI, time, wind){
    const p = this.particles[i], q = this.particles[j];
    const rowI = Math.floor(i/(this.cols+1));
    const rowJ = Math.floor(j/(this.cols+1));
    const pinI = rowI === 0 && (this.pinnedTop || (i % this.cols === 0));
    const pinJ = rowJ === 0 && (this.pinnedTop || (j % this.cols === 0));
    const dx = q.x-p.x, dy = q.y-p.y, dz = q.z-p.z;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1e-6;
    const diff = (dist - rest)/dist * 0.5;
    if (!pinI){ p.x += dx*diff; p.y += dy*diff; p.z += dz*diff; }
    if (!pinJ){ q.x -= dx*diff; q.y -= dy*diff; q.z -= dz*diff; }
  }
}

function beeUpdate(bee, dt, time){
  const target = flowerTargets[bee.targetIdx];
  bee.modeTime += dt;
  if (bee.mode === 'fly'){
    const toTarget = target.clone().sub(bee.pos);
    const dist = toTarget.length();
    if (dist < 0.28){
      bee.mode = 'hover'; bee.modeTime = 0; bee.hoverAngle = rand(Math.PI*2);
    } else {
      toTarget.normalize();
      const desired = toTarget.multiplyScalar(2.35);
      // lively wobble
      desired.x += Math.sin(time*6.1 + bee.seed)*0.9;
      desired.y += Math.cos(time*7.3 + bee.seed*1.7)*0.6;
      desired.z += Math.sin(time*5.2 + bee.seed*0.6)*0.9;
      bee.vel.lerp(desired, 1 - Math.exp(-3.2*dt));
      bee.pos.addScaledVector(bee.vel, dt);
    }
  } else { // hover — orbit the blossom
    bee.hoverAngle += dt*2.6;
    const orbitR = 0.14;
    const hx = target.x + Math.cos(bee.hoverAngle)*orbitR;
    const hz = target.z + Math.sin(bee.hoverAngle)*orbitR;
    const hy = target.y + 0.09 + Math.sin(time*9 + bee.seed)*0.02;
    bee.pos.lerp(new THREE.Vector3(hx, hy, hz), 1 - Math.exp(-8*dt));
    bee.vel.set(Math.cos(bee.hoverAngle + Math.PI/2), 0, Math.sin(bee.hoverAngle + Math.PI/2));
    if (bee.modeTime > 1.5 + (bee.seed % 1)){
      bee.mode = 'fly';
      bee.targetIdx = (bee.targetIdx + 1 + ((bee.seed * 7)|0) % 3) % flowerTargets.length;
    }
  }
  bee.group.position.copy(bee.pos);
  const lookAt = bee.pos.clone().add(bee.vel.lengthSq() > 0.01 ? bee.vel : new THREE.Vector3(0,0,1));
  bee.group.lookAt(lookAt);
  // wing blur
  const flap = Math.sin(time*46 + bee.seed*9) * 0.9;
  bee.wingL.rotation.z = 0.5 + flap;
  bee.wingR.rotation.z = -0.5 - flap;
  bee.wingL.rotation.y = 0.3; bee.wingR.rotation.y = -0.3;
}

// rounded-rectangle parapet path
const catPath = (() => {
  const hx = 17.62, hz = 11.68, r = 1.4;
  const segs = [];
  const straightW = 2*(hx - r), straightD = 2*(hz - r);
  const arc = Math.PI * r / 2;
  const total = 2*straightW + 2*straightD + 4*arc;
  function posAt(s){
    s = ((s % total) + total) % total;
    let acc = 0;
    // top edge (z = -hz), left → right
    if (s < acc + straightW){ return { p: new THREE.Vector3(-(hx-r) + (s-acc), 1.24, -hz), t: new THREE.Vector3(1,0,0) }; } acc += straightW;
    if (s < acc + arc){ const a = (s-acc)/arc * Math.PI/2; return { p: new THREE.Vector3((hx-r) + Math.sin(a)*r, 1.24, -hz + r - Math.cos(a)*r), t: new THREE.Vector3(Math.cos(a), 0, Math.sin(a)) }; } acc += arc;
    if (s < acc + straightD){ return { p: new THREE.Vector3(hx, 1.24, -(hz-r) + (s-acc)), t: new THREE.Vector3(0,0,1) }; } acc += straightD;
    if (s < acc + arc){ const a = (s-acc)/arc * Math.PI/2; return { p: new THREE.Vector3(hx - r + Math.cos(a)*r, 1.24, (hz-r) + Math.sin(a)*r), t: new THREE.Vector3(-Math.sin(a), 0, Math.cos(a)) }; } acc += arc;
    if (s < acc + straightW){ return { p: new THREE.Vector3((hx-r) - (s-acc), 1.24, hz), t: new THREE.Vector3(-1,0,0) }; } acc += straightW;
    if (s < acc + arc){ const a = (s-acc)/arc * Math.PI/2; return { p: new THREE.Vector3(-(hx-r) - Math.sin(a)*r, 1.24, hz - r + Math.cos(a)*r), t: new THREE.Vector3(-Math.cos(a), 0, -Math.sin(a)) }; } acc += arc;
    if (s < acc + straightD){ return { p: new THREE.Vector3(-hx, 1.24, (hz-r) - (s-acc)), t: new THREE.Vector3(0,0,-1) }; } acc += straightD;
    const a = (s-acc)/arc * Math.PI/2; return { p: new THREE.Vector3(-(hx-r) - Math.cos(a)*r + 0, 1.24, -(hz-r) - Math.sin(a)*r + r*0 ), t: new THREE.Vector3(Math.sin(a), 0, -Math.cos(a)) };
  }
  return { posAt, total };
})();
function updateCat(time){
  const speed = 0.55;
  const s = time * speed;
  const { p, t } = catPath.posAt(s);
  const walkPhase = time * 5.2;
  const bob = Math.abs(Math.sin(walkPhase)) * 0.028;
  cat.group.position.set(p.x, p.y + bob, p.z);
  cat.group.rotation.y = Math.atan2(t.x, t.z) + Math.PI;
  cat.parts.head.rotation.y = Math.sin(time*0.7)*0.35;
  cat.parts.head.rotation.x = Math.sin(time*1.3 + 1)*0.12 - 0.05;
  cat.parts.legs[0].rotation.x = Math.sin(walkPhase)*0.55;
  cat.parts.legs[3].rotation.x = Math.sin(walkPhase)*0.55;
  cat.parts.legs[1].rotation.x = -Math.sin(walkPhase)*0.55;
  cat.parts.legs[2].rotation.x = -Math.sin(walkPhase)*0.55;
  for (let i=0;i<cat.parts.tailSegs.length;i++){
    cat.parts.tailSegs[i].rotation.x = Math.sin(time*2.6 - i*0.75)*0.22 - 0.15;
    cat.parts.tailSegs[i].rotation.y = Math.sin(time*1.7 - i*0.5)*0.18;
  }
}

function spawnDroplet(at){
  for (const d of dropletPool){
    if (d.active) continue;
    d.active = true;
    d.mesh.visible = true;
    d.mesh.position.copy(at);
    d.vel.set((Math.random()-0.5)*0.03, 0, (Math.random()-0.5)*0.03);
    return;
  }
}
function updateDrip(dt, forcedActive){
  // natural timer: 4s of dripping every 17s of sim time
  let active = forcedActive;
  if (forcedActive === undefined){
    drip.cycleTime += dt;
    const phase = drip.cycleTime % 17;
    active = phase > 12.0 && phase < 16.0;
  }
  drip.active = active;
  // spawn
  if (active){
    drip.emitTimer += dt;
    while (drip.emitTimer > 0.055){
      drip.emitTimer -= 0.055;
      const e = emitters[(Math.random()*emitters.length)|0];
      spawnDroplet(e);
    }
    drip.wetness = Math.min(1, drip.wetness + dt*0.22);
  } else {
    drip.wetness = Math.max(0, drip.wetness - dt*0.006);
  }
  // integrate droplets
  for (const d of dropletPool){
    if (!d.active) continue;
    d.vel.y -= 5.5*dt;
    d.mesh.position.addScaledVector(d.vel, dt);
    if (d.mesh.position.y < 0.47){
      d.active = false;
      d.mesh.visible = false;
    }
  }
  // wet soil: darken + glisten (low roughness catches the sun/moon)
  const w = drip.wetness;
  soilMat.color.setRGB(lerp(1, 0.32, w), lerp(1, 0.26, w), lerp(1, 0.22, w));
  soilMat.roughness = lerp(0.96, 0.28, w);
}

function windAt(t){
  return 0.65 + 0.38*Math.pow(Math.sin(t*0.42 + 1.2)*0.5 + 0.5, 1.6) + 0.22*Math.sin(t*1.7) * Math.sin(t*0.31);
}

function stepSim(dt){
  sim.time += dt;
  const wind = windAt(sim.time);
  bees.forEach(b => beeUpdate(b, dt, sim.time));
  cloths.forEach(c => c.update(dt, sim.time, wind));
  updateDrip(dt, sim.showcaseActive ? showcaseDripWindow(sim.time) : undefined);
  // vent animation (interactive mode); showcase sets directly
  if (!sim.showcaseActive){
    sim.ventOpen += (sim.ventTarget - sim.ventOpen) * Math.min(1, dt*3.2);
  }
}

function applyShowcase(t){
  const f = showcaseFrame(t);
  sim.hour = f.hour;
  sim.ventOpen = f.vent;

function seek(t){
  t = Math.max(0, Math.min(SHOWCASE_DURATION, t));
  const wasShowcase = sim.showcaseActive;
  sim.showcaseActive = true;
  resetSim();
  sim.showcaseActive = true;
  const step = 1 / 60;
  let remaining = t;
  while (remaining > 1e-9){
    const s = Math.min(step, remaining);
    applyShowcase(sim.time + s);
    stepSim(s);
    remaining -= s;
  }
  applyShowcase(sim.time);
  // camera
  const u = t / SHOWCASE_DURATION;
  const pos = camPosCurve.getPointAt(u);
  const tgt = camTgtCurve.getPointAt(u);
  camera.position.copy(pos);
  camera.lookAt(tgt);
  controls.target.copy(tgt);
  controls.update();
  renderFrame();
  sim.showcaseActive = wasShowcase && false; // stay in showcase mode until caller resets
  return t;
}

window.showcase = { duration: SHOWCASE_DURATION, seek };

/* ============================================================
   SKY / SUN / PALETTE — driven by hour
   ============================================================ */
const palette = {
  dayZenith:    new THREE.Color('#415f83'),
  dayHorizon:   new THREE.Color('#f7c07a'),
  dayGlow:      new THREE.Color('#ffe3a1'),
  duskZenith:   new THREE.Color('#332f58'),
  duskHorizon:  new THREE.Color('#ff7e42'),
  duskGlow:     new THREE.Color('#ffb15e'),
  nightZenith:  new THREE.Color('#04070f'),
  nightHorizon: new THREE.Color('#152a3d'),
  nightGlow:    new THREE.Color('#1c3a4d')
};
const tmpColorA = new THREE.Color(), tmpColorB = new THREE.Color();

function sunAltitudeDeg(hour){
  // sun crosses the horizon at 19.15h; well above at 17h
  return (19.15 - hour) * 10.5;
}
function updateSkyAndLights(time){
  const altDeg = sunAltitudeDeg(sim.hour);
  const altRad = THREE.MathUtils.degToRad(altDeg);
  // sun azimuth: due west-ish with a slight southward bias — sets behind skyline (-Z)
  const az = -0.24;
  sunDirWorld.set(Math.sin(az)*Math.cos(altRad), Math.sin(altRad), -Math.cos(az)*Math.cos(altRad)).normalize();

  // blend weights: 1 = full day-gold, 1 at sunset band, night beyond
  const dayW  = clamp01((altDeg - 4) / 22);                 // fades 4°..26°
  const duskW = clamp01(1 - Math.abs(altDeg - 0.5) / 6.5);   // peaks at the horizon
  const nightW = clamp01((-altDeg - 1.5) / 7.5);             // ramps after sundown

  tmpColorA.copy(palette.duskZenith).lerp(palette.dayZenith, dayW);
  tmpColorA.lerp(palette.nightZenith, nightW);
  skyUniforms.zenith.value.copy(tmpColorA);

  tmpColorB.copy(palette.duskHorizon).lerp(palette.dayHorizon, dayW);
  tmpColorB.lerp(palette.nightHorizon, nightW);
  skyUniforms.horizon.value.copy(tmpColorB);

  const glow = tmpColorA.copy(palette.duskGlow).lerp(palette.dayGlow, dayW);
  glow.lerp(palette.nightGlow, nightW);
  skyUniforms.sunGlow.value.copy(glow);

  skyUniforms.sunDir.value.copy(sunDirWorld);
  skyUniforms.nightF.value = nightW;
  skyUniforms.time.value = time;

  // fog hugs the horizon color
  scene.fog.color.copy(skyUniforms.horizon.value).multiplyScalar(1 - nightW*0.35);
  scene.fog.near = lerp(75, 55, nightW);
  scene.fog.far  = lerp(265, 215, nightW);

  // sun / moon discs + flare
  const sunDist = 520;
  sunMesh.position.copy(sunDirWorld).multiplyScalar(sunDist);
  sunMesh.lookAt(camera.position);
  const sunVisible = clamp01((altDeg + 1.5) / 3.0);
  sunMesh.material.opacity = sunVisible;
  sunMesh.visible = sunVisible > 0.02;
  sunMesh.scale.setScalar(lerp(1.6, 1.0, clamp01(altDeg/14)));  // bigger on the horizon

  flareCore.position.copy(sunMesh.position);
  flareRing.position.copy(sunMesh.position);
  streak.position.copy(sunMesh.position);
  // ghosts displaced toward screen center
  const toCenter = camera.position.clone().normalize().multiplyScalar(-30);
  flareGhost1.position.copy(sunMesh.position).addScaledVector(toCenter, 2.4);
  flareGhost2.position.copy(sunMesh.position).addScaledVector(toCenter, 4.6);
  const flareStrength = sunVisible * (0.35 + 0.65*clamp01(1 - Math.abs(altDeg)/16));
  flareCore.material.opacity  = 0.95 * flareStrength;
  flareRing.material.opacity  = 0.8  * flareStrength;
  streak.material.opacity     = 0.9  * flareStrength;
  flareGhost1.material.opacity = 0.5 * flareStrength;
  flareGhost2.material.opacity = 0.45 * flareStrength;
  flareCore.visible = flareRing.visible = streak.visible = flareGhost1.visible = flareGhost2.visible = flareStrength > 0.03;

  moonMesh.position.copy(moonDirWorld).multiplyScalar(sunDist);
  moonMesh.lookAt(camera.position);
  moonMesh.material.opacity = nightW;
  moonMesh.visible = nightW > 0.03;
  moonGlow.position.copy(moonMesh.position);
  moonGlow.material.opacity = 0.4 * nightW;
  moonGlow.visible = nightW > 0.05;

  // key light: sun by day → moon by night, one 4096 shadow map
  const sunI = clamp01(altDeg / 24) * 2.9 * clamp01((altDeg + 2.0) / 3.5);
  const moonI = nightW * 0.62;
  if (sunI >= moonI){
    sunLight.position.copy(sunDirWorld).multiplyScalar(140);
    const warm = clamp01(1 - altDeg / 20);
    sunLight.color.setRGB(1.0, lerp(0.93, 0.62, warm*warm), lerp(0.82, 0.34, warm*warm));
    sunLight.intensity = Math.max(sunI, 0.001);
  } else {
    sunLight.position.copy(moonDirWorld).multiplyScalar(140);
    sunLight.color.setHex(0x93b8e6);
    sunLight.intensity = moonI;
  }
  sunLight.target.position.set(0, 0, 0);

  // ambient hemisphere: warm bounce → cold night
  hemi.intensity = lerp(0.62, 0.30, nightW) + duskW*0.08;
  hemi.color.setRGB(lerp(1.0, 0.36, nightW), lerp(0.89, 0.48, nightW), lerp(0.72, 0.72, nightW));
  hemi.groundColor.setRGB(lerp(0.36, 0.05, nightW), lerp(0.27, 0.075, nightW), lerp(0.19, 0.12, nightW));

  // windows flare on across the skyline
  const winGlow = 0.18 + nightW * 1.6 + duskW * 0.35;
  for (const m of buildingFaceMats) m.emissiveIntensity = winGlow;
  street.material.emissiveIntensity = 0.35 + nightW * 1.1;

  // string lights: bulbs + point lights + candles
  const lightsOn = sim.lightsOn;
  const bulbI = lightsOn ? (2.35 + Math.sin(time*13.7)*0.06 + Math.sin(time*7.3+2)*0.05) : 0.06;
  bulbGlassMat.emissiveIntensity = bulbI;
  bulbGlassMat.color.setHex(lightsOn ? 0xfff6da : 0xe8e2cf);
  for (const pl of stringPointLights) pl.intensity = lightsOn ? 2.1 : 0.0;
  const candleOn = lightsOn || sim.hour > 18.15;
  candleLight.intensity = candleOn ? 1.35 + Math.sin(time*11.3)*0.22 + Math.sin(time*23.7+1.4)*0.14 : 0;
  for (const c of candleFlames){
    const flick = 0.82 + 0.28*Math.sin(time*13 + c.phase) + 0.14*Math.sin(time*29 + c.phase*2.7);
    c.sprite.material.opacity = candleOn ? flick : 0;
    c.sprite.scale.set(0.085*flick + 0.03, 0.17*flick + 0.06, 1);
    c.sprite.position.y = c.baseY + Math.sin(time*17 + c.phase)*0.006;
  }

  // sunflowers track the sun (droop gently after dark)
  for (const head of sunflowerHeads){
    if (sunMesh.visible){
      const world = new THREE.Vector3();
      head.getWorldPosition(world);
      const look = world.clone().add(sunDirWorld.clone().multiplyScalar(10));
      head.lookAt(look);
    }
  }

  // antenna beacons blink
  for (const b of blinkers){
    const bphase = (time*0.9 + b.phase) % 2.0;
    b.sprite.material.opacity = bphase < 0.18 ? 1.0 : 0.08;
  }

  // bloom: gentle by gold hour, richer in the neon night
  bloomPass.strength = 0.5 + nightW * 0.42 + (lightsOn ? 0.08 : 0);
  bloomPass.threshold = 0.78 - nightW * 0.08;
}

/* ============================================================
   RENDER FRAME
   ============================================================ */
const hourTextEl = document.getElementById('hourText');
function fmtHour(h){
  let hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  const suffix = hh >= 12 ? 'PM' : 'AM';
  let h12 = hh % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${mm.toString().padStart(2, '0')} ${suffix}`;
}

function renderFrame(){
  const t = sim.time;
  const wind = windAt(t);

  // wind sway for plants
  for (const s of swayers){
    s.obj.rotation.x = Math.sin(t*1.35 + s.phase) * s.amp * wind;
    s.obj.rotation.z = Math.cos(t*1.12 + s.phase*1.3) * s.amp * 0.8 * wind;
  }
  updateStringLights(t, wind);
  updateLaundryLine(t, wind);
  updateCat(t);

  // greenhouse vents ease toward target (interactive)
  greenhouse.ventL.rotation.x = -sim.ventOpen * 0.62;
  greenhouse.ventR.rotation.x =  sim.ventOpen * 0.62;

  // dust motes drift
  {
    const attr = moteGeo.getAttribute('position');
    for (let i=0;i<moteCount;i++){
      attr.array[i*3]   = moteBase[i*3]   + Math.sin(t*0.31 + motePhase[i]*2.1)*0.55;
      attr.array[i*3+1] = moteBase[i*3+1] + Math.sin(t*0.45 + motePhase[i])*0.35;
      attr.array[i*3+2] = moteBase[i*3+2] + Math.cos(t*0.27 + motePhase[i]*1.3)*0.55;
    }
    attr.needsUpdate = true;
    moteMat.opacity = 0.28 + 0.5*clamp01(Math.sin(t*0.5)*0.5 + 0.6) * clamp01((20.5 - sim.hour)/6);
  }

  // AC fan
  if (window.__acFan) window.__acFan.rotation.y = t * 7.5;

  updateSkyAndLights(t);

  composer.render();
  hourTextEl.textContent = fmtHour(sim.hour);

  // expose the bench
  window.__bench.hour = sim.hour;
  window.__bench.lightsOn = sim.lightsOn;
  window.__bench.bees = bees.length;
}
window.__bench = { hour: sim.hour, lightsOn: false, bees: 6 };

/* ============================================================
   INTERACTION — clicks (greenhouse vents / string lights), keys
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let downX = 0, downY = 0;

renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; // it was a drag
  pointerNDC.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects([greenhouse.hitBox, ...bulbHitMeshes], false);
  if (hits.length > 0){
    const type = hits[0].object.userData.type;
    if (type === 'greenhouse'){
      sim.ventTarget = sim.ventTarget > 0.5 ? 0 : 1;
    } else if (type === 'lights'){
      sim.lightsOn = !sim.lightsOn;
    }
  }
});

const hourSteps = [17, 18, 19, 20, 21, 22];
window.addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H'){
    // advance to the next hour step
    let idx = 0;
    for (let i=0;i<hourSteps.length;i++){ if (Math.abs(sim.hour - hourSteps[i]) < 0.5){ idx = i; break; } idx = i; }
    idx = (idx + 1) % hourSteps.length;
    sim.hour = hourSteps[idx];
    sim.autoLightsLatched = false;
  }
});

/* ============================================================
   RECORD VIDEO — plays the showcase, saves a .webm
   ============================================================ */
const recordBtn = document.getElementById('recordBtn');
let recording = false;
recordBtn.addEventListener('click', () => {
  if (recording) return;
  const stream = renderer.domElement.captureStream(60);
  const mimeCandidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  const mime = mimeCandidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  let recorder;
  try {
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 14_000_000 } : undefined);
  } catch (err) {
    alert('MediaRecorder is not available in this browser.');
    return;
  }
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rooftop-golden-hour.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recording = false;
    recordBtn.classList.remove('recording');
    recordBtn.innerHTML = '⏺&nbsp;&nbsp;Record Video';
    sim.showcaseActive = false;
    controls.enabled = true;
  };
  recording = true;
  recordBtn.classList.add('recording');
  recordBtn.textContent = '●  Recording…';
  controls.enabled = false;
  sim.showcaseActive = true;

  recorder.start(200);
  const start = performance.now();
  const tick = () => {
    const t = (performance.now() - start) / 1000;
    if (t >= SHOWCASE_DURATION){
      seek(SHOWCASE_DURATION);
      setTimeout(() => recorder.stop(), 120);
      return;
    }
    seek(t);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
});

/* ============================================================
   MAIN LOOP (interactive)
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if (ORBIT && !orbitVisible){ clock.getDelta(); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!sim.showcaseActive){
    stepSim(dt);
    // dusk auto-lights (user can override any time with a click)
    if (!sim.autoLightsLatched && sim.hour >= 19.4){
      sim.lightsOn = true;
      sim.autoLightsLatched = true;
    }
    orbitStep();
    controls.update();
    renderFrame();
  }
}
// prime one frame so the bench is live immediately
resetSim();
renderFrame();
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
