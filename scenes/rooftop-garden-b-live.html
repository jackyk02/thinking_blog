<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Rooftop Garden · Golden Hour</title>
<style>
  :root{ --gold:#e8b96a; --ink:#0b0e18; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#05070d; font-family: "Avenir Next","Segoe UI",Helvetica,Arial,sans-serif; }
  canvas{ display:block; }
  #hud{
    position:fixed; left:18px; top:16px; z-index:10; pointer-events:none;
    color:#f3e6cf; text-shadow:0 2px 14px rgba(0,0,0,.75);
  }
  #hud h1{ font-size:17px; letter-spacing:.24em; font-weight:600; color:var(--gold); text-transform:uppercase; }
  #hud p{ font-size:11px; letter-spacing:.08em; opacity:.82; margin-top:4px; }
  #hints{
    position:fixed; left:18px; bottom:16px; z-index:10; pointer-events:none;
    color:#d9cbb2; font-size:11px; letter-spacing:.06em; line-height:1.85;
    background:rgba(8,10,20,.45); border:1px solid rgba(232,185,106,.28);
    padding:8px 14px; border-radius:10px; backdrop-filter: blur(6px);
  }
  #hints b{ color:var(--gold); font-weight:600; }
  #recordBtn{
    position:fixed; right:18px; top:16px; z-index:11; cursor:pointer;
    color:#0d0a05; background:linear-gradient(180deg,#f4cd8a,#dfa452);
    border:1px solid #8a6a35; border-radius:10px; padding:10px 18px;
    font-size:12px; letter-spacing:.14em; font-weight:700; text-transform:uppercase;
    box-shadow:0 4px 18px rgba(0,0,0,.5), inset 0 1px 0 #fff8;
    transition: transform .15s, filter .15s;
  }
  #recordBtn:hover{ transform:translateY(-1px); filter:brightness(1.08); }
  #recordBtn:disabled{ opacity:.65; cursor:default; transform:none; }
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    z-index:10; pointer-events:none; opacity:0; transition:opacity .3s, transform .3s;
    color:#ffe9bb; background:rgba(10,12,24,.72); border:1px solid rgba(232,185,106,.4);
    padding:7px 16px; border-radius:20px; font-size:11px; letter-spacing:.12em;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  /* blog full-screen view: the scene only */
  #hud,#hints,#recordBtn,#toast{display:none!important}
</style>

  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>

  <h1>Rooftop Garden</h1>
  <p>golden hour over the avenue · 12th floor</p>
</div>
<div id="hints">
  <b>Drag</b> orbit &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>H</b> advance the hour &nbsp;·&nbsp;

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================ helpers */
const DEG = Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ssn=x=>{ x=clamp(x,0,1); return x*x*(3-2*x); };
const ssR=(a,b,x)=>ssn((x-a)/(b-a));
const fract=x=>x-Math.floor(x);
let _seed=987654321;
const rand=()=>{ _seed=(_seed*16807)%2147483647; return (_seed-1)/2147483646; };
const rrange=(a,b)=>a+rand()*(b-a);

function makeCanvas(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function speckle(g,w,h,n,alpha,lo,hi){
  for(let i=0;i<n;i++){
    const v=lo+Math.random()*(hi-lo);
    g.fillStyle=`rgba(${v},${v},${v},${alpha})`;
    g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2.5,1+Math.random()*2.5);
  }
}

/* ============================================================ textures */
const gravelTex = makeCanvas(512,512,(g,w,h)=>{
  g.fillStyle='#6e6960'; g.fillRect(0,0,w,h); speckle(g,w,h,5200,.5,60,150); speckle(g,w,h,900,.35,20,70);
  g.strokeStyle='rgba(40,38,34,.5)'; g.lineWidth=2;
  for(let i=0;i<7;i++){ g.beginPath(); const x=Math.random()*w,y=Math.random()*h; g.moveTo(x,y); g.lineTo(x+(Math.random()-.5)*220,y+(Math.random()-.5)*220); g.stroke(); }
});
gravelTex.repeat.set(6,4);

const soilTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#5c4630'; g.fillRect(0,0,w,h); speckle(g,w,h,2600,.6,40,140); speckle(g,w,h,500,.4,15,55);
});

const woodTex = makeCanvas(128,256,(g,w,h)=>{
  g.fillStyle='#7a5a3c'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=32){
    g.fillStyle=`rgba(${90+Math.random()*40|0},${62+Math.random()*26|0},${38+Math.random()*18|0},.55)`;
    g.fillRect(0,y,w,30);
    g.fillStyle='#46311f'; g.fillRect(0,y+30,w,2.5);
    g.strokeStyle='rgba(60,42,26,.6)';
    for(let i=0;i<5;i++){ g.beginPath(); const yy=y+5+Math.random()*22; g.moveTo(0,yy); g.bezierCurveTo(w*.3,yy+3,w*.7,yy-3,w,yy); g.stroke(); }
  }
});

const brickTex = makeCanvas(128,128,(g,w,h)=>{
  g.fillStyle='#b9a88f'; g.fillRect(0,0,w,h);
  const bh=16, bw=32;
  for(let row=0;row<h/bh;row++){
    const off=(row%2)*bw/2;
    for(let col=-1;col<w/bw+1;col++){
      g.fillStyle=`rgb(${125+Math.random()*35|0},${62+Math.random()*20|0},${42+Math.random()*14|0})`;
      g.fillRect(col*bw+off+1.5,row*bh+1.5,bw-3,bh-3);
    }
  }
  speckle(g,w,h,600,.25,30,90);
});

const tankPlankTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#6d5942'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=20){
    g.fillStyle=`rgba(${95+Math.random()*40|0},${74+Math.random()*28|0},${50+Math.random()*20|0},.7)`;
    g.fillRect(x,0,18,h); g.fillStyle='#3d2f20'; g.fillRect(x+18,0,2.4,h);
  }
  g.fillStyle='rgba(40,32,22,.85)'; [46,128,210].forEach(y=>g.fillRect(0,y,w,7));
});

const stuccoTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#b3aa99'; g.fillRect(0,0,w,h); speckle(g,w,h,3000,.28,90,210);
  g.fillStyle='rgba(120,112,98,.4)'; g.fillRect(0,h-26,w,26);
});

const clothTextures = [
  makeCanvas(128,160,(g,w,h)=>{ // gingham
    g.fillStyle='#f3ede0'; g.fillRect(0,0,w,h);
    g.fillStyle='rgba(178,52,44,.55)';
    for(let x=0;x<w;x+=28) g.fillRect(x,0,12,h);
    for(let y=0;y<h;y+=28) g.fillRect(0,y,w,12);
  }),
  makeCanvas(128,160,(g,w,h)=>{ // teal stripe
    g.fillStyle='#e9e4d6'; g.fillRect(0,0,w,h);
    g.fillStyle='#2e6f6a';
    for(let x=8;x<w;x+=34) g.fillRect(x,0,15,h);
    g.fillStyle='#c8b06a'; for(let x=23;x<w;x+=34) g.fillRect(x,0,3,h);
  }),
  makeCanvas(128,160,(g,w,h)=>{ // mustard floral
    g.fillStyle='#d9a944'; g.fillRect(0,0,w,h);
    for(let i=0;i<26;i++){
      const x=Math.random()*w,y=Math.random()*h;
      g.fillStyle='#f5e7c8'; for(let p=0;p<6;p++){ const a=p/6*6.283; g.beginPath(); g.ellipse(x+Math.cos(a)*7,y+Math.sin(a)*7,4.6,2.6,a,0,6.283); g.fill(); }
      g.fillStyle='#7a4a2a'; g.beginPath(); g.arc(x,y,3.4,0,6.283); g.fill();
    }
  })
];

const sunflowerTex = makeCanvas(256,256,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  for(let i=0;i<22;i++){
    const a=i/22*Math.PI*2;
    g.save(); g.translate(cx,cy); g.rotate(a);
    const grad=g.createLinearGradient(0,-40,0,-118);
    grad.addColorStop(0,'#e08a1e'); grad.addColorStop(.55,'#f4b93c'); grad.addColorStop(1,'#ffd95e');
    g.fillStyle=grad; g.beginPath(); g.ellipse(0,-78,17,46,0,0,6.283); g.fill(); g.restore();
  }
  const cg=g.createRadialGradient(cx-12,cy-12,6,cx,cy,52);
  cg.addColorStop(0,'#6b4a22'); cg.addColorStop(1,'#2e1f0e');
  g.fillStyle=cg; g.beginPath(); g.arc(cx,cy,50,0,6.283); g.fill();
  g.fillStyle='rgba(255,220,140,.5)';
  for(let i=0;i<240;i++){ const a=Math.random()*6.283, r=Math.pow(Math.random(),.6)*44; g.fillRect(cx+Math.cos(a)*r, cy+Math.sin(a)*r, 1.6,1.6); }
});

const leafTex = makeCanvas(128,128,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  const greens=['#3e6b2f','#4e7d38','#5f9044','#2f5524','#6fa050'];
  for(let i=0;i<22;i++){
    const x=Math.random()*w,y=Math.random()*h,a=Math.random()*6.283,l=10+Math.random()*20;
    g.save(); g.translate(x,y); g.rotate(a);
    g.fillStyle=greens[(Math.random()*greens.length)|0];
    g.beginPath(); g.ellipse(0,0,l,l*.42,0,0,6.283); g.fill();
    g.strokeStyle='rgba(20,40,15,.6)'; g.beginPath(); g.moveTo(-l,0); g.lineTo(l,0); g.stroke();
    g.restore();
  }
});

const glowTex = makeCanvas(128,128,(g,w,h)=>{
  const r=g.createRadialGradient(64,64,2,64,64,62);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.25,'rgba(255,240,205,.85)');
  r.addColorStop(.6,'rgba(255,220,150,.28)'); r.addColorStop(1,'rgba(255,210,130,0)');
  g.fillStyle=r; g.fillRect(0,0,w,h);
});

const cloudTex = makeCanvas(256,128,(g,w,h)=>{
  g.clearRect(0,0,w,h); g.filter='blur(6px)';
  const blobs=[[70,78,44,20],[120,62,52,24],[180,80,40,18],[120,86,90,16]];
  g.fillStyle='rgba(255,255,255,.92)';
  blobs.forEach(([x,y,rx,ry])=>{ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,6.283); g.fill(); });
});

const streakTex = makeCanvas(512,64,(g,w,h)=>{
  g.fillStyle='#000'; g.fillRect(0,0,w,h);
  for(let i=0;i<46;i++){ // taillights red / headlights warm-white
    g.fillStyle = Math.random()<.5 ? '#ff5a3c' : '#ffe9b0';
    g.shadowColor=g.fillStyle; g.shadowBlur=9;
    g.beginPath(); g.arc(Math.random()*w, 16+Math.random()*10, 3+Math.random()*2.6, 0, 6.283); g.fill();
    g.fillStyle = Math.random()<.5 ? '#ff4030' : '#fff3d0';
    g.shadowColor=g.fillStyle;
    g.beginPath(); g.arc(Math.random()*w, 40+Math.random()*9, 2.6+Math.random()*2.2, 0, 6.283); g.fill();
  }
});

function facadeTextures(base, litRatio){
  const seedBase=Math.random()*1000;
  const map = makeCanvas(256,512,(g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h); speckle(g,w,h,1500,.18,60,180);
    g.fillStyle='rgba(0,0,0,.28)'; g.fillRect(0,h-34,w,34);
    const cols=5, rows=13, cw=w/cols, rh=(h-40)/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=c*cw+9, y=r*rh+9, ww=cw-18, hh=rh-16;
      g.fillStyle='#161b23'; g.fillRect(x-2,y-2,ww+4,hh+4);
      const grd=g.createLinearGradient(x,y,x,y+hh);
      grd.addColorStop(0,'#39434f'); grd.addColorStop(.5,'#232b35'); grd.addColorStop(1,'#171d26');
      g.fillStyle=grd; g.fillRect(x,y,ww,hh);
      if(Math.sin(seedBase+r*12.9+c*7.7)>.35){ g.fillStyle='rgba(200,215,225,.16)'; g.fillRect(x,y,ww,hh*.4); }
    }
  });
  const emissive = makeCanvas(256,512,(g,w,h)=>{
    g.fillStyle='#000'; g.fillRect(0,0,w,h);
    const cols=5, rows=13, cw=w/cols, rh=(h-40)/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const s=Math.sin(seedBase*1.7+r*12.9+c*7.7)*43758.5453; const f=s-Math.floor(s);
      if(f<litRatio){
        const warm=Math.sin(seedBase+r*3.1+c*9.4)>-.25;
        g.fillStyle= warm? `rgba(255,${190+((f*200)|0)%50},120,1)` : '#cfe4ff';
        g.globalAlpha=.55+f*.45;
        g.fillRect(c*cw+9, r*rh+9, cw-18, rh-16); g.globalAlpha=1;
      }
    }
  });
  return {map, emissive};
}

function neonTex(text,color){
  return makeCanvas(256,128,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    g.textAlign='center'; g.textBaseline='middle';
    g.font='700 54px "Arial Black",Arial,sans-serif';
    g.shadowColor=color; g.shadowBlur=22; g.strokeStyle=color; g.lineWidth=5;
    for(let i=0;i<3;i++) g.strokeText(text,w/2,h/2);
    g.shadowBlur=6; g.fillStyle='#ffffff'; g.globalAlpha=.9; g.fillText(text,w/2,h/2);
  });
}

/* ============================================================ renderer / scene */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf0b478, 150, 480);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 900);
camera.position.set(14.5, 6.6, 16.2);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, -0.5);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 3.5; controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI*0.495; controls.minPolarAngle = 0.18;
controls.update();

/* ---------- blog embed (?orbit=1): both rooftop gardens circle their roof from the same angle, in step ----------
   The angle comes from the wall clock, so the two pages stay together without talking to each other; dragging one
   (mouse or trackpad) turns both, through a BroadcastChannel. The hour is left at the scene's afternoon default. */
const ORBIT = new URLSearchParams(location.search).get('orbit') ? { dist: 26, elev: 0.38, period: 50, off: 0 } : null;
let orbitVisible = true;
if (ORBIT){
  camera.fov = 46; camera.updateProjectionMatrix();
  controls.enabled = false; controls.enableDamping = false;
  const ch = 'BroadcastChannel' in window ? new BroadcastChannel('rooftop-orbit') : null;
  if (ch) ch.onmessage = e => { if (typeof e.data === 'number') ORBIT.off = e.data; };
  const el = renderer.domElement; let drag = null;
  if (matchMedia('(hover: hover) and (pointer: fine)').matches){
    el.style.cursor = 'grab';
    el.addEventListener('pointerdown', e => { drag = { x: e.clientX, off: ORBIT.off }; el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', e => { if (!drag) return; ORBIT.off = drag.off - (e.clientX - drag.x) * 0.008; if (ch) ch.postMessage(ORBIT.off); });
    const end = () => { drag = null; el.style.cursor = 'grab'; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  } else el.style.pointerEvents = 'none';
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { orbitVisible = es[0].isIntersecting; }).observe(document.documentElement);
}
function orbitStep(){
  if (!ORBIT) return;
  // ?a0=<radians> sets the first view; ?t0=<ms> (set by the page for both scenes) starts the circle there; ?still=1 holds it
  const q = orbitStep.q || (orbitStep.q = new URLSearchParams(location.search));
  const a0 = q.get('a0') !== null ? +q.get('a0') : 0.75;
  const turn = q.get('still') ? 0 : q.get('t0') ? (Date.now() - +q.get('t0')) / 1000 / ORBIT.period : (Date.now() / 1000 % ORBIT.period) / ORBIT.period;
  const a = a0 + ORBIT.off + turn * Math.PI * 2;
  const r = ORBIT.dist * Math.cos(ORBIT.elev);
  camera.position.set(Math.sin(a) * r, 1.2 + ORBIT.dist * Math.sin(ORBIT.elev), Math.cos(a) * r);
  controls.target.set(0, 1.2, 0); camera.lookAt(0, 1.2, 0);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.38, 0.75, 0.78);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* lights */
const hemi = new THREE.HemisphereLight(0xbfd6e8, 0x8a6a4f, 0.85);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffe7c0, 2.6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(4096, 4096);
keyLight.shadow.camera.left=-36; keyLight.shadow.camera.right=36;
keyLight.shadow.camera.top=36;  keyLight.shadow.camera.bottom=-36;
keyLight.shadow.camera.near=20; keyLight.shadow.camera.far=420;
keyLight.shadow.bias=-0.00045; keyLight.shadow.normalBias=0.02; keyLight.shadow.radius=4;
scene.add(keyLight); scene.add(keyLight.target);
const fillLight = new THREE.DirectionalLight(0x88a2c8, 0.35); fillLight.position.set(30,40,50); scene.add(fillLight);

/* ============================================================ sky */
const skyUniforms = {
  topColor:{value:new THREE.Color('#5f87b3')},
  horizonColor:{value:new THREE.Color('#f6bd6f')},
  sunDir:{value:new THREE.Vector3(0,1,0)},
  sunColor:{value:new THREE.Color('#fff3d8')},
  sunVis:{value:1.0},
  nightF:{value:0.0}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(640, 40, 24),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:skyUniforms,
    vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 topColor, horizonColor, sunColor, sunDir; uniform float sunVis, nightF;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y*1.55+0.10, 0.0, 1.0);
        vec3 col = mix(horizonColor, topColor, pow(h, 0.62));
        if(d.y < 0.0) col = mix(horizonColor, horizonColor*0.16, clamp(-d.y*3.2,0.0,1.0));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += sunColor * (pow(s, 900.0)*3.0 + pow(s, 22.0)*0.42 + pow(s, 4.5)*0.16) * sunVis;
        col += vec3(0.28,0.10,0.32)*pow(max(dot(d,normalize(vec3(sunDir.x,0.05,sunDir.z))),0.0),5.0)*nightF*0.35;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(sky);

/* stars */
const starGeo = new THREE.BufferGeometry();
{ const pts=[]; for(let i=0;i<520;i++){ const a=Math.random()*Math.PI*2, e=Math.pow(Math.random(),.62)*1.25+0.08, r=600;
  pts.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r); }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3)); }
const starMat = new THREE.PointsMaterial({ color:0xcdd8ff, size:1.9, sizeAttenuation:false, transparent:true, opacity:0, fog:false, depthWrite:false });
scene.add(new THREE.Points(starGeo, starMat));

/* sun flare sprites */
const flareMat = new THREE.SpriteMaterial({ map:glowTex, color:0xfff0c8, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false, fog:false });
const flare = new THREE.Sprite(flareMat); flare.scale.set(230,230,1); scene.add(flare);
const flareCore = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:0xffffff, transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false, fog:false }));
flareCore.scale.set(70,70,1); scene.add(flareCore);

/* clouds */
const clouds=[];

function buildingMat(set, rx, ry){
  const m = set.map.clone(); m.needsUpdate=true; m.repeat.set(rx,ry);
  const e = set.emissive.clone(); e.needsUpdate=true; e.repeat.set(rx,ry);
  const mat = new THREE.MeshStandardMaterial({ map:m, emissiveMap:e, emissive:0xffffff, emissiveIntensity:0, roughness:.9, metalness:.05 });

}

function raisedBed(cx,cz,w,d,soilY=0.44){
  const g=new THREE.Group(); g.position.set(cx,0,cz);
  const h=.46, t=.09;
  const mk=(bw,bd,x,z)=>{ const p=new THREE.Mesh(new THREE.BoxGeometry(bw,h,bd), bedWood); p.position.set(x,h/2,z); g.add(p); };
  mk(w,t, 0,-d/2+t/2); mk(w,t, 0,d/2-t/2); mk(t,d-2*t, -w/2+t/2,0); mk(t,d-2*t, w/2-t/2,0);
  const soil=new THREE.Mesh(new THREE.BoxGeometry(w-.14,.1,d-.14), soilMat);
  soil.position.y=soilY-.06; soil.receiveShadow=true; g.add(soil);
  /* little corner posts */
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{ const post=new THREE.Mesh(new THREE.BoxGeometry(.14,.6,.14), bedWood); post.position.set(sx*(w/2-.05),.3,sz*(d/2-.05)); g.add(post); });
  shadowify(g); roofGroup.add(g);
  g.updateMatrixWorld(true);
  return { group:g, cx, cz, w, d, soilY };
}

    leaf.position.set(i? .14 : -.14, h*(.38+i*.28), 0); leaf.rotation.set(.4, i?.6:-.6, i?.5:-.5); g.add(leaf);

{
  const frameMat=new THREE.MeshStandardMaterial({ color:0xe9e5d8, roughness:.55, metalness:.25 });
  const glassMat=new THREE.MeshStandardMaterial({ color:0xd8eef4, transparent:true, opacity:.34, roughness:.06, metalness:.15, side:THREE.DoubleSide, depthWrite:false });
  const W=4.6, D=3.1, wallH=1.5, ridgeH=2.32;
  /* curb */
  const curb=new THREE.Mesh(new THREE.BoxGeometry(W,.28,D), new THREE.MeshStandardMaterial({ color:0x8b8478, roughness:.8 })); curb.position.y=.14; greenhouse.add(curb);
  /* corner posts + ridge posts */
  const px=W/2, pz=D/2;
  [[-px,-pz],[px,-pz],[-px,pz],[px,pz]].forEach(([x,z])=>{ const p=new THREE.Mesh(new THREE.BoxGeometry(.11,wallH,.11), frameMat); p.position.set(x,wallH/2+.26,z); greenhouse.add(p); });
  [-px,px].forEach(x=>{ const p=new THREE.Mesh(new THREE.BoxGeometry(.1,ridgeH-wallH,.1), frameMat); p.position.set(x,(ridgeH+wallH)/2+.26,0); greenhouse.add(p); });
  /* wall panels: glass + frames */
  const mkPanel=(w,h,x,y,z,ry)=>{ const glass=new THREE.Mesh(new THREE.PlaneGeometry(w,h), glassMat); glass.position.set(x,y,z); glass.rotation.y=ry; greenhouse.add(glass); };
  mkPanel(W-.15, wallH-.3, 0, wallH/2+.26, pz, 0); mkPanel(W-.15, wallH-.3, 0, wallH/2+.26, -pz, Math.PI);
  mkPanel(D-.15, wallH-.3, px, wallH/2+.26, 0, Math.PI/2); mkPanel(D-.15, wallH-.3, -px, wallH/2+.26, 0, -Math.PI/2);
  /* frame rails */
  [-pz,pz].forEach(z=>{ [.5,1.05].forEach(y=>{ const r=new THREE.Mesh(new THREE.BoxGeometry(W,.08,.08), frameMat); r.position.set(0,y+.26,z); greenhouse.add(r); }); });
  [-px,px].forEach(x=>{ [.5,1.05].forEach(y=>{ const r=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,D), frameMat); r.position.set(x,y+.26,0); greenhouse.add(r); }); });
  /* gable ends (triangle glass) */
  const triShape=new THREE.Shape([new THREE.Vector2(-pz,0), new THREE.Vector2(pz,0), new THREE.Vector2(0,ridgeH-wallH)]);
  const triGeo=new THREE.ShapeGeometry(triShape);
  [px,-px].forEach((x,idx)=>{ const tri=new THREE.Mesh(triGeo, glassMat); tri.position.set(x, wallH+.26, 0); tri.rotation.y=idx? -Math.PI/2 : Math.PI/2; greenhouse.add(tri); });
  /* roof slopes: each slope split into fixed panel + hinged vent near ridge */
  const slopeLen=Math.hypot(pz, ridgeH-wallH);
  const slopeAngle=Math.atan2(ridgeH-wallH, pz);
  function roofSide(sign){ // sign=+1 front (z+), -1 back
    const pivotFix=new THREE.Group(); greenhouse.add(pivotFix);
    /* fixed lower portion */

const CAT_RECT={ hw:ROOF_W/2+.175, hd:ROOF_D/2+.175 };
function catPoseAt(s){
  const W=CAT_RECT.hw*2, D=CAT_RECT.hd*2, P=2*(W+D);
  s=((s%P)+P)%P;
  let x,z,yaw;
  if(s<W){ x=-CAT_RECT.hw+s; z=CAT_RECT.hd; yaw=Math.PI/2; }
  else if(s<W+D){ x=CAT_RECT.hw; z=CAT_RECT.hd-(s-W); yaw=Math.PI; }
  else if(s<2*W+D){ x=CAT_RECT.hw-(s-W-D); z=-CAT_RECT.hd; yaw=-Math.PI/2; }
  else { x=-CAT_RECT.hw; z=-CAT_RECT.hd+(s-2*W-D); yaw=0; }
  return {x,z,yaw};
}

      emitters.push(new THREE.Vector3(x,.27,bed.cz+bed.d/2+.06));

const DROP_N=emitters.length*2;
const dropMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.017,6,5), new THREE.MeshBasicMaterial({ color:0xcfe6ff, transparent:true, opacity:.92 }), DROP_N);
dropMesh.castShadow=false; scene.add(dropMesh);
function wetnessAt(T){
  const tau=T%75;
  if(tau<4.2) return 0.14+0.76*ssn(tau/4.2);
  if(tau<11)  return 0.90-0.12*((tau-4.2)/6.8);
  return Math.max(0.14, 0.78*Math.exp(-(tau-11)*0.09)+0.14);
}
function updateIrrigation(T){
  const tau=T%75, on=tau<4.6;
  dropMesh.visible=on;
  if(on){
    let di=0;
    for(let i=0;i<emitters.length;i++){
      for(let k=0;k<2;k++){
        const ph=fract(T*1.15 + i*.618 + k*.5);
        _p.copy(emitters[i]); _p.y -= ph*ph*.30;
        const s=.55+.75*ph; _s.set(s,s*1.5,s);
        _m4.compose(_p,_q,_s); dropMesh.setMatrixAt(di++,_m4);
      }
    }
    _s.set(1,1,1);
    dropMesh.instanceMatrix.needsUpdate=true;
  }
  const w=wetnessAt(T);
  soilMat.color.setRGB(lerp(1,.42,w), lerp(1,.36,w), lerp(1,.30,w));
  soilMat.roughness=lerp(.96,.34,w);
  soilMat.metalness=lerp(0,.12,w);
}

/* ============================================================ environment / hour */
const cLateTop=new THREE.Color('#5f87b3'), cSunTop=new THREE.Color('#343d66'), cNightTop=new THREE.Color('#03081a');
const cLateHor=new THREE.Color('#f6bd6f'), cSunHor=new THREE.Color('#ff7a3c'), cNightHor=new THREE.Color('#101f3f');
const cLateSun=new THREE.Color('#fff3d8'), cSunSun=new THREE.Color('#ffc06a');
const tmpA=new THREE.Color(), tmpB=new THREE.Color();
const moonPos=new THREE.Vector3(60,150,90);
const sunPos=new THREE.Vector3();
function applyHour(h){
  const sunA=ssR(17.5,18.65,h), night=ssR(18.75,20.05,h);
  /* sky colors */
  tmpA.copy(cLateTop).lerp(cSunTop, sunA).lerp(cNightTop, night); skyUniforms.topColor.value.copy(tmpA);
  tmpB.copy(cLateHor).lerp(cSunHor, ssR(17.6,18.8,h)).lerp(cNightHor, night); skyUniforms.horizonColor.value.copy(tmpB);
  skyUniforms.nightF.value=night;
  starMat.opacity=night*.95;
  scene.fog.color.copy(tmpB);
  scene.fog.near=lerp(150,95,night); scene.fog.far=lerp(480,380,night);
  /* sun position */
  const az=THREE.MathUtils.degToRad(lerp(238,266,ssR(17.3,19.15,h)));
  const el=THREE.MathUtils.degToRad(lerp(15.5,-5.5,ssR(17.3,19.15,h)));
  sunPos.set(Math.cos(el)*Math.cos(az)*400, Math.sin(el)*400, Math.cos(el)*Math.sin(az)*400);
  skyUniforms.sunDir.value.copy(sunPos).normalize();
  skyUniforms.sunColor.value.copy(cLateSun).lerp(cSunSun, sunA);
  const sunUp=clamp(Math.sin(el)*7+0.55,0,1)*(1-night);
  skyUniforms.sunVis.value=sunUp;
  /* key light: sun → moon */
  if(el>0.5*DEG){
    keyLight.position.copy(sunPos).multiplyScalar(.45).add(new THREE.Vector3(0,0,0));
    keyLight.position.set(sunPos.x*.45, Math.max(sunPos.y*.45,6), sunPos.z*.45);
    keyLight.color.copy(cLateSun).lerp(new THREE.Color('#ff9e58'), sunA);
    keyLight.intensity=lerp(2.75,1.35,ssR(17.4,18.95,h));
  } else {
    keyLight.position.copy(moonPos);
    keyLight.color.set('#a9c4ff');
    keyLight.intensity=lerp(0.15,.62,night);
  }
  keyLight.target.position.set(0,0,0);
  /* hemi + fill */
  hemi.color.set('#bfd6e8').lerp(new THREE.Color('#d9a06a'), sunA).lerp(new THREE.Color('#24305a'), night);
  hemi.groundColor.set('#8a6a4f').lerp(new THREE.Color('#0c1018'), night);
  hemi.intensity=lerp(.85,.52,night);
  fillLight.intensity=lerp(.35,.12,night);
  /* flare */
  flare.position.copy(sunPos).normalize().multiplyScalar(560);
  flareCore.position.copy(flare.position);
  flareMat.opacity=sunUp*.95; flareCore.material.opacity=sunUp;
  flare.scale.setScalar(210+ (1-sunUp)*40);
  /* windows & neon & avenues & bloom */
  const lit=ssR(17.95,19.35,h);
  buildingMats.forEach(m=>m.emissiveIntensity=.06+lit*1.35);
  neonMats.forEach(m=>m.emissiveIntensity=.25+lit*2.6);
  scene.userData.avenueMat.opacity=lit*.95;
  bloomPass.strength=.3+night*.62+lit*.18;
  /* clouds */
  clouds.forEach(c=>{ c.material.color.copy(tmpA.set('#ffffff').lerp(new THREE.Color('#ffb08a'),sunA).lerp(new THREE.Color('#2c3757'),night)); c.material.opacity=lerp(.85,.32,night); });
  return {night, lit};
}

/* ============================================================ state + interaction */
const hourPresets=[17.4,18.05,18.6,19.05,19.6,20.3,21.1,21.75];
let hourIndex=0;
let userHour=hourPresets[0];
let userLights=null;             // null → auto
let greenhouseVentUser=false;
let ventUserAngle=0;
const toastEl=document.getElementById('toast');
let toastTimer=0;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); toastTimer=2.4; }
const fmtHour=h=>{ const hh=Math.floor(h), mm=Math.floor((h-hh)*60); return `${hh}:${String(mm).padStart(2,'0')}`; };

addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){ hourIndex=(hourIndex+1)%hourPresets.length; userHour=hourPresets[hourIndex]; toast(`Hour → ${fmtHour(userHour)}`); }
});

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let downX=0, downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{ downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return;
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const ghHit=raycaster.intersectObject(greenhouse,true);
  if(ghHit.length){ greenhouseVentUser=!greenhouseVentUser; greenhouseVentUser?toast('Greenhouse vents open'):toast('Greenhouse vents closed'); return; }
  const lightHit=raycaster.intersectObjects([lightsHit, bulbMesh],false);
  if(lightHit.length){ const current=userLights!==null?userLights:(userHour>=19.1); userLights=!current; toast(userLights?'String lights on — early evening magic':'String lights off'); }
});

/* ============================================================ frame update */
const bench={ hour:userHour, lightsOn:false, bees:BEE_COUNT };
window.__bench=bench;

const wingFlapDummy=0;
function updateScene(T, opts){
  opts=opts||{};
  const h=opts.hour!==undefined?opts.hour:userHour;
  const env=applyHour(h);
  const night=env.night;
  /* wind — analytic, deterministic */
  const wind=clamp(0.62 + 0.42*Math.sin(T*0.53+1.2) + 0.28*Math.sin(T*1.33+0.4) + 0.17*Math.sin(T*3.1+2.1), 0.14, 1.3);
  /* plants sway */
  for(const s of sway){ s.obj.rotation[s.axis]=Math.sin(T*s.freq+s.phase)*s.amp*wind; }
  sunflowerHeads.forEach((hd,i)=>{ hd.rotation.y=Math.sin(T*.9+i)* .18*wind; });
  /* cloth */
  updateCloths(T, wind);
  /* string lights */
  const lightsOn = opts.lightsOn!==undefined ? opts.lightsOn : (userLights!==null?userLights:(h>=19.1));
  updateStringLights(T, wind);
  bulbMat.emissiveIntensity = lightsOn ? 2.6 : .12;
  const bulbGlow = lightsOn ? 1 : 0;
  /* drip irrigation */
  updateIrrigation(T);
  /* bees — sleep after dusk */
  const beesActive = h<19.35;
  bees.forEach(b=>b.g.visible=beesActive);
  if(beesActive) updateBees(T);
  /* cat */
  updateCat(T);
  /* vents */
  let ventOpen;
  if(opts.ventOpen!==undefined) ventOpen=opts.ventOpen;
  else { ventTarget=greenhouseVentUser?1:0; ventUserAngle+=(ventTarget-ventUserAngle)*Math.min(1,0.06); ventOpen=ventUserAngle; }
  ventAngle=ventOpen*0.72;
  vents.forEach(({pivot,sign})=>{ pivot.rotation.x = sign*ventAngle; });
  /* interior light + candle flicker */
  greenhouseLight.intensity = night*2.4 + ventOpen*.6;
  candleLight.intensity = .4 + night*1.7 + Math.sin(T*13.7)*.18 + Math.sin(T*29.3+1.7)*.1;
  flames.forEach((f,i)=>{ const s=1+Math.sin(T*13+i*2.2)*.2+Math.sin(T*27+i*1.3)*.1; f.scale.set(.15*s,.23*(1+night*.25)*s,1); });
  /* beacons blink */
  const blink=(Math.sin(T*2.7)>0.62)?3.2:.12;
  beaconMats.forEach(m=>m.emissiveIntensity=blink);
  /* clouds drift */
  clouds.forEach(c=>{ c.position.x=c.userData.baseX + Math.sin(T*.05*c.userData.drift)*8 + T*c.userData.drift*.35; });
  /* toast timers (interactive only) */
  if(toastTimer>0){ toastTimer-=1/60; if(toastTimer<=0) toastEl.classList.remove('show'); }
  const tau=T%75;
  if(tau<4.6 && opts.lightsOn===undefined && Math.floor(T*2)%6===0){ /* keep quiet, toast used elsewhere */ }
  /* bench */
  bench.hour=h; bench.lightsOn=lightsOn; bench.bees=beesActive?BEE_COUNT:0;
}

function renderFrame(T, opts){
  updateScene(T, opts);
  composer.render();
}

/* ============================================================ showcase */
const SHOWCASE_DURATION=12;
const camKeys=[
  {t:0.0,  p:[15.5, 6.9, 17.6], l:[ 0.0, 1.1, -0.6]},
  {t:1.7,  p:[ 9.2, 3.7, 10.4], l:[-4.2, 1.6,  3.1]},
  {t:3.1,  p:[ 2.6, 2.0,  7.9], l:[-8.2, 1.5,  4.3]},
  {t:4.4,  p:[-4.6, 2.7,  9.0], l:[-12.9,2.2,  3.3]},
  {t:5.5,  p:[-6.9, 3.3,  5.4], l:[-12.9,2.3,  4.6]},
  {t:6.7,  p:[-5.2, 3.9,  1.2], l:[ -3.0, 9.5,-300.0]},
  {t:8.1,  p:[ 2.6, 2.4,  4.6], l:[ 9.4, 1.7, -2.4]},
  {t:9.5,  p:[ 6.6, 2.1,  1.9], l:[ 9.4, 2.0, -2.4]},
  {t:10.7, p:[12.6, 5.4,  9.6], l:[ 0.5, 1.3, -0.8]},
  {t:12.0, p:[16.1, 7.7, 17.4], l:[ 0.0, 1.0, -0.7]}
];
const _v0=new THREE.Vector3(), _v1=new THREE.Vector3();
function sampleKeys(keys, t, pi, li){
  if(t<=keys[0].t){ pi.fromArray(keys[0].p); li.fromArray(keys[0].l); return; }
  if(t>=keys[keys.length-1].t){ const k=keys[keys.length-1]; pi.fromArray(k.p); li.fromArray(k.l); return; }
  for(let i=0;i<keys.length-1;i++){
    const a=keys[i], b=keys[i+1];
    if(t>=a.t && t<=b.t){
      const u=ssn((t-a.t)/(b.t-a.t));
      pi.fromArray(a.p).lerp(_v0.fromArray(b.p), u);
      li.fromArray(a.l).lerp(_v1.fromArray(b.l), u);
      return;
    }
  }
}
const showPos=new THREE.Vector3(), showLook=new THREE.Vector3();
function showcaseFrame(t){
  t=clamp(t,0,SHOWCASE_DURATION);
  const h=17.3 + (21.75-17.3)*(t/SHOWCASE_DURATION);
  const lightsOn=t>6.95;
  const ventOpen=ssn(clamp((t-8.15)/1.25,0,1));
  sampleKeys(camKeys,t,showPos,showLook);
  camera.position.copy(showPos);
  camera.lookAt(showLook);
  renderFrame(t,{ hour:h, lightsOn:lightsOn, ventOpen:ventOpen });
  controls.target.copy(showLook);
}
window.showcase={ duration:SHOWCASE_DURATION, seek(t){ showcaseFrame(t); } };

/* record button */
const recordBtn=document.getElementById('recordBtn');
let recording=false;
recordBtn.addEventListener('click',()=>{
  if(recording) return;
  recording=true;
  const savedPos=camera.position.clone(), savedTarget=controls.target.clone();
  const savedUserLights=userLights, savedGreenUser=greenhouseVentUser;
  recordBtn.disabled=true; recordBtn.textContent='● Recording 0.0s';
  const stream=renderer.domElement.captureStream(60);
  let mime='video/webm;codecs=vp9'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
  const rec=new MediaRecorder(stream,{ mimeType:mime, videoBitsPerSecond:12_000_000 });
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='rooftop-garden-showcase.webm'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    camera.position.copy(savedPos); controls.target.copy(savedTarget); controls.update();
    userLights=savedUserLights; greenhouseVentUser=savedGreenUser;
    recording=false; recordBtn.disabled=false; recordBtn.textContent='● Record video';
  };
  rec.start(250);
  const t0=performance.now();
  function step(){
    const el=(performance.now()-t0)/1000;
    const t=Math.min(el, SHOWCASE_DURATION);
    showcaseFrame(t);
    recordBtn.textContent=`● Recording ${t.toFixed(1)}s`;
    if(el<SHOWCASE_DURATION+0.12){ requestAnimationFrame(step); }
    else { rec.stop(); }
  }
  requestAnimationFrame(step);
});

/* ============================================================ main loop (interactive default) */
const clock=new THREE.Clock();
let T=0;
function animate(){
  requestAnimationFrame(animate);
  if(recording) return;           // recorder drives its own frames
  if(ORBIT && !orbitVisible){ clock.getDelta(); return; }
  const dt=Math.min(clock.getDelta(),0.05);
  T+=dt;
  orbitStep();
  controls.update();
  renderFrame(T,{});
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloomPass.setSize(innerWidth,innerHeight);
});
</script>
