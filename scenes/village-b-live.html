<!DOCTYPE html>

<style>
    html, body {
        margin: 0; padding: 0; overflow: hidden;
        background: #1a120c; height: 100%;
        font-family: Georgia, 'Times New Roman', serif;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* cinematic vignette */
    #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(20,8,4,0.28) 78%, rgba(10,4,2,0.62) 100%);
    }
    #grade {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background: linear-gradient(to bottom, rgba(80,30,60,0.10), rgba(0,0,0,0) 30%, rgba(40,16,4,0.14));
        mix-blend-mode: multiply;
    }
    .ui { position: fixed; z-index: 10; pointer-events: none; color: #f7e3c2; }
    #title {
        top: 26px; left: 34px;
        text-shadow: 0 2px 18px rgba(30,8,0,0.9), 0 0 2px rgba(0,0,0,0.8);
        opacity: 0; animation: fadeIn 2.4s ease 0.4s forwards;
    }
    #title h1 {
        margin: 0; font-size: 34px; letter-spacing: 0.42em; font-weight: normal;
        color: #ffe9c4; text-transform: uppercase;
    }
    #title p {
        margin: 6px 0 0 2px; font-style: italic; font-size: 13px;
        color: #e8b87a; letter-spacing: 0.14em;
    }
    #title .rule {
        width: 150px; height: 1px; margin-top: 10px;
        background: linear-gradient(to right, #f0b060, rgba(240,176,96,0));
    }
    #hint {
        bottom: 22px; left: 50%; transform: translateX(-50%);
        font-size: 12px; letter-spacing: 0.22em; color: #f2cf9e;
        text-shadow: 0 1px 10px rgba(0,0,0,0.85);
        padding: 8px 22px; border: 1px solid rgba(242,207,158,0.28);
        border-radius: 2px; background: rgba(20,10,4,0.32); backdrop-filter: blur(3px);
        transition: opacity 1.4s ease; white-space: nowrap;
        opacity: 0; animation: fadeIn 2s ease 1.2s forwards;
    }
    #credit {
        bottom: 20px; right: 26px; font-size: 10px; letter-spacing: 0.2em;
        color: rgba(242,207,158,0.55); text-shadow: 0 1px 6px #000;
    }
    @keyframes fadeIn { to { opacity: 1; } }
  /* blog embed: the scene only */
  .ui{display:none!important}
</style>
</head>
<body>
<script>/* early-embed: hide overlays before the scene script runs */ if (new URLSearchParams(location.search).get("orbit")) document.documentElement.classList.add("embed");</script>
<div id="app"></div>
<div id="vignette"></div>
<div id="grade"></div>

<div class="ui" id="title">
    <h1>Aldermere</h1>
    <div class="rule"></div>
    <p>a medieval village &nbsp;·&nbsp; the golden hour</p>
</div>
<div class="ui" id="hint">DRAG TO ORBIT &nbsp;·&nbsp; SCROLL TO ZOOM</div>
<div class="ui" id="credit">PROCEDURAL · THREE.JS</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

<script>
/* ============================================================
   ALDERMERE — a medieval village at golden hour
   Every model & texture is generated in code. No assets.
   ============================================================ */
'use strict';

// ---------- deterministic RNG (coherent art direction) ----------
let _seed = 1379;
function srand() { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; }
function rr(a, b) { return a + srand() * (b - a); }
function pick(arr) { return arr[Math.floor(srand() * arr.length)]; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------- value noise for terrain ----------
function vhash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = vhash(xi, yi), b = vhash(xi + 1, yi), c = vhash(xi, yi + 1), d = vhash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

const LAKE = { x: -95, z: 20, r: 42 };
function groundHeight(x, z) {
    const r = Math.hypot(x, z);
    let h = (vnoise(x * 0.012 + 7.3, z * 0.012 + 2.1) - 0.5) * 8.0
          + (vnoise(x * 0.045 + 1.7, z * 0.045 + 9.2) - 0.5) * 1.7
          + (vnoise(x * 0.11 + 4.2, z * 0.11 + 5.5) - 0.5) * 0.35;
    h *= smoothstep(58, 155, r);                                   // village stays flat
    const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
    h -= 3.0 * (1 - smoothstep(12, 54, dl));                       // lake basin
    return h;
}

// ============================================================
//  PROCEDURAL TEXTURES (canvas) — map + bump detail
// ============================================================
function makeTex(w, h, draw, opts = {}) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 16;
    if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
    return t;
}
// same canvas feeds both colour and bump so detail correlates
function makeTexPair(w, h, draw, opts = {}) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const map = new THREE.CanvasTexture(c); map.wrapS = map.wrapT = THREE.RepeatWrapping; map.anisotropy = 16;
    const bump = new THREE.CanvasTexture(c); bump.wrapS = bump.wrapT = THREE.RepeatWrapping; bump.anisotropy = 4;
    if (opts.repeat) { map.repeat.set(opts.repeat[0], opts.repeat[1]); bump.repeat.set(opts.repeat[0], opts.repeat[1]); }
    return { map, bump };
}

const grassTex = makeTexPair(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#55682e'; ctx.fillRect(0, 0, w, h);
    // large soft patchiness
    for (let i = 0; i < 90; i++) {
        const g = ctx.createRadialGradient(rr(0,w), rr(0,h), 4, rr(0,w), rr(0,h), rr(40,120));
        const tone = pick(['#5f7334','#4b5d29','#6b7a38','#71803f','#616e30']);
        g.addColorStop(0, tone); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.5; ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
    // dry golden strokes
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 650; i++) {
        ctx.strokeStyle = pick(['#8a8348','#7d7a3c','#9a8a4a','#46541f']);
        ctx.lineWidth = rr(0.6, 1.6);
        const x = rr(0,w), y = rr(0,h), a = rr(0,Math.PI), l = rr(3,10);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); ctx.stroke();
    }
    // speckle
    for (let i = 0; i < 2500; i++) {
        ctx.globalAlpha = rr(0.15, 0.4);
        ctx.fillStyle = pick(['#3c4a20','#7d8a44','#2f3d1c','#93a050']);
        ctx.fillRect(rr(0,w), rr(0,h), rr(1,2.6), rr(1,2.6));
    }
    ctx.globalAlpha = 1;
}, { repeat: [72, 72] });

const dirtTex = makeTexPair(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#7d5f3a'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 500; i++) {
        ctx.globalAlpha = rr(0.1, 0.35); ctx.fillStyle = pick(['#6b4f30','#8f7048','#5a4128','#9c7d52','#4e3822']);
        ctx.beginPath(); ctx.ellipse(rr(0,w), rr(0,h), rr(2,14), rr(2,9), rr(0,3), 0, 7); ctx.fill();
    }
    // twin wheel ruts along u
    ctx.globalAlpha = 0.22; ctx.fillStyle = '#3f2c1c';
    ctx.fillRect(0, h*0.28, w, h*0.09); ctx.fillRect(0, h*0.63, w, h*0.09);
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#a5885c';
    for (let i = 0; i < 300; i++) { ctx.beginPath(); ctx.arc(rr(0,w), rr(0,h), rr(0.5,1.8), 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
}, { repeat: [1, 6] });

const plasterTex = makeTexPair(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#efe4cd'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 240; i++) {
        ctx.globalAlpha = rr(0.04, 0.13);
        ctx.fillStyle = pick(['#e2d4b8','#f7efdd','#d4c6a8','#cbbc9e','#faf3e6']);
        ctx.beginPath(); ctx.ellipse(rr(0,w), rr(0,h), rr(8,44), rr(6,30), rr(0,3), 0, 7); ctx.fill();
    }
    // hairline cracks
    ctx.strokeStyle = '#8a7a5e';
    for (let i = 0; i < 10; i++) {
        ctx.globalAlpha = rr(0.15, 0.3); ctx.lineWidth = rr(0.5, 1.1);
        let x = rr(0, w), y = rr(0, h * 0.4); ctx.beginPath(); ctx.moveTo(x, y);
        for (let s = 0; s < 5; s++) { x += rr(-16, 16); y += rr(10, 34); ctx.lineTo(x, y); }
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
});

const woodTex = makeTexPair(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#6f4a2a'; ctx.fillRect(0, 0, w, h);
    const pw = 32;
    for (let x = 0; x < w; x += pw) {
        const tone = rr(-22, 22);
        ctx.fillStyle = `rgb(${111+tone|0},${74+tone*0.7|0},${42+tone*0.5|0})`;
        ctx.fillRect(x, 0, pw, h);
        // grain
        for (let gLine = 0; gLine < 6; gLine++) {
            ctx.strokeStyle = 'rgba(46,28,14,0.35)'; ctx.lineWidth = rr(0.6, 1.6);
            let gx = x + rr(4, pw - 4); ctx.beginPath(); ctx.moveTo(gx, 0);
            for (let y = 0; y <= h; y += 16) ctx.lineTo(gx + Math.sin(y * 0.05 + gLine) * 3 + rr(-1.5, 1.5), y);
            ctx.stroke();
        }
        // knot
        if (srand() < 0.55) {
            const kx = x + rr(8, pw - 8), ky = rr(20, h - 20);
            ctx.fillStyle = 'rgba(52,32,16,0.8)';
            ctx.beginPath(); ctx.ellipse(kx, ky, rr(3,5.5), rr(4,7), 0, 0, 7); ctx.fill();
            ctx.strokeStyle = 'rgba(90,60,32,0.8)'; ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.ellipse(kx, ky, rr(6,9), rr(8,12), 0, 0, 7); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(30,18,8,0.85)'; ctx.fillRect(x, 0, 2, h);
    }
});

const roofTexTerra = makeTexPair(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#5a3322'; ctx.fillRect(0, 0, w, h);
    const tw = 30, th = 26;
    let row = 0;
    for (let y = -th; y < h + th; y += th * 0.62, row++) {
        const off = (row % 2) * tw * 0.5;
        for (let x = -tw; x < w + tw; x += tw) {
            const tone = rr(-26, 30);
            const g = ctx.createLinearGradient(0, y, 0, y + th);
            g.addColorStop(0, `rgb(${196+tone|0},${110+tone*0.6|0},${66+tone*0.4|0})`);
            g.addColorStop(0.75, `rgb(${150+tone|0},${80+tone*0.6|0},${46+tone*0.4|0})`);
            g.addColorStop(1, `rgb(${88+tone*0.5|0},${46+tone*0.4|0},${28+tone*0.3|0})`);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(x + off + 2, y);
            ctx.lineTo(x + off + tw - 2, y);
            ctx.lineTo(x + off + tw - 2, y + th - 6);
            ctx.arc(x + off + tw/2, y + th - 6, tw/2 - 2, 0, Math.PI, false);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = 'rgba(30,14,8,0.55)'; ctx.fillRect(0, y + th * 0.62 - 3, w, 4);
    }
});

const roofTexSlate = makeTexPair(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#2c2e34'; ctx.fillRect(0, 0, w, h);
    const tw = 26, th = 30;
    let row = 0;
    for (let y = -th; y < h + th; y += th * 0.6, row++) {
        const off = (row % 2) * tw * 0.5;
        for (let x = -tw; x < w + tw; x += tw) {
            const tone = rr(-18, 22);
            const g = ctx.createLinearGradient(0, y, 0, y + th);
            g.addColorStop(0, `rgb(${118+tone|0},${122+tone|0},${136+tone|0})`);
            g.addColorStop(1, `rgb(${58+tone|0},${60+tone|0},${72+tone|0})`);
            ctx.fillStyle = g;
            ctx.fillRect(x + off + 1.5, y, tw - 3, th - 2);
        }
        ctx.fillStyle = 'rgba(8,8,12,0.6)'; ctx.fillRect(0, y + th * 0.6 - 3, w, 4);
    }
});

const stoneTex = makeTexPair(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#43403a'; ctx.fillRect(0, 0, w, h);   // mortar
    const rowH = 34;
    let row = 0;
    for (let y = 0; y < h; y += rowH, row++) {
        let x = (row % 2) ? -22 : 0;
        while (x < w) {
            const bw = rr(34, 66), tone = rr(-18, 20);
            const g = ctx.createLinearGradient(0, y, 0, y + rowH);
            g.addColorStop(0, `rgb(${158+tone|0},${152+tone|0},${140+tone|0})`);
            g.addColorStop(1, `rgb(${104+tone|0},${100+tone|0},${92+tone|0})`);
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x + 3, y + 3, bw - 6, rowH - 6, 7)
                                           : ctx.rect(x + 3, y + 3, bw - 6, rowH - 6);
            ctx.fill();
            ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff';
            ctx.fillRect(x + 6, y + 5, bw - 12, 3); ctx.globalAlpha = 1;
            x += bw;
        }
    }
});

const cobbleTex = makeTexPair(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#3e3b36'; ctx.fillRect(0, 0, w, h);
    const s = 22;
    for (let y = 0; y < h; y += s) {
        for (let x = 0; x < w; x += s) {
            const tone = rr(-16, 18), jx = rr(-2, 2), jy = rr(-2, 2);
            ctx.fillStyle = `rgb(${140+tone|0},${136+tone|0},${126+tone|0})`;
            ctx.beginPath(); ctx.ellipse(x + s/2 + jx, y + s/2 + jy, s/2 - 2.5, s/2 - 3.5, 0, 0, 7); ctx.fill();
            ctx.globalAlpha = 0.3; ctx.fillStyle = '#d8d2c4';
            ctx.beginPath(); ctx.ellipse(x + s/2 + jx - 2, y + s/2 + jy - 2.5, s/4, s/5, 0, 0, 7); ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}, { repeat: [7, 7] });

const strawTex = makeTexPair(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#c2a052'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 340; i++) {
        ctx.globalAlpha = rr(0.35, 0.75);
        ctx.strokeStyle = pick(['#e3c46e','#a8843a','#d4b45c','#8f7030','#f0d886']);
        ctx.lineWidth = rr(0.7, 2.2);
        const y = rr(0, h); ctx.beginPath(); ctx.moveTo(-10, y);
        for (let x = 0; x <= w + 10; x += 24) ctx.lineTo(x, y + Math.sin(x * 0.06 + i) * 3 + rr(-1.5, 1.5));
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
});

function stripeTex(a, b) {
    return makeTex(128, 128, (ctx, w, h) => {
        for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? a : b; ctx.fillRect(i * w / 8, 0, w / 8, h); }
        ctx.globalAlpha = 0.14; ctx.fillStyle = '#000';
        for (let i = 0; i < 240; i++) ctx.fillRect(rr(0,w), rr(0,h), rr(1,3), rr(1,3));
        ctx.globalAlpha = 1;
    });
}
const awningRed = stripeTex('#a83a2c', '#e8dcc2');
const awningGreen = stripeTex('#3e6034', '#e8dcc2');
const awningBlue = stripeTex('#344a68', '#e8dcc2');

// soft radial glow (lanterns, fireflies, sun halo sprite)
const glowTex = makeTex(64, 64, (ctx, w, h) => {
    const g = ctx.createRadialGradient(32, 32, 1, 32, 32, 31);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.28, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});
const smokeTex = makeTex(64, 64, (ctx, w, h) => {
    const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
    g.addColorStop(0, 'rgba(215,208,200,0.85)');
    g.addColorStop(0.55, 'rgba(205,198,190,0.35)');
    g.addColorStop(1, 'rgba(200,195,188,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});
const cloudTex = makeTex(256, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < 17; i++) {
        const x = rr(45, w - 45), y = rr(42, 82), r = rr(18, 42);
        const g = ctx.createRadialGradient(x, y, 1, x, y, r);
        g.addColorStop(0, 'rgba(255,244,232,0.85)');
        g.addColorStop(0.6, 'rgba(250,228,215,0.4)');
        g.addColorStop(1, 'rgba(250,228,215,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
});
const grassBladeTex = makeTex(128, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < 22; i++) {
        const bx = rr(14, 114), tx = bx + rr(-20, 20), ty = rr(8, 78), bw = rr(2.6, 5.4);
        ctx.fillStyle = pick(['#5f7030','#6d7f3a','#7d8a44','#4e5e26','#87924c']);
        ctx.beginPath();
        ctx.moveTo(bx - bw, 128);
        ctx.quadraticCurveTo(bx - bw * 0.3, 70, tx, ty);
        ctx.quadraticCurveTo(bx + bw * 0.3, 70, bx + bw, 128);
        ctx.closePath(); ctx.fill();
    }
});
const winGlowTex = makeTex(64, 80, (ctx, w, h) => {   // warm mullioned window
    const g = ctx.createRadialGradient(32, 38, 4, 32, 40, 46);
    g.addColorStop(0, '#ffdf9a'); g.addColorStop(0.55, '#f7a94e'); g.addColorStop(1, '#8a4416');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#241408'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, w, h);
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(32, 0); ctx.lineTo(32, h); ctx.moveTo(0, 40); ctx.lineTo(w, 40); ctx.stroke();
});
const archGlowTex = makeTex(64, 96, (ctx, w, h) => {   // church lancet window
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#ffe6a4'); g.addColorStop(0.5, '#f2a04c'); g.addColorStop(1, '#7e3c12');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(6, h); ctx.lineTo(6, 26); ctx.quadraticCurveTo(6, 2, 32, 2); ctx.quadraticCurveTo(58, 2, 58, 26); ctx.lineTo(58, h);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(32, 4); ctx.lineTo(32, h); ctx.moveTo(6, 52); ctx.lineTo(58, 52); ctx.stroke();
});
const roseTex = makeTex(128, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#ffcf86'; ctx.fillStyle = '#ffb050';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(64, 64, 52, 0, 7); ctx.stroke();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(64, 64, 34, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(64, 64, 13, 0, 7); ctx.fill();
    ctx.lineWidth = 5;
    for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath(); ctx.moveTo(64 + Math.cos(a) * 14, 64 + Math.sin(a) * 14);
        ctx.lineTo(64 + Math.cos(a) * 50, 64 + Math.sin(a) * 50); ctx.stroke();
    }
});

// ============================================================
//  RENDERER / SCENE / CAMERA
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

/* ---------- blog embed (?orbit=1): both villages are circled from the same angle, in step ----------
   The angle comes from the wall clock, so the two pages stay together without talking to each other; dragging one
   (mouse or trackpad) turns both, through a BroadcastChannel. */
const ORBIT = new URLSearchParams(location.search).get('orbit') ? { dist: 60, elev: 0.2, period: +new URLSearchParams(location.search).get('period') || 60, off: 0 } : null;
let orbitVisible = true;
if (ORBIT){
  camera.fov = 50; camera.updateProjectionMatrix();
  controls.enabled = false; controls.enableDamping = false; controls.autoRotate = false;
  const ch = 'BroadcastChannel' in window ? new BroadcastChannel('village-orbit') : null;
  if (ch) ch.onmessage = e => { if (typeof e.data === 'number') ORBIT.off = e.data; };
  const el = renderer.domElement; let drag = null;
  if (matchMedia('(hover: hover) and (pointer: fine)').matches){
    el.style.cursor = 'grab';
    el.addEventListener('pointerdown', e => { drag = { x: e.clientX, off: ORBIT.off }; el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', e => { if (!drag) return; ORBIT.off = drag.off - (e.clientX - drag.x) * 0.008; if (ch) ch.postMessage(ORBIT.off); });
    const end = () => { drag = null; el.style.cursor = 'grab'; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  } else el.style.pointerEvents = 'none';
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { orbitVisible = es[0].isIntersecting; }).observe(document.documentElement);
}
function orbitStep(){
  if (!ORBIT) return;
  const a = 0.66 + ORBIT.off + (Date.now() / 1000 % ORBIT.period) / ORBIT.period * Math.PI * 2;
  const r = ORBIT.dist * Math.cos(ORBIT.elev);
  camera.position.set(Math.sin(a) * r, 2.5 + ORBIT.dist * Math.sin(ORBIT.elev), Math.cos(a) * r);
  controls.target.set(0, 2.5, 0); camera.lookAt(0, 2.5, 0);
}

const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uSunDir: { value: SUN_DIR.clone() }, uTime: { value: 0 } },
    vertexShader: `
        varying vec3 vDir;
        void main() {
            vDir = position;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
        }`,
    fragmentShader: `
        varying vec3 vDir;
        uniform vec3 uSunDir; uniform float uTime;
        // tiny hash noise just to dither gradient banding
        float hash21(vec2 p){ p = fract(p * vec2(234.34, 435.345)); p += dot(p, p + 34.23); return fract(p.x * p.y); }
        void main() {
            vec3 d = normalize(vDir);
            float h = clamp(d.y, -0.1, 1.0);
            vec3 zen = vec3(0.13, 0.18, 0.34);        // violet dusk zenith
            vec3 mid = vec3(0.52, 0.28, 0.36);        // dusty rose
            vec3 low = vec3(0.96, 0.47, 0.20);        // ember orange
            vec3 hor = vec3(1.30, 0.62, 0.24);        // hot HDR horizon (blooms)
            vec3 col = mix(hor, low, smoothstep(0.0, 0.07, h));
            col = mix(col, mid, smoothstep(0.05, 0.22, h));
            col = mix(col, zen, smoothstep(0.17, 0.62, h));
            float s = max(dot(d, uSunDir), 0.0);
            col += vec3(1.15, 0.85, 0.48) * pow(s, 900.0) * 2.4;   // solar core
            col += vec3(1.10, 0.66, 0.30) * pow(s, 90.0) * 0.9;    // inner halo
            col += vec3(0.95, 0.50, 0.20) * pow(s, 9.0) * 0.34;    // broad warm wash
            col += vec3(0.60, 0.28, 0.14) * pow(s, 2.2) * 0.10;
            // subtle high cloud streaks tinted by the sun
            float streak = sin(d.y * 90.0 + sin(atan(d.z, d.x) * 7.0) * 2.0) * 0.5 + 0.5;
            streak *= smoothstep(0.06, 0.16, d.y) * smoothstep(0.5, 0.18, d.y);
            col += vec3(1.0, 0.55, 0.35) * streak * 0.06 * (0.4 + 0.6 * pow(s, 3.0));
            // dither
            col += (hash21(gl_FragCoord.xy + uTime) - 0.5) * 0.012;
            // fade to fog colour below the horizon line
            col = mix(vec3(0.88, 0.60, 0.36), col, smoothstep(-0.1, 0.015, d.y));
            gl_FragColor = vec4(col, 1.0);
        }`
});

function mountainRing(radius, count, hMin, hMax, color, seedOff) {
    const mat = new THREE.MeshLambertMaterial({ color, flatShading: true });
    for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + seedOff + rr(-0.1, 0.1);
        const r = radius + rr(-35, 35);
        const h = rr(hMin, hMax);
        const cone = new THREE.Mesh(new THREE.ConeGeometry(rr(42, 78), h, Math.floor(rr(5, 8))), mat);
        cone.position.set(Math.cos(a) * r, h * 0.32 - 6, Math.sin(a) * r);
        cone.rotation.y = rr(0, Math.PI);
        scene.add(cone);
    }
}

const waterMat = new THREE.ShaderMaterial({
    transparent: true, fog: false,
    uniforms: {
        uTime: { value: 0 },
        uSunDir: { value: SUN_DIR.clone() }
    },
    vertexShader: `
        varying vec3 vWorld;
        void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorld = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
    fragmentShader: `
        uniform float uTime; uniform vec3 uSunDir;
        varying vec3 vWorld;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){
            vec2 i = floor(p), f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                       mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        void main() {
            vec3 V = normalize(cameraPosition - vWorld);
            vec2 p = vWorld.xz * 0.16;
            // layered moving ripple normal
            float nx = noise(p * 1.4 + vec2(uTime * 0.32, uTime * 0.13)) - 0.5
                     + (noise(p * 4.2 - vec2(uTime * 0.42, uTime * 0.2)) - 0.5) * 0.5;
            float nz = noise(p * 1.4 + vec2(uTime * 0.21 + 53.0, uTime * 0.3)) - 0.5
                     + (noise(p * 4.2 + vec2(uTime * 0.19 + 17.0, uTime * 0.38)) - 0.5) * 0.5;
            vec3 N = normalize(vec3(nx * 0.32, 1.0, nz * 0.32));
            vec3 R = reflect(-V, N);
            float fres = pow(1.0 - max(dot(V, N), 0.0), 3.0);
            fres = mix(0.18, 1.0, fres);
            vec3 deep = vec3(0.045, 0.115, 0.165);
            vec3 rh = clamp(R, 0.0, 1.0);
            vec3 skyRef = mix(vec3(1.02, 0.52, 0.22), vec3(0.24, 0.22, 0.38), smoothstep(0.02, 0.52, rh.y));
            skyRef = mix(skyRef, vec3(1.05, 0.72, 0.36), pow(max(dot(normalize(vec2(R.x, R.z)), normalize(vec2(uSunDir.x, uSunDir.z))), 0.0), 6.0) * (1.0 - smoothstep(0.0, 0.45, rh.y)) * 0.8);
            vec3 col = mix(deep, skyRef, fres);
            // blazing sun glitter path
            float sd = max(dot(R, normalize(uSunDir)), 0.0);
            col += vec3(1.35, 0.82, 0.38) * pow(sd, 480.0) * 3.0;
            col += vec3(1.00, 0.55, 0.22) * pow(sd, 48.0) * 0.42;
            col += vec3(0.95, 0.60, 0.30) * pow(sd, 7.0) * 0.16;
            // sparkle flecks
            float sp = pow(noise(p * 14.0 + vec2(uTime * 0.9, -uTime * 0.7)), 9.0);
            col += vec3(1.0, 0.75, 0.4) * sp * 1.4 * (0.4 + 0.6 * fres);
            gl_FragColor = vec4(col, 0.94);
        }`
});

function makeGableRoofGeo(len, wid, h, ov) {
    const L = len / 2 + ov, E = wid / 2 + ov;
    const slope = Math.hypot(E, h);
    const pos = new Float32Array([
        -L, 0, -E,   L, 0, -E,   L, h, 0,
        -L, 0, -E,   L, h, 0,   -L, h, 0,
         L, 0,  E,  -L, 0,  E,  -L, h, 0,
         L, 0,  E,  -L, h, 0,    L, h, 0
    ]);
    const us = len / 3.1, vs = slope / 3.1;
    const uv = new Float32Array([
        0, 0,  us, 0,  us, vs,
        0, 0,  us, vs,  0, vs,
        0, 0,  us, 0,  us, vs,
        0, 0,  us, vs,  0, vs
    ]);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.computeVertexNormals();
    return g;
}
function makeGableFill(len, wid, h, mat) {
    const tri = new THREE.Shape([new THREE.Vector2(-wid / 2, 0), new THREE.Vector2(wid / 2, 0), new THREE.Vector2(0, h)]);
    const g = new THREE.ExtrudeGeometry(tri, { depth: len, bevelEnabled: false });
    g.rotateY(Math.PI / 2);
    g.translate(-len / 2, 0, 0);
    return new THREE.Mesh(g, mat);
}
function addBeamBox(parent, w, h, d, x, y, z, rz = 0) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), beamMat);
    m.position.set(x, y, z); m.rotation.z = rz;
    m.castShadow = true;
    parent.add(m);
    return m;
}

// ---- Half-timbered house with per-house variation ----
function buildHouse(cfg) {
    const { len, wid, floors, roofH, plasterMat, roofMat, trimColor } = cfg;
    const floorH = 2.45, wallH = floors * floorH;
    const g = new THREE.Group();

    const walls = new THREE.Mesh(new THREE.BoxGeometry(len, wallH, wid), plasterMat);
    walls.position.y = wallH / 2;
    walls.castShadow = true; walls.receiveShadow = true;
    g.add(walls);

    const gable = makeGableFill(len, wid, roofH, plasterMat);
    gable.position.y = wallH; gable.castShadow = true;
    g.add(gable);

    // overhanging roof + ridge cap
    const roof = new THREE.Mesh(makeGableRoofGeo(len + 0.28, wid + 0.28, roofH, 0.62), roofMat);
    roof.position.y = wallH; roof.castShadow = true; roof.receiveShadow = true;
    g.add(roof);
    const ridge = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, len + 1.35, 6), roofMat === roofTerraMat ? woodDarkMat : new THREE.MeshStandardMaterial({ color: 0x3a3d46, roughness: 0.8 }));
    ridge.rotation.z = Math.PI / 2; ridge.position.y = wallH + roofH + 0.02;
    g.add(ridge);

    // ---- timber frame ----
    const ov = 0.055;
    // corner posts
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sz]) => {
        addBeamBox(g, 0.24, wallH + 0.1, 0.24, sx * (len/2 + ov*0.4), wallH/2, sz * (wid/2 + ov*0.4));
    });
    // horizontal plates at each floor line and eaves
    for (let f = 1; f <= floors; f++) {
        const y = f * floorH;
        const p1 = addBeamBox(g, len + 0.16, 0.2, 0.12, 0, y - 0.02, wid/2 + ov); p1.castShadow = true;
        const p2 = p1.clone(); p2.position.z = -(wid/2 + ov); g.add(p2);
        const p3 = addBeamBox(g, 0.12, 0.2, wid + 0.16, len/2 + ov, y - 0.02, 0);
        const p4 = p3.clone(); p4.position.x = -(len/2 + ov); g.add(p4);
    }
    // vertical studs
    const studCount = Math.max(2, Math.floor(len / 1.7));
    for (let s = 1; s < studCount; s++) {
        const x = -len/2 + (s / studCount) * len;
        addBeamBox(g, 0.15, wallH, 0.1, x, wallH/2, wid/2 + ov);
        addBeamBox(g, 0.15, wallH, 0.1, x, wallH/2, -(wid/2 + ov));
    }
    const studS = Math.max(1, Math.floor(wid / 1.7));
    for (let s = 1; s < studS; s++) {
        const z = -wid/2 + (s / studS) * wid;
        addBeamBox(g, 0.1, wallH, 0.15, len/2 + ov, wallH/2, z);
        addBeamBox(g, 0.1, wallH, 0.15, -(len/2 + ov), wallH/2, z);
    }
    // diagonal braces — the signature half-timber look
    const braceFaces = [{ z: wid/2 + ov, sign: 1 }, { z: -(wid/2 + ov), sign: 1 }];
    braceFaces.forEach(({ z }) => {
        const n = floors;
        for (let f = 0; f < n; f++) {
            const yC = f * floorH + floorH / 2;
            const dir = (f % 2 === 0) ? 1 : -1;
            const b1 = addBeamBox(g, 0.13, floorH * 1.32, 0.1, -len/4 * dir, yC, z, dir * 0.62);
            const b2 = addBeamBox(g, 0.13, floorH * 1.32, 0.1,  len/4 * dir, yC, z, -dir * 0.62);
            b1.castShadow = b2.castShadow = true;
        }
    });

    // ---- windows ----
    const trimMat = new THREE.MeshStandardMaterial({ color: trimColor, roughness: 0.8 });
    const winGeo = new THREE.PlaneGeometry(0.58, 0.72);
    const frameGeo = new THREE.BoxGeometry(0.76, 0.9, 0.06);
    function addWindow(x, y, z, ry) {
        const lit = srand() < 0.42;
        const frame = new THREE.Mesh(frameGeo, trimMat);
        frame.position.set(x, y, z); frame.rotation.y = ry;
        g.add(frame);
        const win = new THREE.Mesh(winGeo, lit ? winLitMat : winDarkMat);
        win.position.set(x + Math.sin(ry) * 0.036, y, z + Math.cos(ry) * 0.036);
        win.rotation.y = ry;
        g.add(win);
        // shutters on some windows
        if (srand() < 0.7) {
            const sw = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.78, 0.04),
                new THREE.MeshStandardMaterial({ color: pick([0x4e5e3a, 0x54424e, 0x3e4a5e, 0x5e3a34]), roughness: 0.85 }));
            const side = srand() < 0.5 ? 1 : -1;
            sw.position.set(x + Math.cos(ry) * 0.52 * side, y, z - Math.sin(ry) * 0.52 * side);
            sw.rotation.y = ry;
            g.add(sw);
        }
    }
    for (let f = 0; f < floors; f++) {
        const y = f * floorH + floorH * 0.55;
        const wx = len * 0.26;
        if (f > 0 || srand() < 0.85) {
            addWindow(-wx, y, wid/2 + ov + 0.045, 0);
            addWindow( wx, y, wid/2 + ov + 0.045, 0);
        }
        addWindow(-wx, y, -(wid/2 + ov + 0.045), Math.PI);
        addWindow( wx, y, -(wid/2 + ov + 0.045), Math.PI);
        if (srand() < 0.8) addWindow(len/2 + ov + 0.045, y, 0, Math.PI/2);
        if (srand() < 0.8) addWindow(-(len/2 + ov + 0.045), y, 0, -Math.PI/2);
    }

    // ---- door (front, +z) ----
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.06, 1.78, 0.12), woodDarkMat);
    door.position.set(0, 0.89, wid/2 + 0.07); door.castShadow = true;
    g.add(door);
    const doorTop = new THREE.Mesh(new THREE.CylinderGeometry(0.53, 0.53, 0.12, 12, 1, false, 0, Math.PI), woodDarkMat);
    doorTop.rotation.x = Math.PI / 2; doorTop.rotation.z = Math.PI / 2;
    doorTop.position.set(0, 1.78, wid/2 + 0.07);
    g.add(doorTop);
    [-0.36, 0.36].forEach(x => {
        const band = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.07, 0.02), beamMatDark);
        band.position.set(x * 0.8, 1.15 - Math.abs(x) * 0.3, wid/2 + 0.135);
        g.add(band);
    });
    const step = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.18, 0.5), stoneMat);
    step.position.set(0, 0.09, wid/2 + 0.32); step.receiveShadow = true;
    g.add(step);

    // ---- chimney + smoke registration ----
    if (srand() < 0.72) {
        const chX = rr(-len/4, len/4);
        const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.46, 1.5, 0.46), stoneMat);
        chimney.position.set(chX, wallH + roofH * 0.72, 0);
        chimney.castShadow = true;
        g.add(chimney);
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.16, 0.68), stoneMat);
        cap.position.set(chX, wallH + roofH * 0.72 + 0.78, 0);
        g.add(cap);
        chimneySpots.push({ house: g, local: new THREE.Vector3(chX, wallH + roofH * 0.72 + 0.95, 0) });
    }
    return g;
}

function fruitPyramid(parent, x, y, z, color) {
    const geo = new THREE.SphereGeometry(0.085, 8, 6);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.45 });
    const offs = [[0,0,0],[-0.13,0,0],[0.13,0,0],[0,0,0.13],[0,0,-0.13],[-0.075,0.13,0],[0.075,0.13,0],[0,0,0.075],[0,0,-0.075],[0,0.24,0]];
    offs.forEach(([ox, oy, oz]) => {
        const f = new THREE.Mesh(geo, mat);
        f.position.set(x + ox, y + oy, z + oz); f.castShadow = true;
        parent.add(f);
    });
}
function buildStall(angle, awning, goodsKind) {
    const s = new THREE.Group();
    const R = 6.4;
    s.position.set(Math.cos(angle) * R, 0, Math.sin(angle) * R);
    s.rotation.y = -angle - Math.PI / 2;             // face the well
    // counter
    const counter = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.14, 1.15), woodMat);
    counter.position.y = 0.94; counter.castShadow = true; s.add(counter);
    const front = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.82, 0.09), woodDarkMat);
    front.position.set(0, 0.49, 0.55); s.add(front);
    [[-1.05, -0.45], [1.05, -0.45], [-1.05, 0.45], [1.05, 0.45]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.11, 2.15, 0.11), woodMat);
        leg.position.set(x, 1.07, z); leg.castShadow = true; s.add(leg);
    });
    // awning
    const awn = new THREE.Mesh(new THREE.PlaneGeometry(2.65, 1.5),
        new THREE.MeshStandardMaterial({ map: awning, side: THREE.DoubleSide, roughness: 0.85 }));
    awn.position.set(0, 2.22, 0.08); awn.rotation.x = -0.32; awn.castShadow = true;
    s.add(awn);
    const scallop = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 2.65, 8, 1, false, 0, Math.PI),
        new THREE.MeshStandardMaterial({ map: awning, roughness: 0.85 }));
    scallop.rotation.z = Math.PI / 2; scallop.position.set(0, 2.0, 0.78);
    s.add(scallop);
    // crate under counter goods
    const crate = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.4, 0.55), woodMat);
    crate.position.set(-0.62, 1.2, 0.12); crate.castShadow = true; s.add(crate);
    // goods by kind
    if (goodsKind === 0) {         // orchard fruit
        fruitPyramid(s, -0.62, 1.49, 0.12, 0xd8622a);
        fruitPyramid(s,  0.35, 1.08, 0.05, 0xa8342c);
        fruitPyramid(s,  0.82, 1.08, 0.18, 0x86a03c);
    } else if (goodsKind === 1) {  // cheese & bread
        const cheeseMat = new THREE.MeshStandardMaterial({ color: 0xd8b452, roughness: 0.6 });
        [[-0.5, 0.1], [0.1, -0.15], [0.68, 0.18]].forEach(([x, z], i) => {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.12, 14), cheeseMat);
            wheel.position.set(x, 1.07 + i * 0.001, z); wheel.castShadow = true; s.add(wheel);
        });
        const breadMat = new THREE.MeshStandardMaterial({ color: 0xb98a4a, roughness: 0.8 });
        for (let i = 0; i < 4; i++) {
            const loaf = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), breadMat);
            loaf.scale.set(1.5, 0.75, 0.9);
            loaf.position.set(-0.75 + i * 0.5, 1.13, -0.32); s.add(loaf);
        }
    } else if (goodsKind === 2) {  // cloth bolts
        [0x8a3a3a, 0x3a5a7a, 0x6a5a2a].forEach((c, i) => {
            const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.85, 10),
                new THREE.MeshStandardMaterial({ color: c, roughness: 0.75 }));
            roll.rotation.z = Math.PI / 2;
            roll.position.set(0, 1.12 + i * 0.24, 0.1 - i * 0.22); roll.castShadow = true; s.add(roll);
        });
    } else {                       // vegetables & pumpkins
        const pump = new THREE.MeshStandardMaterial({ color: 0xc46a24, roughness: 0.55 });
        const cabb = new THREE.MeshStandardMaterial({ color: 0x6a8a44, roughness: 0.7 });
        [[-0.7, 0.2, pump, 0.19], [-0.2, -0.12, pump, 0.16], [0.3, 0.15, cabb, 0.15], [0.8, -0.05, pump, 0.17], [0.35, -0.28, cabb, 0.12]].forEach(([x, z, m, r]) => {
            const p = new THREE.Mesh(new THREE.SphereGeometry(r, 9, 7), m);
            p.scale.y = 0.8; p.position.set(x, 1.13, z); p.castShadow = true; s.add(p);
        });
    }
    scene.add(s);
    return s;
}

function fenceRun(x1, z1, x2, z2, step = 2.3) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const n = Math.floor(len / step);
    const ang = Math.atan2(dx, dz);
    for (let i = 0; i <= n; i++) {
        const t = i / n;
        fencePosts.push({ x: x1 + dx * t, z: z1 + dz * t, tilt: rr(-0.06, 0.06) });
        if (i < n) {
            const nx = x1 + dx * (i + 0.5) / n, nz = z1 + dz * (i + 0.5) / n;

                rail.rotation.y = ang;
                rail.rotation.x = rr(-0.03, 0.03);
                rail.castShadow = true;
                scene.add(rail);
            });
        }
    }
}

function scatterPositions(count, rMin, rMax, avoidLake = true) {
    const pts = [];
    let guard = 0;
    while (pts.length < count && guard++ < count * 40) {
        const a = srand() * Math.PI * 2;
        const r = Math.sqrt(srand() * (rMax * rMax - rMin * rMin) + rMin * rMin);
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        if (avoidLake && Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 6) continue;
        pts.push({ x, z });
    }
    return pts;
}

function makeLoop(points, closed) {
    const pts = points.map(p => new THREE.Vector3(p[0], 0, p[1]));
    const segLens = []; let total = 0;
    const n = closed ? pts.length : pts.length - 1;
    for (let i = 0; i < n; i++) {
        const l = pts[i].distanceTo(pts[(i + 1) % pts.length]);
        segLens.push(l); total += l;
    }
    return { pts, segLens, total, closed };
}

function samplePath(path, d, dir) {
    d = ((d % path.total) + path.total) % path.total;
    let acc = 0;
    for (let i = 0; i < path.segLens.length; i++) {
        if (d <= acc + path.segLens[i]) {
            const t = (d - acc) / path.segLens[i];
            const a = path.pts[i], b = path.pts[(i + 1) % path.pts.length];
            const p = a.clone().lerp(b, t);
            const tangent = b.clone().sub(a).normalize().multiplyScalar(dir);
            return { p, tangent };
        }
        acc += path.segLens[i];
    }
    return { p: path.pts[0].clone(), tangent: new THREE.Vector3(0, 0, 1) };
}

// ============================================================
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function animate() {
    requestAnimationFrame(animate);
    if (ORBIT && !orbitVisible){ clock.getDelta(); return; }
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // water + sky time
    waterMat.uniforms.uTime.value = t;
    skyMat.uniforms.uTime.value = t * 0.13;

    // windmill — a slow, stately turn
    windmillBlades.rotation.z += dt * 0.42;

    // villagers stroll
    villagers.forEach(v => {
        if (v.path.closed) {
            v.d = (v.d + v.speed * dt) % v.path.total;
        } else {
            v.d += v.speed * dt * v.dir;
            if (v.d > v.path.total) { v.d = v.path.total; v.dir = -1; }
            if (v.d < 0) { v.d = 0; v.dir = 1; }
        }
        const { p, tangent } = samplePath(v.path, v.d, v.dir);
        const bob = Math.abs(Math.sin(t * 6.4 * v.speed + v.phase)) * 0.065;
        v.g.position.set(p.x, bob, p.z);
        tmpV.copy(p).add(tangent);
        v.g.lookAt(tmpV.x, bob, tmpV.z);
        v.g.rotation.z = Math.sin(t * 6.4 * v.speed + v.phase) * 0.035;
    });

    // birds on thermal circles
    birds.forEach(b => {
        const a = t * b.speed + b.phase;
        const px = b.cx + Math.cos(a) * b.r;
        const pz = b.cz + Math.sin(a) * b.r;
        const py = b.cy + Math.sin(t * 0.5 + b.phase) * 2.2;
        b.g.position.set(px, py, pz);
        const dir = b.speed > 0 ? 1 : -1;
        tmpV.set(px - Math.sin(a) * dir, py, pz + Math.cos(a) * dir);
        b.g.lookAt(tmpV);
        const flap = Math.sin(t * b.flapSpeed + b.flapPhase);
        b.wingL.rotation.z = 0.28 + flap * 0.62;
        b.wingR.rotation.z = -0.28 - flap * 0.62;
    });

    // chimney smoke — rise, drift, billow, fade
    smokeParticles.forEach(p => {
        p.age += dt;
        if (p.age > p.maxAge) { p.age = 0; p.maxAge = rr(2.6, 3.8); }
        const k = p.age / p.maxAge;
        const rise = k * 5.2;
        const drift = k * k * 3.4;                       // wind carries it east
        p.spr.position.set(
            p.origin.x + drift + Math.sin(k * 5 + p.seed) * 0.35,
            p.origin.y + rise,
            p.origin.z + drift * 0.35 + Math.cos(k * 4 + p.seed) * 0.3
        );
        const sc = 0.55 + k * 2.5;
        p.spr.scale.set(sc, sc, 1);
        p.spr.material.opacity = 0.42 * (1 - k) * smoothstep(0, 0.1, k);
    });

    // clouds drift across the sunset
    clouds.forEach(c => {
        c.spr.position.x += c.vx * dt;
        if (c.spr.position.x > 460) c.spr.position.x = -460;
    });

    // fireflies wander and pulse
    {
        const attr = fireflyGeo.attributes.position;
        for (let i = 0; i < FIREFLIES; i++) {
            const b = fireflyBase[i];
            attr.setXYZ(i,
                b.bx + Math.sin(t * 0.5 + b.p1) * 1.35,
                b.by + Math.sin(t * 0.8 + b.p2) * 0.55,
                b.bz + Math.cos(t * 0.42 + b.p3) * 1.35
            );
        }
        attr.needsUpdate = true;
        fireflyMat.opacity = 0.62 + Math.sin(t * 1.7) * 0.3;
    }

    // sun disc always faces camera
    sunDisc.lookAt(camera.position);

    orbitStep();
    controls.update();
    composer.render();
}
animate();

// ============================================================
//  RESIZE
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
