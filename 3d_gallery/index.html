<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Gallery · Scaling Self-Verification for Creative Tasks</title>
<meta name="description" content="Eight interactive Three.js scenes generated by Inkling and selected by LLM-as-a-Verifier.">
<style>
:root{--bg:#fff;--fg:#282828;--fg3:#666;--fg4:#676767;--rule:#e6e6e3;
  --font-serif:'Iowan Old Style BT','Iowan Old Style',Charter,'Bitstream Charter','Source Serif 4',Georgia,serif;
  --font-sans:'GT America',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#ececea;--fg3:#a6a6a1;--fg4:#9a9a96;--rule:#2e2e2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:28px 16px 56px}
.back{font-size:13px;color:var(--fg4);text-decoration:none}
.back:hover{color:var(--fg)}
h1{font-family:var(--font-serif);font-weight:600;font-size:30px;line-height:1.3;margin:18px 0 6px;text-wrap:balance}
.lede{font-family:var(--font-serif);font-size:17px;line-height:1.55;color:var(--fg3);margin:0 0 22px;max-width:680px}
.lede a{color:inherit}
.stage{position:relative;aspect-ratio:16/9;background:#05070c;border-radius:6px;overflow:hidden}
.stage iframe{display:block;width:100%;height:100%;border:0}
.stage:fullscreen{aspect-ratio:auto;border-radius:0}
.fs{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border:0;border-radius:8px;background:rgba(18,18,18,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fs:hover{background:rgba(18,18,18,.8)}
.now{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:14px 0 20px;font-size:14px;color:var(--fg4)}
.now b{font-family:var(--font-serif);font-size:19px;font-weight:600;color:var(--fg)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px;align-items:start}
.thumbs button{display:block;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:var(--fg4);text-align:center}
.thumbs img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:4px;opacity:.62;outline:2px solid transparent;outline-offset:2px;transition:opacity .2s,outline-color .2s}
.thumbs span{display:block;margin-top:.5rem;font-size:13px;line-height:1.3}
.thumbs button:hover img,.thumbs button:focus-visible img{opacity:1}
.thumbs button[aria-pressed="true"] img{opacity:1;outline-color:var(--fg)}
.thumbs button[aria-pressed="true"]{color:var(--fg)}
.thumbs button:focus-visible{outline:none}
@media (max-width:760px){.thumbs{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){.thumbs img{transition:none}}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Scaling Self-Verification for Creative Tasks</a>
  <h1>3D Gallery</h1>
  <p class="lede">Interactive Three.js scenes generated by Inkling and selected by <a href="https://llm-as-a-verifier.com/">LLM-as-a-Verifier</a>. Pick a scene, then drag to look around.</p>
  <div class="stage" id="stage"><iframe id="frame" src="../scenes/gallery-black-hole.html?v=4" title="Interactive 3D scene: a black hole with an accretion disk, bent by gravitational lensing." allow="fullscreen"></iframe><button class="fs" id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
  <p class="now"><b id="title">Black Hole Lensing</b><span id="desc">A black hole with an accretion disk, bent by gravitational lensing.</span></p>
  <div class="thumbs" role="group" aria-label="Choose a 3D scene"><button type="button" data-scene="../scenes/gallery-black-hole.html?v=4" data-title="Black Hole Lensing" data-desc="Interactive 3D scene: a black hole with an accretion disk, bent by gravitational lensing." aria-pressed="true"><img src="../demos/gallery-black-hole.jpg?v=2" alt="" width="640" height="360" loading="lazy"><span>Black Hole Lensing</span></button><button type="button" data-scene="../scenes/gallery-bamboo-forest.html?v=4" data-title="Misty Bamboo Forest" data-desc="Interactive 3D scene: a misty bamboo forest swaying in the wind, with shafts of light on a stone path." aria-pressed="false"><img src="../demos/gallery-bamboo-forest.jpg?v=4" alt="" width="640" height="360" loading="lazy"><span>Misty Bamboo Forest</span></button><button type="button" data-scene="../scenes/gallery-city-traffic.html?v=2" data-title="City Traffic at Night" data-desc="Interactive 3D scene: a city at night with traffic moving between lit towers." aria-pressed="false"><img src="../demos/gallery-city-traffic.jpg?v=2" alt="" width="640" height="360" loading="lazy"><span>City Traffic at Night</span></button><button type="button" data-scene="../scenes/gallery-snow-globe.html?v=2" data-title="Snow Globe on a Windowsill" data-desc="Interactive 3D scene: a snow globe on a windowsill with a miniature winter village inside." aria-pressed="false"><img src="../demos/gallery-snow-globe.jpg?v=2" alt="" width="640" height="360" loading="lazy"><span>Snow Globe on a Windowsill</span></button><button type="button" data-scene="../scenes/gallery-gothic-cathedral.html?v=3" data-title="Gothic Cathedral" data-desc="Interactive 3D scene: the interior of a gothic cathedral lit through stained glass." aria-pressed="false"><img src="../demos/gallery-gothic-cathedral.jpg?v=2" alt="" width="640" height="360" loading="lazy"><span>Gothic Cathedral</span></button><button type="button" data-scene="../scenes/gallery-billiards.html?v=3" data-title="Pool Table" data-desc="Interactive 3D scene: a pool table at the break shot." aria-pressed="false"><img src="../demos/gallery-billiards.jpg?v=2" alt="" width="640" height="360" loading="lazy"><span>Pool Table</span></button><button type="button" data-scene="../scenes/gallery-aurora-tundra.html?v=3" data-title="Aurora over the Tundra" data-desc="Interactive 3D scene: aurora curtains rippling over a snowy tundra at night." aria-pressed="false"><img src="../demos/gallery-aurora-tundra.jpg?v=3" alt="" width="640" height="360" loading="lazy"><span>Aurora over the Tundra</span></button><button type="button" data-scene="../scenes/gallery-sand-hourglass.html?v=2" data-title="Sand Hourglass" data-desc="Interactive 3D scene: an hourglass with sand falling from the upper bulb to the lower." aria-pressed="false"><img src="../demos/gallery-sand-hourglass.jpg?v=2" alt="" width="640" height="360" loading="lazy"><span>Sand Hourglass</span></button></div>
</main>
<script>
(function(){
  const frame=document.getElementById('frame'), title=document.getElementById('title'), desc=document.getElementById('desc'), stage=document.getElementById('stage');
  const btns=[...document.querySelectorAll('.thumbs button')];
  const pick=(b,push)=>{ btns.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    frame.src=b.dataset.scene; frame.title=b.dataset.desc; title.textContent=b.dataset.title;
    const d=b.dataset.desc.replace('Interactive 3D scene: ',''); desc.textContent=d.charAt(0).toUpperCase()+d.slice(1);
    if(push) history.replaceState(null,'','#'+b.dataset.scene.match(/gallery-([a-z-]+)/)[1]) };
  btns.forEach(b=>b.addEventListener('click',()=>{ pick(b,true); stage.scrollIntoView({block:'nearest',behavior:'smooth'}) }));
  const want=location.hash.slice(1), hit=want&&btns.find(b=>b.dataset.scene.includes('gallery-'+want+'.'));
  if(hit&&hit!==btns[0]) pick(hit,false);
  document.getElementById('fs').addEventListener('click',()=>{ document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen&&stage.requestFullscreen() });
})();
</script>
</body>
</html>
